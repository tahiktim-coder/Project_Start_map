<!doctype html>
<!--
  SILENT EXODUS · FILM 2 · THE SEA OF SHIPS (mockup, silent). The jump into sector 3, replacing the old "throw" sequence.
  The jump stalls; the stars shrink back to points; our Lander's drive coughs out and its decks go dark one by one until one
  red lamp is left. Then, as if our eyes adjust, we see we are in a graveyard: wrecks of our own class all round us, snapped
  in two, torn open to the frame, burnt black, plates peeled back, loose plating and girders drifting between them, a few with
  a dead red beacon, and every one still pointing at the far light. The camera pulls back, and back, and back, until our ship
  is a red dot in a sea of thousands of wrecks, all on the same heading. One line from A.U.R.A.; the drive relights; white.
  About 42 seconds. Nothing in the game or the other prototypes is changed; this page only LOADS
    ../screens/game-screen-v3/paint.js   V3Paint: the dither recipe, ramps, hull() + shapeL (the Lander), lightGlow, stars
  The wrecks are painted here by paintWreck(): hull() from paint.js with the damage added (breaks with the frame left
  standing, holes torn through to the ribs, burns, missing and peeled plates, bent girders, a dead beacon).
  STILLS: ?t=ms opens paused at that moment · ?words=0 drops the one line · ?newer=1 mixes in longer hulls of a newer kind
          (the spine's later ships; off by default, the designer asked for ships of our own class) · ?px=N forces the pixel size
          window.film.play() / pause() / step(ms) / setTime(ms) / state() / shots
  SKIP: a click, Esc, Enter or Space skips to the end.
  SOUND (optional, OFF by default): the "Sound off" button in the bottom-left corner turns it on; ?sound=1 starts with it on
          (the browser still needs one click on the page). Made in code by film-sound.js, no audio files: the jump winding
          down, the drive coughing out, the decks shutting down one thunk at a time, near silence with a faint hull creak, a low
          cold hum that rises as the camera pulls back, a soft tone on A.U.R.A.'s line, the drive relighting into the white.
          The score is seaScore() below; it reads the same timeline (TL) as the picture.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sea of Ships</title>
<meta name="description" content="Silent Exodus jump film mockup: the jump into sector 3 stalls, and the camera pulls back over a graveyard of thousands of wrecked Exodus ships.">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
    color-scheme: dark;
    --ink: #05070a; --text: #e4e4e0; --dim: #8b8d90; --faint: #5a6168;
    --f-ui: 'IBM Plex Sans Condensed', 'Arial Narrow', sans-serif;
    --f-text: 'IBM Plex Sans', system-ui, sans-serif;
    --u: 3px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--ink); overflow: hidden; }
body { color: var(--text); font: 400 15px/1.4 var(--f-text); -webkit-font-smoothing: antialiased; user-select: none; cursor: pointer; }
#frame { position: absolute; overflow: hidden; }
#art { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; }
.gfx { position: absolute; pointer-events: none; }
/* one voice, as the slice's reading layer shows it: the name small and spaced, the line plain */
#voice { left: calc(var(--u) * 40); bottom: calc(var(--u) * 46); max-width: calc(var(--u) * 210); text-shadow: 0 1px 0 var(--ink), 0 0 calc(var(--u) * 5) rgba(5, 7, 10, 0.9); }
#voice .who { display: flex; align-items: center; gap: calc(var(--u) * 2.4); margin: 0 0 calc(var(--u) * 2); font: 500 calc(var(--u) * 4.8)/1 var(--f-ui); letter-spacing: 0.18em; text-transform: uppercase; color: #c9d1d6; }
#voice .who i { width: 0.82em; height: 0.82em; border: 1px solid currentColor; border-radius: 50%; }
#voice .say { margin: 0; font: 400 calc(var(--u) * 7.8)/1.36 var(--f-text); color: var(--text); }
#skip { right: calc(var(--u) * 10); bottom: calc(var(--u) * 8); font: 400 calc(var(--u) * 4)/1 var(--f-ui); letter-spacing: 0.2em; text-transform: uppercase; color: var(--faint); }
#again { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: none; background: none; border: 1px dashed #2c3036;
         color: #8b8d90; font: 500 13px/1 var(--f-ui); letter-spacing: 0.2em; text-transform: uppercase; padding: 10px 16px; cursor: pointer; }
#again:hover, #again:focus-visible { color: #fff; outline: none; }
body.is-over #again { display: block; }
</style>
</head>
<body data-still="wait">
<div id="frame" aria-label="Film: the jump into sector 3 stalls in a graveyard of thousands of wrecked Exodus ships">
    <canvas id="art" aria-hidden="true"></canvas>
    <div class="gfx" id="voice" aria-live="polite"><p class="who"><i></i>A.U.R.A.</p><p class="say"></p></div>
    <div class="gfx" id="skip">Click to skip</div>
</div>
<button type="button" id="again">Watch again</button>

<script src="../screens/game-screen-v3/paint.js?v=3"></script>
<script src="film-sound.js"></script>
<script>
(function () {
    'use strict';
    const P = window.V3Paint;
    const { INK, RP, ramp, clamp01, smooth, lerp, hash, vnoise, fbm, seeded, threshold, LANDER, DECK_U } = P;
    const AW = 640, AH = 360, TICK = 125, DUR = 42000;
    const q = new URLSearchParams(location.search);
    const $ = id => document.getElementById(id);
    const cv = $('art'), ctx = cv.getContext('2d', { alpha: false });
    cv.width = AW; cv.height = AH; ctx.imageSmoothingEnabled = false;
    const ease = k => k * k * (3 - 2 * k);
    const step8 = t => Math.floor(t / TICK) * TICK;

    // ═══ the timeline ═══
    const TL = {
        stall: [0, 3600],          // the stretched stars shrink back to points: the jump has stopped
        cough: [2600, 4600],       // the drive coughs and goes out
        ports: [5000, 7600],       // the decks go dark one by one
        lamp: 7800,                // one red lamp left, blinking
        reveal: [10200, 15200],    // the wrecks round us come out of the dark
        pull: [[15400, 21600, 3.7, 24], [22200, 28600, 24, 110], [29200, 36400, 110, 270]],   // three pulls back: [t0, t1, from, to] (distance in ship lengths)
        line: [37000, 41200],
        relight: 40400, white: [41200, 41600], end: DUR,
    };
    const LINE = 'The drive is back, Commander. The jump will finish.';   // the one line; ?words=0 drops it

    // ═══ the camera: one pinhole, looking straight ahead; our ship stays at OUR on screen (in the middle of it all), the light at VP ═══
    const F = 560, C0 = [320, 180], VP = [560, 72], OUR = [296, 212], D0 = 3.7;
    const norm = v => { const n = Math.hypot(...v) || 1; return v.map(x => x / n); };
    const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
    const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
    const madd = (a, ...terms) => terms.reduce((acc, [k, v]) => acc.map((x, i) => x + k * v[i]), a.slice());
    const HEAD = norm([(VP[0] - C0[0]) / F, (VP[1] - C0[1]) / F, 1]);        // the heading: toward the light
    const NRM = norm(cross([1, 0, 0], HEAD)), SIDE = norm(cross(HEAD, NRM));  // the sea's up, and across the heading
    const CAMDIR = [(OUR[0] - C0[0]) / F, (OUR[1] - C0[1]) / F, 1];
    // Every hull is drawn on ONE screen heading (ours, toward the light), with only a hint of perspective. True perspective made
    // them fan out from the light like a burst, and the point of the shot is that they are all going the same way.
    const HEAD_ANG = Math.atan2(VP[1] - OUR[1], VP[0] - OUR[0]);
    function headingAt(x, y, yaw) {
        let da = Math.atan2(VP[1] - y, VP[0] - x) - HEAD_ANG;
        da = Math.atan2(Math.sin(da), Math.cos(da));
        return HEAD_ANG + Math.max(-0.8, Math.min(0.8, da)) * 0.18 + yaw * 0.5;
    }
    function distAt(t) {
        let D = TL.pull[0][2];
        for (const [t0, t1, a, b] of TL.pull) { if (t >= t1) D = b; else if (t > t0) { D = Math.exp(lerp(Math.log(a), Math.log(b), ease((t - t0) / (t1 - t0)))); break; } }
        return D;
    }
    const LEN_K = 0.92;          // a hull's length on screen is F / z times this (drawn side on, pointing at the light)
    function project(p, D) {
        const rx = p[0] + D * CAMDIR[0], ry = p[1] + D * CAMDIR[1], rz = p[2] + D * CAMDIR[2];
        if (rz < 0.4) return null;
        const n = Math.hypot(rx, ry, rz), along = (rx * HEAD[0] + ry * HEAD[1] + rz * HEAD[2]) / n, side = Math.sqrt(Math.max(0, 1 - along * along));
        return { x: C0[0] + F * rx / rz, y: C0[1] + F * ry / rz, len: F / rz * LEN_K * (0.45 + 0.55 * Math.min(1, side / 0.6)), z: rz };   // seen nose-on, a hull looks shorter
    }
    /** Where to put a thing so that at the first look (D0) its centre is at screen x, y and a whole hull there is `len` pixels long. */
    function placeOnScreen(x, y, len) {
        let z = F * LEN_K / len, p = null;
        for (let i = 0; i < 6; i++) {
            p = [(x - C0[0]) * z / F - D0 * CAMDIR[0], (y - C0[1]) * z / F - D0 * CAMDIR[1], z - D0 * CAMDIR[2]];
            const pr = project(p, D0); z *= pr.len / len;
        }
        return p;
    }

    // ═══ the wrecks ═══
    // Ramps: our hull ramp gone cold and grey; charred black; the old rust; the grey of a world we passed. No bright red: they
    // must read as Landers, ours, dead. FAR is what a wreck is when it is two or three pixels: dim cold metal, never a spark.
    const DEAD = ramp(INK, '#0f1417', '#1b252a', '#2f3d43', '#55666c', '#8e9fa4');
    const BURNT = ramp(INK, '#09090a', '#131416', '#1d2023', '#2a2f33', '#3f4549');   // charcoal: soot, not rust
    const FAR = ramp(INK, '#0f1418', '#182126', '#253238', '#384952', '#566a72');
    const RAMPS = [DEAD, DEAD, RP.PASSED, BURNT, DEAD, RP.RUST, DEAD, BURNT];   // mostly our own grey; a little old rust
    /** The damage a wreck carries, from its seed: torn (the threshold for holes, lower is worse), burn, plates gone, a beacon. */
    function dmgFor(seed) { const h = k => hash(seed, k, 41); return { torn: 0.56 + h(1) * 0.1, burn: 0.2 + h(2) * 0.75, plates: 0.08 + h(3) * 0.26, beacon: h(4) < 0.14 }; }

    // The graveyard round us at the first look, placed on screen: [x, y] is the centre of the piece, len the length a whole
    // hull at that depth would be, from/to the piece of the hull that is left (0 nose .. 1 bell). Each broken hull's other
    // half drifts nearby. Nothing covers us or the light.
    const NEAR = [
        { x: 72, y: 322, len: 300, from: 0, to: 0.47, yaw: 0.04, roll: 0.05, torn: 0.615, burn: 0.7, plates: 0.22 },        // the front half of a ship, close below-left
        { x: 14, y: 236, len: 250, from: 0.53, to: 1, yaw: -0.1, roll: -0.62, torn: 0.62, burn: 0.95, plates: 0.16 },       // its engine half, tumbling away
        { x: 122, y: 92, len: 132, from: 0, to: 1, yaw: 0.05, torn: 0.565, burn: 0.45, plates: 0.22, beacon: 2 },          // gutted down its side
        { x: 486, y: 262, len: 122, from: 0.3, to: 1, yaw: -0.04, roll: 0.14, ri: 3, torn: 0.6, burn: 0.9, plates: 0.2, beacon: 0 },   // nose torn off, burnt black
        { x: 560, y: 196, len: 122, from: 0, to: 0.27, yaw: 0, roll: 0.95, ri: 3, torn: 0.62, burn: 0.8 },               // its nose, drifting ahead
        { x: 604, y: 352, len: 230, from: 0.04, to: 0.62, yaw: 0.03, roll: -0.08, torn: 0.61, burn: 0.6, plates: 0.24 },  // big, lower right
        { x: 342, y: 64, len: 66, from: 0, to: 0.55, yaw: -0.06, roll: 0.06, ri: 2 },
        { x: 284, y: 52, len: 66, from: 0.6, to: 1, yaw: 0.1, roll: -0.4, ri: 2 },
        { x: 424, y: 128, len: 54, from: 0.42, to: 1, yaw: -0.05 },
        { x: 240, y: 118, len: 42, from: 0, to: 1, yaw: 0.06, beacon: 2 },
        { x: 40, y: 160, len: 48, from: 0, to: 0.66, yaw: 0.03, ri: 4 },
        { x: 196, y: 334, len: 74, from: 0.38, to: 1, yaw: -0.08, roll: 0.25 },
        { x: 382, y: 330, len: 58, from: 0, to: 1, yaw: 0.04, ri: 3 },
        { x: 618, y: 132, len: 36, from: 0, to: 1, yaw: -0.05, beacon: 2 },
        { x: 486, y: 40, len: 28, from: 0, to: 0.6, yaw: 0.02 },
        { x: 182, y: 36, len: 30, from: 0, to: 1, yaw: 0.05, ri: 2 },
        { x: 298, y: 140, len: 22, from: 0.35, to: 1, yaw: -0.1 },
        { x: 520, y: 112, len: 19, from: 0, to: 1, yaw: 0.04 },
        { x: 92, y: 214, len: 26, from: 0, to: 0.5, yaw: 0.08, ri: 4 },
        { x: 418, y: 222, len: 17, from: 0, to: 1, yaw: -0.04 },
        { x: 560, y: 300, len: 20, from: 0.5, to: 1, yaw: 0.2, roll: 0.6 },
        { x: 30, y: 60, len: 21, from: 0, to: 1, yaw: 0 },
        { x: 380, y: 26, len: 16, from: 0, to: 1, yaw: 0.04 },
        { x: 156, y: 168, len: 15, from: 0.3, to: 1, yaw: -0.06 },
        { x: 440, y: 186, len: 13, from: 0, to: 1, yaw: 0.02 },
        { x: 600, y: 240, len: 14, from: 0, to: 0.6, yaw: -0.03 },
    ];
    // The sea: 90,000 hulls (broken ones in two pieces). Most are spread evenly within 700 ship lengths of us, in a thick layer
    // above and below; the rest thin out to 7,000 lengths in a flatter sheet toward the light. What can be seen grows as the
    // camera pulls back (SEEN, in camera distances): first the wrecks round us, then hundreds, then thousands.
    // PASS: wrecks along the camera's way back. Each sits beside the path at a distance `d` from us and is `edge` pixels from
    // our dot when the camera stops at one of the pulls' ends (24, 110 or 270 lengths), so as the camera pulls back they slide
    // in from the edges of the frame, big and close, and at no stop do they cover us or the light. They keep every shot
    // reading as wrecks from the foreground to the far field.
    const SEA_N = 64000, SEA_RHO = [4, 7000], SEA_EVEN = [700, 0.7], SEEN = [3.6, 7.2];   // SEA_EVEN: [radius, share of hulls] spread evenly
    const PASS = { n: [500, 700, 1300], stops: [24, 110, 270], edge: [40, 440], clear: 0.6 };
    const at3 = (u, w, h) => [0, 1, 2].map(k => u * HEAD[k] + w * SIDE[k] + h * NRM[k]);
    /** One hull into the list: whole (a quarter of them), or snapped in two with the halves drifting apart along the heading,
        the engine half turning away; sometimes one half is gone. */
    function addHull(list, base, r) {
        if (r() < 0.25) { list.push(Object.assign(base, { from: 0, to: 1, anchor: 0.5 })); return; }
        const p = base.p, cut = Math.round((0.3 + r() * 0.4) * 10) / 10, gap = 0.1 + r() * 0.5, drift = (r() - 0.5) * 0.7, keep = r();
        const front = Object.assign({}, base, { from: 0, to: cut, anchor: cut / 2, p: madd(p, [0.5 - cut / 2 + gap / 2, HEAD]), broken: true });
        const back = Object.assign({}, base, { from: cut, to: 1, anchor: (1 + cut) / 2, seed: base.seed + 1, roll: (r() - 0.5) * 1.4, broken: true,
            p: madd(p, [0.5 - (1 + cut) / 2 - gap / 2, HEAD], [drift, SIDE], [drift * 0.4, NRM]) });
        if (keep > 0.1) list.push(front);
        if (keep < 0.9) list.push(back);
    }
    function makeSea() {
        const r = seeded(4242), list = [];
        NEAR.forEach((o, i) => {
            const seed = 100 + i, d = dmgFor(seed);
            list.push(Object.assign({ seed, ri: i % 2 ? 0 : 1, yaw: 0, roll: 0, near: true, p: placeOnScreen(o.x, o.y, o.len), anchor: (o.from + o.to) / 2,
                dmg: { torn: o.torn || d.torn, burn: o.burn == null ? d.burn : o.burn, plates: o.plates == null ? d.plates : o.plates, beacon: o.beacon != null } }, o));
        });
        const newer = q.get('newer') === '1', camRay = norm(CAMDIR).map(v => -v);
        const baseAt = (p, rho) => ({ p, rho, fade: r(), yaw: (r() - 0.5) * 0.24, roll: (r() - 0.5) * 0.12, seed: Math.floor(r() * 997), ri: Math.floor(r() * RAMPS.length), kind: newer && rho > 20 && r() < 0.18 ? 1 : 0 });
        let n = 0;
        while (n < SEA_N) {
            const rho = r() < SEA_EVEN[1] ? Math.max(SEA_RHO[0], SEA_EVEN[0] * Math.sqrt(r())) : SEA_EVEN[0] + (SEA_RHO[1] - SEA_EVEN[0]) * r(), th = r() * Math.PI * 2;
            const u = rho * Math.cos(th), w = rho * Math.sin(th) * 1.15, h = (r() + r() + r() - 1.5) * (1.5 + 0.13 * Math.min(rho, 400));   // thick round us, flatter far off
            if (u < 0 && r() < 0.55) continue;                                                // fewer behind us than ahead
            if (rho > 60 && r() > 0.12 + 0.88 * smooth(0.36, 0.62, fbm(u / 420, w / 70 + h / 140, 77, 3))) continue;   // long drifts along the heading, gaps between
            const p = at3(u, w, h);
            if (dot(p, camRay) / rho > 0.985) continue;                                       // keep the camera's own path back clear
            const first = project(p, D0);
            if (first && first.len > 30 && first.x > -60 && first.x < AW + 60 && first.y > -60 && first.y < AH + 60) continue;   // the first look is composed by hand (NEAR)
            n++;
            addHull(list, baseAt(p, rho), r);
        }
        const lightAng = Math.atan2(VP[1] - OUR[1], VP[0] - OUR[0]), stops = PASS.stops;
        stops.forEach((E, k) => {
            for (let i = 0, tries = 0; i < PASS.n[k] && tries < 40000; tries++) {
                const d = lerp(3, E * 0.95, r()), edge = lerp(PASS.edge[0], PASS.edge[1], r()), a = r() * Math.PI * 2;
                if (Math.abs(Math.atan2(Math.sin(a - lightAng), Math.cos(a - lightAng))) < 0.22) continue;   // not across the light
                const o = edge * (E - d) / F;
                if (stops.some(D => D > d && F * o / (D - d) < Math.max(10, PASS.clear * F * LEN_K / (D - d)))) continue;   // not on top of our dot at a stop
                i++;
                const p = [-d * CAMDIR[0] + o * Math.cos(a), -d * CAMDIR[1] + o * Math.sin(a), -d * CAMDIR[2]];
                addHull(list, Object.assign(baseAt(p, Math.hypot(...p)), { pass: true }), r);
            }
        });
        list.forEach(s => { if (s.rho == null) s.rho = Math.hypot(...s.p); });
        return list;
    }
    const SEA = makeSea();

    // ═══ loose plating, girders and scraps drifting between them ═══
    function makeDebris() {
        const r = seeded(777), list = [];
        const add = (c, spread, n, scale = 1) => {
            for (let i = 0; i < n; i++) {
                const k = r(), kind = k < 0.55 ? 0 : k < 0.85 ? 1 : 2;                        // a plate, a girder, a scrap
                const p = madd(c, [(r() - 0.5) * 2 * spread, HEAD], [(r() - 0.5) * 2 * spread, SIDE], [(r() - 0.5) * spread, NRM]);
                if (Math.hypot(...p) < 0.75) continue;                                       // not on top of us
                list.push({ p, kind, r: scale * (kind === 1 ? 0.05 + 0.13 * r() : kind === 0 ? 0.025 + 0.07 * r() : 0.012 + 0.025 * r()),
                    a0: r() * 6.283, spin: (r() - 0.5) * 0.7, vel: [0, 1, 2].map(() => (r() - 0.5) * 0.02), seed: Math.floor(r() * 997), lit: r() });
            }
        };
        SEA.forEach(s => {
            if (s.near) add(s.p, 0.25 + 0.5 * (s.to - s.from), Math.round(10 + 22 * (s.to - s.from) * (s.len > 60 ? 1 : 0.5)));
            else if (s.pass || (s.broken && s.rho < 160)) add(s.p, 0.5, s.pass ? 3 : 2);
        });
        for (let i = 0; i < 2600; i++) { const rho = 1 + 90 * r() ** 1.4, th = r() * 6.283; add(at3(rho * Math.cos(th), rho * Math.sin(th), (r() - 0.5) * 2), 0.1, 1); }
        return list;
    }
    const DEBRIS = makeDebris();

    // ═══ painting a wreck: hull() from paint.js, with the damage ═══
    /** o: { x, y, len, ht, angle, anchor, from, to, seed, ramp, dmg, sun, shape }. The nose points along `angle`.
        Returns { beacon: [x, y] relative to o.x, o.y, or null }. */
    function paintWreck(p, o) {
        const { len, ht, from, to, anchor, seed, dmg } = o, R = o.ramp, shape = o.shape, c = Math.cos(o.angle), s = Math.sin(o.angle);
        const at = (u, v) => { const a = -(u - anchor) * len, b = v * ht; return [o.x + a * c - b * s, o.y + a * s + b * c]; };
        const uvOf = (x, y) => { const dx = x + 0.5 - o.x, dy = y + 0.5 - o.y; return [anchor - (dx * c + dy * s) / len, (-dx * s + dy * c) / ht]; };
        const reach = Math.max(anchor - from, to - anchor) * len + ht * 0.7 + 2;
        const tiny = len < 16, small = len < 40;
        const ribP = Math.max(3, len * 0.04), ribW = Math.max(1, len / 150), lonW = Math.max(0.55, ht / 80), LON = [-0.4, -0.2, 0, 0.2, 0.4];
        const isFrame = (pu, v) => (((pu % ribP) + ribP) % ribP) < ribW || LON.some(k => Math.abs(v - k) * ht < lonW);
        const sU = Math.max(4, len * 0.1), sV = Math.max(2, ht * 0.42), skel = tiny ? 0 : Math.min(0.03 + 0.035 * hash(seed, 9, 5), 14 / len);
        const pw = Math.max(4, len / 15), sun = [Math.cos(o.angle) * 1.5, Math.sin(o.angle) * 1.5];
        const inside = (x, y) => { const [u, v] = uvOf(x, y); return u >= from && u <= to && shape(u, v, o) >= 0; };
        p.region(o.x - reach, o.y - reach, o.x + reach, o.y + reach, (x, y) => {

                const a = deg * Math.PI / 180, ca = Math.cos(a), sa = Math.sin(a), s = len / 48, [bx, by] = sp.bell, lvl = burn * cough * 1.4, fl = [1, 0.75, 1.15, 0.9][Math.floor(ts / TICK) % 4];
                const pl = (6 + 20 * lvl) * s * fl, w0 = Math.max(1, 1.8 * s);
                for (let d = 0; d < pl; d++) { const hw = w0 * (1 - (d / pl) * 0.6); for (let k = -Math.ceil(hw); k <= Math.ceil(hw); k++) { const u = Math.abs(k) / (hw + 0.01), v = (1 - d / pl) ** 0.8 * (1 - u * u); if (v > 0.06) f.tone(cx + bx - ca * d - sa * k, cy + by - sa * d + ca * k, RP.PLUME, v); } }
            }
            sp.ports.forEach(([px, py], i) => {                                                 // a lit porthole per deck, going out one by one
                const off = TL.ports[0] + (5 - i) * (TL.ports[1] - TL.ports[0]) / 5, on = t < off || (t > TL.relight + 300 && hash(i, 1, 2) > 0.2);
                if (on) f.px(cx + px, cy + py, RP.AMBER.hex[i === 0 ? 4 : 3]); else if (t < off + 300) f.px(cx + px, cy + py, RP.AMBER.hex[1]);
            });
            if (t > TL.lamp) redLamp(f, cx + sp.lamp[0], cy + sp.lamp[1], t, len / 12);
        } else {                                                                                 // a dot: the red lamp is how you find us
            const k = clamp01((len - 1) / 6);
            if (k > 0.3) f.px(OUR[0] - 1, OUR[1], RP.HULL.hex[2], 3, 1);
            redLamp(f, OUR[0], OUR[1] - (k > 0.3 ? 1 : 0), t, 1);
            if (t > TL.relight) { const v = smooth(TL.relight, TL.relight + 600, t); f.glow(OUR[0] - 2, OUR[1] + 1, 4, RP.PLUME, v); f.px(OUR[0] - 2, OUR[1] + 1, RP.PLUME.hex[5]); }
        }
    }
    function redLamp(f, x, y, t, scale) {
        const on = ((t - TL.lamp) % 2200) < 900, r = Math.max(4, Math.round(3 + scale));
        if (scale <= 1) {                                                                      // a dot: a small bright cross, no dark halo round it on the grey field
            if (on) { f.px(x - 2, y, RP.RED.hex[2], 5, 1); f.px(x, y - 2, RP.RED.hex[2], 1, 5); f.px(x - 1, y - 1, RP.RED.hex[3], 3, 3); }
            else { f.px(x - 1, y, RP.RED.hex[2], 3, 1); f.px(x, y - 1, RP.RED.hex[2], 1, 3); }
            f.px(x, y, RP.RED.hex[on ? 4 : 3]);
            return;
        }
        if (on) { f.glow(x, y, r, RP.RED, 0.9); f.px(x, y, RP.RED.hex[4]); if (scale <= 1) f.px(x - 1, y, RP.RED.hex[3], 3, 1); }
        else { f.glow(x, y, 3, RP.RED, 0.55); f.px(x, y, RP.RED.hex[3]); }
    }
    /** The jump: every star pulled out into a streak toward the light; the streaks shrink back as the jump stalls. */
    function drawStreaks(t, k) {
        if (k <= 0.01) return;
        const L = P.pixelLayer(AW, AH);
        background().all.forEach(st => {
            const dx = VP[0] - st.x, dy = VP[1] - st.y, d = Math.hypot(dx, dy) || 1, len = Math.min(d - 4, k * k * (40 + d * 0.5) * (0.5 + st.mag));
            for (let i = 0; i < len; i++) L.tone(st.x - dx / d * i * 0.4 + dx / d * i, st.y - dy / d * i * 0.4 + dy / d * i, RP.STAR, (0.4 + 0.55 * st.mag) * (1 - i / len));
        });
        L.draw(ctx);
    }
    /** Fade a layer in with the house dither: only the pixels whose Bayer threshold is under `amount` survive. */
    const holePat = new Map();
    const scratches = new Map();
    function scratch(w, h) { const k = w + 'x' + h; if (!scratches.has(k)) { const c = document.createElement('canvas'); c.width = w; c.height = h; scratches.set(k, c); } return scratches.get(k); }
    function ditherIn(c2, amount, w = AW, h = AH) {
        const n = Math.round(clamp01(amount) * 16);
        if (n >= 16) return;
        if (!holePat.has(n)) { const c = document.createElement('canvas'); c.width = c.height = 8; const g = c.getContext('2d'); g.fillStyle = '#000'; for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) if (threshold(x, y) >= n / 16) g.fillRect(x, y, 1, 1); holePat.set(n, c2.createPattern(c, 'repeat')); }
        c2.save(); c2.globalCompositeOperation = 'destination-out'; c2.fillStyle = holePat.get(n); c2.fillRect(0, 0, w, h); c2.restore();
    }
    const dimPat = new Map();
    function dim(a, colour = INK) {
        const n = Math.round(clamp01(a) * 8); if (!n) return;
        if (n >= 8) { ctx.fillStyle = colour; ctx.fillRect(0, 0, AW, AH); return; }
        const key = colour + n;
        if (!dimPat.has(key)) { const c = document.createElement('canvas'); c.width = c.height = 8; const g = c.getContext('2d'); g.fillStyle = colour; for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) if (threshold(x, y) < n / 8) g.fillRect(x, y, 1, 1); dimPat.set(key, ctx.createPattern(c, 'repeat')); }
        ctx.fillStyle = dimPat.get(key); ctx.fillRect(0, 0, AW, AH);
    }

    function frameAt(t) {
        const B = background(), f = P.framer(ctx, AW, AH), ts = step8(t), D = distAt(t);
        ctx.drawImage(B.canvas, 0, 0);
        const stretch = Math.max(1 - smooth(TL.stall[0], TL.stall[1], t), smooth(TL.relight + 300, TL.white[0], t));
        if (stretch < 0.5) P.twinkle(f, B.stars, ts);
        drawStreaks(t, stretch);
        const seen = smooth(TL.reveal[0], TL.reveal[1], t);
        if (seen > 0) { drawSea(t, D); ditherIn(dctx, seen); ctx.drawImage(dead, 0, 0); }
        drawOurs(t, D);
        if (t < 600) dim(1 - t / 600);
        if (t >= TL.white[0]) { dim(smooth(TL.white[0], TL.white[0] + 200, t), RP.SUN.hex[6]); dim(smooth(TL.white[1], TL.end, t)); }
    }

    // ═══ the sound (optional, off by default; film-sound.js builds none of it until the Sound button is turned on) ═══
    // Quiet throughout. It follows the film's clock and the same timeline as the picture: the jump's rush follows the stars'
    // stretch, the drive stutters on the same 90 ms flicker as the plume, each deck's thunk lands as its porthole goes dark,
    // and the cold hum rises with the camera's distance.
    const PORT_OFF = [0, 1, 2, 3, 4, 5].map(i => TL.ports[0] + (5 - i) * (TL.ports[1] - TL.ports[0]) / 5);   // as in drawOurs
    const COUGHS = [2700, 3080, 3420, 3800, 4180, 4520], CREAKS = [[8700, 420, 1.1], [12600, 560, 0.8], [18200, 360, 1.3], [26400, 480, 0.9], [33600, 330, 1.2]];
    function seaScore(K) {
        const end = K.gain(0, K.out);                                                        // the whole score: closed when paused, closes into the white
        // the jump: a falling whine and a rush, winding down as the stars shrink back; back up into the white
        const whineG = K.gain(0, end), whineLp = K.filter('lowpass', 900, 2.2, whineG), whine = K.osc('sawtooth', 300, whineLp);
        const rushG = K.gain(0, end), rushF = K.filter('bandpass', 1800, 0.8, rushG); K.loop('pink', rushF);
        // the drive: two low saws beating and a rumble
        const drive = K.gain(0, end), driveLp = K.filter('lowpass', 240, 1.4, drive);
        K.osc('sawtooth', 43, driveLp); K.osc('sawtooth', 43.7, driveLp); K.loop('brown', K.filter('lowpass', 170, 0.9, drive));
        // the ship's systems: mains hum and air, a sixth of it gone with each deck
        const sys = K.gain(0, end), sysLp = K.filter('lowpass', 700, 0.7, sys);
        K.osc('sine', 120, K.gain(0.5, sysLp)); K.osc('triangle', 180.4, K.gain(0.18, sysLp)); K.loop('white', K.filter('bandpass', 2600, 0.6, K.gain(0.35, sys)));
        // the cold hum outside: low partials, beating slowly, and a wind of pink noise; its filter opens as the camera pulls back
        const hum = K.gain(0, end), humLp = K.filter('lowpass', 160, 0.8, hum);
        [[36.7, 'sine', 0.5], [36.95, 'sine', 0.4], [55.1, 'sawtooth', 0.16], [55.5, 'sawtooth', 0.14], [110.3, 'sine', 0.12], [146.9, 'sine', 0.06]].forEach(([f, type, v]) => K.osc(type, f, K.gain(v, humLp)));
        K.loop('pink', K.filter('bandpass', 210, 0.9, K.gain(1.6, humLp)));
        const lowLp = (f) => K.filter('lowpass', f, 1, end);
        /** A deck shutting down: a deep thunk, a relay's click, panned along the hull. */
        const thunk = (at, i) => {
            const j = 5 - i, p = K.pan(-0.45 + i * 0.18, end), f = 96 - j * 7;
            K.tone({ at, f, f2: f * 0.42, dur: 0.5, gain: 0.5 - j * 0.03, attack: 0.004, to: p });
            K.burst({ at, dur: 0.16, kind: 'brown', type: 'lowpass', f: 520, f2: 140, gain: 0.55, to: p });
            K.burst({ at, dur: 0.035, kind: 'white', type: 'bandpass', f: 2300, Q: 2.5, gain: 0.08, to: p });
        };
        /** A hull creak: a stick-slip train of clicks through one ringing band, speeding up and slowing down. */
        const creak = (at, f, len) => {
            const bp = K.filter('bandpass', f, 11), g = K.gain(0.5, K.pan(Math.random() - 0.5, end)); bp.connect(g);
            bp.frequency.setValueAtTime(f, at); bp.frequency.linearRampToValueAtTime(f * 0.82, at + len);
            const n = Math.round(len * 40);
            for (let i = 0, t = at; i < n; i++) {
                const x = i / n, s = K.ac.createBufferSource(), cg = K.ac.createGain();
                s.buffer = K.buffers.click; cg.gain.value = (0.3 + 0.7 * Math.sin(Math.PI * x)) * (0.55 + 0.45 * Math.random());
                s.connect(cg); cg.connect(bp); s.start(t); t += 1 / (18 + 46 * Math.sin(Math.PI * x));
            }
        };
        const chime = K.filter('lowpass', 2600, 0.7, end);
        const cues = [
            ...COUGHS.map((t, i) => [t, at => {
                K.burst({ at, dur: 0.34, kind: 'brown', type: 'lowpass', f: 460, f2: 110, gain: 0.75 - i * 0.06, attack: 0.01, to: end });
                K.tone({ at, f: 72, f2: 36, dur: 0.3, type: 'triangle', gain: 0.32 - i * 0.03, to: end });
            }]),
            [TL.cough[1], at => K.tone({ at, f: 52, f2: 21, dur: 1.8, type: 'sawtooth', gain: 0.28, attack: 0.02, to: lowLp(260) })],   // the drive dies away
            ...PORT_OFF.map((t, i) => [t, at => thunk(at, i)]),
            ...CREAKS.map(([t, f, len]) => [t, at => creak(at, f, len)]),
            [TL.line[0] + 50, at => {                                                           // A.U.R.A.: a soft two-note tone
                K.tone({ at, f: 659.3, dur: 2.8, gain: 0.06, attack: 0.04, to: chime });
                K.tone({ at: at + 0.17, f: 987.8, dur: 2.4, gain: 0.038, attack: 0.04, to: chime });
            }],
            [TL.relight, at => {                                                                // the drive catches again
                K.tone({ at, f: 40, f2: 72, dur: 1.1, type: 'triangle', gain: 0.3, attack: 0.05, to: end });
                K.burst({ at, dur: 0.9, kind: 'brown', type: 'lowpass', f: 140, f2: 600, gain: 0.45, attack: 0.08, to: end });
            }],
        ];
        function update(T, dt, live) {
            K.set(end.gain, live ? 1 - smooth(TL.white[1], TL.end, T) : 0, live ? 0.04 : 0.08);
            const stretch = Math.max(1 - smooth(TL.stall[0], TL.stall[1], T), smooth(TL.relight + 300, TL.white[0], T));   // as frameAt
            K.set(whineG.gain, 0.14 * stretch ** 1.3, 0.04); K.set(whine.frequency, 55 + 340 * stretch ** 1.6, 0.05);
            K.set(rushG.gain, 1.1 * stretch, 0.04); K.set(rushF.frequency, 260 + 2600 * stretch, 0.05);
            const burn = 1 - smooth(TL.cough[0], TL.cough[1], T) + (T > TL.relight ? smooth(TL.relight, TL.relight + 500, T) * 1.6 : 0);   // as drawOurs
            const cough = T > TL.cough[0] && T < TL.cough[1] ? (hash(Math.floor(T / 90), 3, 7) > 0.45 ? 1 : 0.1) : 1;
            K.set(drive.gain, 0.42 * Math.min(1, burn * cough), 0.012);
            const decks = PORT_OFF.filter(o => T < o).length, back = T > TL.relight + 300 ? 5 : 0;
            K.set(sys.gain, 0.1 * Math.min(6, decks + back) / 6, 0.03);
            const hk = clamp01(Math.log(distAt(T) / D0) / Math.log(TL.pull[2][3] / D0)), seen = smooth(TL.reveal[0] - 1500, TL.reveal[1], T);
            K.set(hum.gain, seen * (0.08 + 0.34 * hk) * (1 + 0.12 * Math.sin(T / 1900)), 0.12);
            K.set(humLp.frequency, 140 + 900 * hk ** 1.2, 0.12);
        }
        return { cues, update };
    }
    const SOUND = window.FilmSound ? window.FilmSound.attach({ score: seaScore }) : { tick() {} };

    // ═══ the player: clock, stills, the line, skip ═══
    let T = 0, playing = true, last = null, ended = false;
    const words = q.get('words') !== '0', voice = $('voice'), say = voice.querySelector('.say');
    say.textContent = LINE;
    function render() {
        ctx.fillStyle = INK; ctx.fillRect(0, 0, AW, AH);
        bakeLeft = playing ? BAKE_MS : Infinity;
        if (T < DUR) { try { frameAt(T); } catch (err) { console.error('film: frame failed', err); } }
        else { ctx.fillStyle = INK; ctx.fillRect(0, 0, AW, AH); }
        const [a, b] = TL.line;
        voice.style.opacity = words && T >= a && T < b && !ended ? Math.min(1, (T - a) / 350, (b - T) / 350) : 0;
        $('skip').style.opacity = T < 4000 && playing && !ended ? 0.8 : 0;
        SOUND.tick(T, playing && !ended);
    }
    function setTime(ms) { T = clamp01(ms / DUR) * DUR; ended = T >= DUR; document.body.classList.toggle('is-over', ended); render(); }
    function skip() { playing = false; setTime(DUR); }
    function loop(now) {
        const dt = last == null ? 16 : Math.min(100, now - last); last = now;
        if (playing && !ended) { T += dt; if (T >= DUR) { T = DUR; ended = true; document.body.classList.add('is-over'); } }
        render();
        requestAnimationFrame(loop);
    }
    function fit() {
        const dpr = window.devicePixelRatio || 1, forced = Number(q.get('px'));
        const k = forced > 0 ? forced : Math.max(1, Math.floor(Math.min(innerWidth * dpr / AW, innerHeight * dpr / AH)));
        const w = AW * k / dpr, h = AH * k / dpr, fr = $('frame');
        Object.assign(fr.style, { width: w + 'px', height: h + 'px', left: Math.round((innerWidth - w) / 2) + 'px', top: Math.round((innerHeight - h) / 2) + 'px' });
        document.documentElement.style.setProperty('--u', (k / dpr) + 'px');
    }
    addEventListener('resize', fit);
    addEventListener('pointerdown', e => { if (e.target.id === 'again') return; if (!ended) skip(); });
    addEventListener('keydown', e => { if (['Escape', 'Enter', ' '].includes(e.key)) { e.preventDefault(); if (!ended) skip(); } });
    $('again').addEventListener('click', () => { ended = false; document.body.classList.remove('is-over'); setTime(0); playing = true; });
    const SHOTS = [
        { id: 'stall', t0: 0, t1: 4600, caption: 'The jump stalls: the stretched stars shrink back to points; the drive coughs out.' },
        { id: 'dark', t0: 4600, t1: 10200, caption: 'Our decks go dark one by one. One red lamp is left.' },
        { id: 'reveal', t0: 10200, t1: 15400, caption: 'As the eyes adjust: a graveyard. Wrecks of our own class all round us, snapped, gutted, burnt, all pointing at the light.' },
        { id: 'pull', t0: 15400, t1: 36400, caption: 'The camera pulls back, and back, and back: dozens of wrecks, then hundreds, then thousands.' },
        { id: 'sea', t0: 36400, t1: 42000, caption: 'Our ship is a red dot in a sea of wrecks. A.U.R.A.: the drive is back. White.' },
    ];
    window.film = {
        play() { playing = true; }, pause() { playing = false; }, step(ms) { playing = false; setTime(T + ms); }, setTime(ms) { playing = false; setTime(ms); },
        duration: DUR, shots: SHOTS, line: LINE, ships: SEA.length, debris: DEBRIS.length,
        state: () => ({ t: Math.round(T), playing, ended, distance: +distAt(T).toFixed(2), cached: cache.size }),
    };
    fit();
    background();
    document.body.dataset.still = 'ready';
    if (q.has('t')) { playing = false; setTime(Number(q.get('t')) || 0); }
    requestAnimationFrame(loop);
})();
</script>
