<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sky Study</title>
<meta name="description" content="Silent Exodus: the far sky alone, any option in any of the six sectors. ?sky=c|d|e|f &n=1..6 &t=ms &D=px of flight.">
<style>
:root { color-scheme: dark; --ink: #05070a; --text: #8b8d90; }
html, body { margin: 0; height: 100%; background: var(--ink); overflow: hidden; }
canvas { position: absolute; image-rendering: pixelated; }
p { position: absolute; left: 16px; bottom: 12px; margin: 0; font: 13px/1.3 ui-monospace, Consolas, monospace; color: var(--text); }
</style>
<script src="paint.js?v=3"></script>
<script src="sky.js?v=2"></script>
<script src="sky2.js?v=2"></script>
<script src="../crew-hires/engine.js"></script>
<script src="../crew-hires/ship-art.js"></script>
</head>
<body>
<canvas id="sky"></canvas>
<p id="say"></p>
<script>
/* The sky alone, as the game draws it behind everything (game-screen-v3.html, section 4 and drawFlight): v1's haze, dust
   and stars over the far sky, the mid star tiles, the far thing, the far motion, the light. No worlds, no ship, no words.
   Sectors 3 to 6 are not in the mockup yet: their light and haze here are guesses that grow toward the end. */
(function () {
    'use strict';
    const P = window.V3Paint, SKY = window.V3Sky, SW = 640, SH = 360, LIGHT = [604, 158];
    const q = new URLSearchParams(location.search), n = Math.max(1, Math.min(6, +q.get('n') || 1)), D = +q.get('D') || 1200, t0 = +q.get('t') || 12000;
    const SECT = {
        1: { seed: 11, dust: 0.12, haze: 1, stars: 1, light: { core: 2, halo: 14, strength: 1, spikes: 5 } },
        2: { seed: 22, dust: 0.08, haze: 0.6, stars: 1.6, light: { core: 5, halo: 34, strength: 1, spikes: 7 } },
        3: { seed: 33, dust: 0.1, haze: 0.8, stars: 1, light: { core: 7, halo: 44, strength: 1, spikes: 7 } },
        4: { seed: 44, dust: 0.12, haze: 0.8, stars: 1.2, light: { core: 9, halo: 54, strength: 1, spikes: 8 } },
        5: { seed: 55, dust: 0.1, haze: 0.8, stars: 1, light: { core: 12, halo: 68, strength: 1, spikes: 8 } },
        6: { seed: 66, dust: 0.16, haze: 0.8, stars: 1, light: { core: 16, halo: 90, strength: 1, spikes: 9 } },
    }[n];
    const cv = document.getElementById('sky'), ctx = cv.getContext('2d');
    const dpr = window.devicePixelRatio || 1, dw = Math.round(innerWidth * dpr), dh = Math.round(innerHeight * dpr);
    const k = Math.max(2, Math.floor(Math.min(dw / SW, dh / SH) + 1e-6)), W = Math.ceil(dw / k), H = Math.ceil(dh / k), ox = Math.round((W - SW) / 2), oy = Math.round((H - SH) / 2);
    cv.width = W; cv.height = H; cv.style.width = W * k / dpr + 'px'; cv.style.height = H * k / dpr + 'px';
    cv.style.left = Math.floor((dw - W * k) / 2) / dpr + 'px'; cv.style.top = Math.floor((dh - H * k) / 2) / dpr + 'px';
    const lx = ox + LIGHT[0], ly = oy + LIGHT[1], L = SECT.light;
    const sky = SKY.build(W, H, ox, oy, n, LIGHT);
    const strip = P.spaceStrip(W + 200, H, SECT.seed, SECT.dust, SECT.haze * (sky ? sky.haze : 1), SECT.stars);
    const lit = new Float32Array(W * H);
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) lit[y * W + x] = Math.exp(-Math.hypot(x - lx, (y - ly) * 1.15) / (Math.max(L.halo, 18) * 0.85 + 6));
    const bp = P.painter(W, H, true), away = L.halo * 0.9 + L.core + 8, keep = (x, y) => Math.hypot(x - lx, y - ly) < away;
    const off = Math.round(D * 0.02), offD = sky ? Math.round(D * SKY.DEEP) : 0;
    const bright = sky ? SKY.paintSpace(bp, strip, off, lit, keep, sky, offD) : P.paintSpace(bp, strip, off, lit, keep);
    const back = document.createElement('canvas'); back.width = W; back.height = H; back.getContext('2d').putImageData(new ImageData(bp.data, W, H), 0, 0);
    const reach = Math.ceil(L.halo * 3.2 + L.core + 10), gp = P.painter(reach * 2, reach * 2, false); P.lightGlow(gp, reach, reach, L, 1); const glow = gp.canvas();
    function draw(t) {
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(back, 0, 0);
        if (window.ShipArt) { const T = window.ShipArt.stars(1), s = T.size; for (let y = -s; y < H; y += s) for (let x = -s; x < W; x += s) ctx.drawImage(T.canvas, x, y); }
        if (sky && sky.thing) ctx.drawImage(sky.thing.canvas, -Math.min(sky.thing.canvas.width - W, Math.round(D * sky.thing.speed)), 0);
        if (sky && sky.live) sky.live(ctx, t, D);
        ctx.drawImage(glow, Math.round(lx) - reach, Math.round(ly) - reach);
        P.twinkle(P.framer(ctx, W, H), bright, t);
    }
    document.getElementById('say').textContent = q.has('label') ? q.get('label') : '';
    if (q.has('still')) { draw(t0); document.body.dataset.still = 'ready'; return; }
    const start = performance.now();
    (function loop(now) { draw(t0 + now - start); requestAnimationFrame(loop); })(start);
    document.body.dataset.still = 'ready';
})();
</script>
</body>
</html>
