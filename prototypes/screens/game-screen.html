<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Silent Exodus Screen</title>
<meta name="description" content="Silent Exodus game screen mockup: the whole sector is one painting. Point at a world and the ship flies there.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=IBM+Plex+Sans+Condensed:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* The words are "Graphite": bone, grey, steel; sodium only for people and the false sun; one red, for harm. The picture is
   "Deep field" (the script). Text sizes follow the CSS viewport, not the pixel scale: --t runs 0 at 1280 wide to 1 at 1920
   (set by measure()), so 1440 x 900 reads as well as either end. Nothing you must read is under 14px. */
:root {
    color-scheme: dark;
    --t: 1;
    --ink: #05070a;
    --text: #e4e4e0;
    --dim: #8b8d90;
    --faint: #5a6168;
    --ui: #c9d1d6;
    --warm: #f08c2e;
    --warm-br: #ffc27a;
    --danger: #e0453a;
    --f-ui: 'IBM Plex Sans Condensed', 'Arial Narrow', sans-serif;
    --f-text: 'IBM Plex Sans', system-ui, sans-serif;
    --f-num: 'IBM Plex Mono', ui-monospace, Consolas, monospace;
    --fs-voice: calc(19px + 5px * var(--t)); --fs-who: calc(14px + 1px * var(--t)); --measure: calc(470px + 150px * var(--t));
    --fs-note-name: calc(17px + 3px * var(--t)); --fs-note-line: calc(15px + 2px * var(--t)); --fs-note-cost: calc(14px + 1px * var(--t));
    --fs-chip: calc(14px + 2px * var(--t)); --fs-title: calc(34px + 12px * var(--t)); --fs-act: calc(17px + 3px * var(--t)); --fs-act-sub: calc(14px + 1px * var(--t));
    --fs-tag: calc(14px + 1px * var(--t)); --fs-hint: calc(14px + 1px * var(--t));
    --shadow: 0 1px 0 #05070a;                                     /* one hard ink edge: the dither shade under words does the rest */
    --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--ink); overflow: hidden; }
body { color: var(--text); font: 400 15px/1.4 var(--f-text); -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none; }
p { margin: 0; }
button { font: inherit; color: inherit; }
#stage { position: fixed; inset: 0; overflow: hidden; outline: none; }
#stage.is-pointing { cursor: pointer; }
canvas { position: absolute; left: 0; top: 0; display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
#film { display: none; }
.layer { position: absolute; inset: 0; pointer-events: none; }

/* ── words that belong to the world: a place's note, names, chips, the sector title, the actions in orbit ── */
.w { position: absolute; left: 0; top: 0; white-space: nowrap; text-shadow: var(--shadow); pointer-events: none; will-change: transform, opacity; }
.note { display: grid; gap: 3px; }
.note .name { font: 500 var(--fs-note-name)/1.15 var(--f-ui); letter-spacing: 0.02em; color: var(--text); }
.note .line { font: 400 var(--fs-note-line)/1.35 var(--f-text); color: var(--dim); }
.note .cost { font: 400 var(--fs-note-cost)/1.4 var(--f-num); color: var(--ui); }
.note .cost .gain { color: var(--text); }
.note.is-left { text-align: right; justify-items: end; }
.tag { font: 500 var(--fs-tag)/1.2 var(--f-ui); letter-spacing: 0.08em; color: #aeb3b4; }
.dated { font: 400 var(--fs-tag)/1.3 var(--f-num); color: var(--ui); }
.hint { font: 400 var(--fs-hint)/1.3 var(--f-num); color: var(--dim); }
.chips { display: flex; gap: 14px; }
.chip { font: 400 var(--fs-chip)/1 var(--f-num); color: var(--ui); }
.chip.is-gain { color: var(--text); }
.chip.is-loss { color: var(--danger); }
.title { font: 300 var(--fs-title)/1 var(--f-text); letter-spacing: 0.2em; color: var(--text); }
.supplies { display: grid; gap: 3px; }
.supplies .nums { font: 400 var(--fs-note-cost)/1.3 var(--f-num); color: var(--ui); }
.supplies .sub { font: 400 var(--fs-note-line)/1.3 var(--f-text); color: var(--dim); }
.low { font: 400 var(--fs-note-cost)/1 var(--f-num); color: var(--text); }
.place-head { display: grid; gap: 4px; }
.place-head .name { font: 500 calc(var(--fs-note-name) * 1.3)/1.1 var(--f-ui); letter-spacing: 0.03em; color: var(--text); }
.place-head .line { font: 400 var(--fs-note-line)/1.35 var(--f-text); color: var(--dim); }
.place-head.is-right { text-align: right; justify-items: end; }
.act {
    position: absolute; left: 0; top: 0; pointer-events: auto; cursor: pointer; display: grid; gap: 3px;
    padding: 6px 8px; margin: 0; background: none; border: 0; text-align: left; white-space: nowrap;
    text-shadow: var(--shadow); will-change: transform, opacity;
}
.act .verb { font: 400 var(--fs-act)/1.2 var(--f-text); color: var(--text); transition: color 140ms var(--ease); }
.act .sub { font: 400 var(--fs-act-sub)/1.3 var(--f-num); color: var(--dim); }
.act:hover .verb, .act:focus-visible .verb, .act.is-hot .verb { color: var(--warm); }
.act:focus-visible { outline: none; }
.act.is-pulse .verb { animation: act-pulse 900ms var(--ease) 3; }
@keyframes act-pulse { 50% { color: var(--warm-br); } }

/* ── the reading layer, the ship view and their words live in game-screen/reading.css ── */

/* ── the Esc menu: five quiet words in the middle of a dimmed screen ── */
.menu { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; }
.menu[hidden] { display: none; }
.menu ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; text-align: center; }
.menu button { background: none; border: 0; cursor: pointer; font: 300 calc(var(--fs-voice) * 1.05)/1.2 var(--f-text); letter-spacing: 0.06em; color: var(--dim); text-shadow: var(--shadow); transition: color 140ms var(--ease); }
.menu button:hover, .menu button:focus-visible { color: var(--text); outline: none; }

/* ── mockup controls: NOT part of the game. Nothing shows until the backtick key opens the list. ── */
.mockup-btn {
    display: none; position: fixed; left: 8px; bottom: 8px; z-index: 40; padding: 3px 6px; cursor: pointer;
    font: 500 10px/1 var(--f-ui); letter-spacing: 0.2em; color: #50565c; background: rgba(5, 7, 10, 0.6); border: 1px dashed #2c3036;
}
.mockup-btn:hover, .mockup-btn:focus-visible { color: #9aa0a6; border-color: #50565c; outline: none; }
.moments { position: fixed; left: 8px; bottom: 8px; z-index: 40; padding: 8px 10px 10px; background: rgba(10, 12, 15, 0.94); border: 1px dashed #2c3036; display: grid; gap: 2px; min-width: 250px; }
.moments[hidden] { display: none; }
.moments b { font: 500 10px/1.6 var(--f-ui); letter-spacing: 0.2em; color: #6d747a; text-transform: uppercase; }
.moments button { text-align: left; background: none; border: 0; padding: 4px 4px; cursor: pointer; font: 400 12px/1.2 var(--f-num); color: #9aa0a6; }
.moments button:hover, .moments button:focus-visible { color: #fff; background: #1a1d21; outline: none; }
.moments small { font: 400 11px/1.4 var(--f-text); color: #6d747a; }
@media (prefers-reduced-motion: reduce) { .act.is-pulse .verb { animation: none; } }
</style>

<script>
// A costume that is being redrawn must not stop the page: its person falls back to a plain stand-in in the ship view.
// The figures keep their portrait colours: the designer wants them to look like the portraits.
(function () {
    const CS = window.CrewSprites; if (!CS) return;
    const HOUSE = {};
    const register = CS.register;
    CS.register = c => {
        try { return register(HOUSE[c.id] ? Object.assign({}, c, { palette: Object.assign({}, c.palette, HOUSE[c.id]) }) : c); }
        catch (err) { console.warn('Crew costume skipped:', err.message); return null; }
    };
})();
</script>

<div id="stage" tabindex="-1" aria-label="The sector">
    <canvas id="world" aria-hidden="true"></canvas>
    <canvas id="film" width="480" height="160" aria-hidden="true"></canvas>

</div>
<div class="menu" id="menu" hidden>
    <ul>
        <li><button type="button" data-menu="resume">Resume</button></li>

<script>
(function () {
    'use strict';

    // ═══════════════════════════════════════════════════════════════════════════════════════════════════════════
    // 1. The picture recipe (from main-screens.html and src/systems/SceneArt.js): ordered 8x8 Bayer dither between
    //    colour ramps, seeded value noise, one light. Every ramp starts at the same ink so every material fades out.
    // ═══════════════════════════════════════════════════════════════════════════════════════════════════════════
    const INK = '#05070a', TICK = 125, SW = 640, SH = 360;
    const BAYER_RAW = [0, 32, 8, 40, 2, 34, 10, 42, 48, 16, 56, 24, 50, 18, 58, 26, 12, 44, 4, 36, 14, 46, 6, 38, 60, 28, 52, 20, 62, 30, 54, 22,
        3, 35, 11, 43, 1, 33, 9, 41, 51, 19, 59, 27, 49, 17, 57, 25, 15, 47, 7, 39, 13, 45, 5, 37, 63, 31, 55, 23, 61, 29, 53, 21];
    const BAYER8 = BAYER_RAW.map(v => (v + 0.5) / 64);
    const threshold = (x, y) => BAYER8[((y & 7) << 3) | (x & 7)];
    const clamp01 = v => (v < 0 ? 0 : v > 1 ? 1 : v);
    const smooth = (a, b, v) => { const k = clamp01((v - a) / (b - a)); return k * k * (3 - 2 * k); };
    const lerp = (a, b, k) => a + (b - a) * k;
    function seeded(seed) { let s = seed >>> 0 || 1; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
    const PERM = (() => { const r = seeded(1337), p = Array.from({ length: 256 }, (_, i) => i); for (let i = 255; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [p[i], p[j]] = [p[j], p[i]]; } return Uint8Array.from(p); })();
    const hash = (x, y, s = 0) => PERM[(PERM[(PERM[x & 255] + y) & 255] + s) & 255] / 255;
    function vnoise(x, y, s = 0) {
        const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi, u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
        const a = hash(xi, yi, s), b = hash(xi + 1, yi, s), c = hash(xi, yi + 1, s), d = hash(xi + 1, yi + 1, s);
        return (a * (1 - u) + b * u) * (1 - v) + (c * (1 - u) + d * u) * v;
    }
    function fbm(x, y, s = 0, oct = 4) { let sum = 0, amp = 0.5, f = 1, n = 0; for (let i = 0; i < oct; i++) { sum += amp * vnoise(x * f, y * f, s + i * 17); n += amp; f *= 2.03; amp *= 0.5; } return sum / n; }
    const gauss = rand => (rand() + rand() + rand() + rand() - 2) * 0.87;
    const hexRgb = h => { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
    const ramp = (...hex) => ({ hex, rgb: hex.map(hexRgb) });
    function level(r, v, x, y) { const top = r.hex.length - 1, pos = clamp01(v) * top, lo = Math.floor(pos); return Math.min(top, lo + (pos - lo > threshold(x, y) ? 1 : 0)); }
    const norm3 = (x, y, z) => { const n = Math.hypot(x, y, z) || 1; return [x / n, y / n, z / n]; };

    // The world palette, "Deep field": teal-black space, rust-gold dust, ice instruments; amber only for people; the false sun warmest.
    const RP = {
        STAR: ramp(INK, '#1b272c', '#4c5f66', '#b3c2c0', '#f6f1e4'),
        HAZE: ramp(INK, '#0a1317', '#0f222a', '#152f38', '#1f3a43'),
        DUST: ramp(INK, '#160f0b', '#2c1a10', '#4e2f1a', '#7c4a26', '#b0733c'),
        SUN: ramp(INK, '#1f140b', '#4a2e12', '#9a5a26', '#e9a25e', '#f7c483', '#fff3dc'),
        HULL: ramp(INK, '#121c22', '#22333b', '#3d5560', '#8aa2aa', '#e6eef0'),
        UI: ramp(INK, '#13232a', '#284650', '#3d6670', '#9fd8e6', '#e1f6fb'),
        ICE: ramp(INK, '#0c1a20', '#1a3440', '#33606e', '#7fb3c2', '#d6eef4'),
        STONE: ramp(INK, '#13181a', '#272f31', '#465153', '#7c8786', '#c4ccc8'),
        DESERT: ramp(INK, '#1a110c', '#38231a', '#664129', '#9c6a42', '#d0a376'),
        GAS: ramp(INK, '#1c120b', '#3f2715', '#6c4523', '#a26f3b', '#d9ad74'),
        DARK: ramp(INK, '#0e1216', '#1d242b', '#333d47', '#66727d', '#b4c0c8'),
        AMBER: ramp(INK, '#3a2410', '#8a5422', '#e8964a', '#f7c483', '#fff3dc'),
        RED: ramp(INK, '#3a1210', '#8a2a22', '#e2574c', '#ffd2c8'),
        RING: ramp(INK, '#11171a', '#1f292e', '#34424a', '#5a6a6e', '#93a3a2'),
        RUST: ramp(INK, '#140f0e', '#261c19', '#3a2b25', '#564034', '#7a604f'),
        OCEAN: ramp(INK, '#07161c', '#0c2a33', '#134249', '#1f6463', '#4b9488', '#a4d3c1'),
        LAND: ramp(INK, '#0c170f', '#17301f', '#26482c', '#45683d', '#829a63'),
        CLOUD: ramp(INK, '#141c20', '#34444a', '#71878a', '#c3d2d0', '#eef4f2'),
    };
    const PLANET_RAMP = { desert: RP.DESERT, gas: RP.GAS, ice: RP.ICE, rock: RP.STONE, dark: RP.DARK };

    /** A pixel buffer painted once. An opaque buffer starts as ink; a clear one starts empty, and tone() leaves its darkest step empty. */
    function painter(W, H, isOpaque) {
        const data = new Uint8ClampedArray(W * H * 4);
        if (isOpaque) { const k = hexRgb(INK); for (let i = 0; i < W * H; i++) { data[i * 4] = k[0]; data[i * 4 + 1] = k[1]; data[i * 4 + 2] = k[2]; data[i * 4 + 3] = 255; } }
        const set = (x, y, rgb) => { x = Math.floor(x); y = Math.floor(y); if (x < 0 || y < 0 || x >= W || y >= H) return; const o = (y * W + x) * 4; data[o] = rgb[0]; data[o + 1] = rgb[1]; data[o + 2] = rgb[2]; data[o + 3] = 255; };
        const get = (x, y) => { const o = (y * W + x) * 4; return [data[o], data[o + 1], data[o + 2], data[o + 3]]; };
        const solid = (x, y, r, v) => set(x, y, r.rgb[level(r, v, Math.floor(x), Math.floor(y))]);
        const tone = (x, y, r, v) => { const k = level(r, v, Math.floor(x), Math.floor(y)); if (k === 0 && !isOpaque) return; set(x, y, r.rgb[k]); };
        const add = (x, y, r, v) => { const k = level(r, v, Math.floor(x), Math.floor(y)); if (k > 0) set(x, y, r.rgb[k]); };   // light laid over what is there: never paints ink
        const cover = (x, y, r, v, a) => { if (a > threshold(Math.floor(x) + 3, Math.floor(y) + 5)) tone(x, y, r, v); };
        const region = (x0, y0, x1, y1, fn) => { for (let y = Math.max(0, Math.floor(y0)); y < Math.min(H, Math.ceil(y1)); y++) for (let x = Math.max(0, Math.floor(x0)); x < Math.min(W, Math.ceil(x1)); x++) fn(x, y); };
        const ellipse = (cx, cy, rx, ry, fn) => region(cx - rx - 1, cy - ry - 1, cx + rx + 1, cy + ry + 1, (x, y) => { const q = ((x + 0.5 - cx) / rx) ** 2 + ((y + 0.5 - cy) / ry) ** 2; if (q < 1) fn(x, y, q); });
        const line = (x0, y0, x1, y1, fn) => { const n = Math.max(1, Math.ceil(Math.hypot(x1 - x0, y1 - y0))); for (let k = 0; k <= n; k++) fn(Math.round(x0 + (x1 - x0) * k / n), Math.round(y0 + (y1 - y0) * k / n), k / n); };
        const canvas = () => { const c = document.createElement('canvas'); c.width = W; c.height = H; c.getContext('2d').putImageData(new ImageData(data, W, H), 0, 0); return c; };
        return { W, H, data, set, get, solid, tone, add, cover, region, ellipse, line, canvas };
    }

    /** The moving layer: a few rectangles a frame, straight onto the canvas. */
    function framer(ctx, W, H) {
        let cur = '';
        const px = (x, y, hex, w = 1, h = 1) => { const xi = Math.round(x), yi = Math.round(y); if (xi + w <= 0 || yi + h <= 0 || xi >= W || yi >= H) return; if (hex !== cur) { ctx.fillStyle = hex; cur = hex; } ctx.fillRect(xi, yi, w, h); };
        const tone = (x, y, r, v, w = 1, h = 1) => { const xi = Math.round(x), yi = Math.round(y), k = level(r, v, xi, yi); if (k === 0) return; px(xi, yi, r.hex[k], w, h); };
        const glow = (cx, cy, rad, r, peak) => { for (let y = -rad; y <= rad; y++) for (let x = -rad; x <= rad; x++) { const d = Math.hypot(x, y) / rad; if (d < 1) tone(cx + x, cy + y, r, peak * (1 - d) ** 1.5); } };
        return { px, tone, glow };
    }

    // ── shared pieces ──
    function scatterStars(p, seed, count, where) {
        const rand = seeded(seed), list = [];
        for (let i = 0; i < count; i++) {
            const x = Math.floor(rand() * p.W), y = Math.floor(rand() * p.H), mag = rand();
            if (where && !where(x, y)) continue;
            if (mag > 0.979) { p.set(x, y, RP.STAR.rgb[4]); [[-1, 0], [1, 0], [0, -1], [0, 1]].forEach(([dx, dy]) => p.set(x + dx, y + dy, RP.STAR.rgb[2])); }
            else if (mag > 0.88) p.set(x, y, RP.STAR.rgb[3]);
            else p.set(x, y, RP.STAR.rgb[mag > 0.55 ? 2 : 1]);
            list.push({ x, y, mag });
        }
        return list;
    }
    function keepVisible(p, list) {
        return list.filter(s => { if (s.mag < 0.88 || s.x < 0 || s.y < 0 || s.x >= p.W || s.y >= p.H) return false; const c = p.get(s.x, s.y); return RP.STAR.rgb.slice(3).some(k => k[0] === c[0] && k[1] === c[1] && k[2] === c[2]); });
    }
    function twinkle(f, list, t) {
        const step = Math.floor(t / 375);
        list.forEach((s, i) => { if (hash(i, step, 5) < 0.9) return; f.px(s.x - 1, s.y, RP.STAR.hex[3], 3, 1); f.px(s.x, s.y - 1, RP.STAR.hex[3], 1, 3); f.px(s.x, s.y, RP.STAR.hex[4]); });
    }
    /** Space: a thin teal haze, and rust-gold dust that only shows where the light reaches it. */
    function spaceAndDust(p, seed, lx, ly, halo, dustAmount, hazeAmount = 1) {
        p.region(0, 0, p.W, p.H, (x, y) => {
            const d = Math.hypot(x - lx, (y - ly) * 1.15), lit = Math.exp(-d / (halo * 0.85 + 6));
            const dust = Math.max(0, fbm(x / 46, y / 26, seed + 7, 4) - 0.5) * 3.4 * dustAmount, vd = dust * 2.8 * lit;
            const vh = Math.max(0, fbm(x / 70, y / 38, seed, 4) - 0.5) * 1.15 * hazeAmount;
            if (vd > 0.12 && vd * 0.75 > vh) { p.tone(x, y, RP.DUST, vd); return; }                  // whichever is stronger: no hard edge where the dust begins
            if (vh > 0.03) p.tone(x, y, RP.HAZE, vh);
        });
    }
    /** The false sun: a white-gold core, a soft dithered halo and a thin horizontal streak. */
    function lightGlow(p, lx, ly, o, breath = 1) {
        const reach = o.halo * 3.2 + o.core + 8, s = o.strength * breath;
        p.region(lx - reach, ly - reach, lx + reach, ly + reach, (x, y) => {
            const dx = x + 0.5 - lx, dy = (y + 0.5 - ly) * 1.06, d = Math.hypot(dx, dy);
            if (d < o.core) { p.tone(x, y, RP.SUN, 1.02 - 0.3 * (d / o.core) ** 3); return; }

    /** Sector 5: a river of dead hulls. Thousands of them, all flying the same way, nose to the light: big and broken near the
        lower left, smaller and smaller up the current, then specks and ticks against the gold. Painted into its own layer so the
        current can drift. The nearest carries its number, 14,086, the hull Kryos-0 Alpha's wreck sends. */
    const RIVER_PAD = 32;
    function paintHullRiver(geo) {
        const p = painter(G.W + RIVER_PAD, G.H, false), [lx0, ly] = geo.light, V = [lx0 + RIVER_PAD, ly];
        const N = [RIVER_PAD + G.ox - 40, G.oy + 372], z0 = 1.5, rand = seeded(5051), blinkers = [];

        const at = (z, X, Y) => { const f = z0 / z, m = 24 * Math.sin(z * 0.23) + 16 * Math.sin(z * 0.071 + 1); return [V[0] + (dx + px * (X + m)) * f, V[1] + (dy + py * (X + m) + Y) * f]; };

        const flowAt = (x, y) => Math.atan2(V[1] - y, V[0] - x);                                   // the way the current runs here: into the light
        for (let i = 0; i < 9000; i++) {                                                             // far away: ticks, then specks, against the gold
            const f = 0.004 + 0.16 * Math.pow(rand(), 1.3), [x, y] = at(z0 / f, gauss(rand) * 84, gauss(rand) * 30), lit = glowAt(x, y);

            const long = f > 0.07 && rand() < 0.5 ? 2 : 1, a = flowAt(x, y);                           // the bigger specks are short dashes along the current

        }

        for (let i = 0; i < 1100; i++) { const z = 1.7 + 52 * Math.pow(rand(), 0.66); hulls.push({ z, X: gauss(rand) * 86, Y: gauss(rand) * 30, a: (rand() - 0.5) * (z < 6 ? 0.5 : 0.26), holes: rand() < (z < 6 ? 0.6 : 0.3), cut: rand() * (z < 6 ? 0.6 : 1), cutAt: rand(), seed: i + 500 }); }

            hulls.push({ z, X, Y, a, holes: i % 3 !== 1, cut: i % 2 ? 0.1 : 0.9, cutAt: 0.3 + 0.1 * i, seed: 8800 + i, rust: i % 3 === 0 }));   // the near ones, broken, drifting the same way
        hulls.push({ z: 1.72, fixed: [150, 306], len: 116, a: 0.18, holes: false, cut: 0.3, cutAt: 0.82, seed: 9001, number: '14,086' });   // the nearest, whole in frame: seams and its number
        hulls.push({ z: 2.7, X: 92, Y: -26, a: 0.12, holes: true, cut: 0.1, cutAt: 0.4, seed: 9002 });
        hulls.sort((a, b) => b.z - a.z).forEach((h, i) => {

            if (!h.number && len > 30 && Math.abs(x - RIVER_PAD - cvX(150)) < 90 && Math.abs(y - cvY(306)) < 34) return;          // and round the numbered hull
            const toV = norm3(V[0] - x, V[1] - y, 0), angle = flowAt(x, y) + h.a;
            const broken = h.cut < 0.32 ? (h.cutAt < 0.5 ? { from: 0.15 + h.cutAt * 0.6 } : { to: 0.5 + h.cutAt * 0.4 }) : {};
            const at2 = drawHull(p, Object.assign({ x, y, len, ht: len * 0.23, angle: h.number ? flowAt(x, y) * 0.5 : angle, flip: true, light: h.number ? 0.4 : 0.02 + (0.06 + 0.11 * Math.min(1, 2.6 / h.z)) * (1 - lit) * (0.75 + 0.5 * hash(i, 9, 2)),   // we see their dark sides

    /** Sector 6: the light's face, cut by the right edge of the frame: the frame is still mostly dark. Gold at the limb, cream
        toward its hidden middle, a boiling grain over it, and a stream of hulls crossing it: the far ones small and lost in the
        glare, the near ones black. */
    const FACE_R = 190;
    function faceGeo() { return { cx: G.W + 64, cy: G.oy + 169, R: FACE_R }; }
    function paintLightFace(p, out, geo, at) {
        const { cx, cy, R } = at || faceGeo(), mask = new Uint8Array(p.W * p.H), hullScale = R / FACE_R;
        const tone = new Float32Array(p.W * p.H);

            const d = Math.hypot(x + 0.5 - cx, y + 0.5 - cy), k = Math.min(1, d / R), mu = Math.sqrt(1 - k * k);
            const cells = fbm(x / 4, y / 4, 66, 3), swirl = fbm(x / 34 + 3, y / 22, 67, 3);

        };

            const dx = x + 0.5 - cx, dy = y + 0.5 - cy, d = Math.hypot(dx, dy);

            const v = 0.7 * Math.exp(-e / (R * 0.025)) + 0.32 * Math.exp(-e / (R * 0.09)) + 0.2 * Math.exp(-e / (R * 0.32)) * (0.3 + 1.1 * streak);
            if (v > 0.03) p.add(x, y, RP.SUN, v);

            const y = cy + (rand() - 0.5) * R * 1.8, half = Math.sqrt(Math.max(0, R * R - (y - cy) ** 2)), x = lerp(Math.max(left, cx - half), Math.min(p.W + 10, cx + half), rand());

            const o = { x, y, len, ht: len * 0.24, angle: (rand() - 0.5) * 0.5, flip: true, seed: 600 + i, from: rand() < 0.3 ? 0.3 : 0, holes: len > 40 && rand() < 0.5 };
            if (isFar) Object.assign(o, { ramp: RP.SUN, light: Math.max(0.12, faceTone(Math.round(x), Math.round(y)) * 0.92 - 0.12) });   // lost in the glare

    /** The slow sweep across the light's face: a brighter meridian that turns with it, so it reads as a sphere, not a line. */

    const spriteCache = new Map();

        for (let i = -26; i <= 26; i++) {
            const a = i * 0.05, half = Math.ceil(len / 2 + ht + 4), p = painter(half * 2, half * 2, false);

    // ═══════════════════════════════════════════════════════════════════════════════════════════════════════════
    // 7. Drawing the sector, frame by frame.
    // ═══════════════════════════════════════════════════════════════════════════════════════════════════════════
    function drawSector(c, t) {
        const sec = SECTORS[S.n], P = sectorPainting(S.n), Lp = placesLayer(), f = framer(c, G.W, G.H);
        c.drawImage(P.base, 0, 0);
        if (P.glow) { const g = P.glow[Math.floor(t / 500) % P.glow.length]; c.drawImage(g.canvas, g.x, g.y); }
        const drift = Math.min(30, Math.floor((t - S.sectorT0) / 8000));                             // the river's current: a pixel every eight seconds
        if (P.river) c.drawImage(P.river, -RIVER_PAD + drift, 0);
        twinkle(f, P.stars, t);
        P.blinkers.forEach(b => { if ((t + b.phase) % b.period < 200) { if (b.red || P.river) { f.px(b.x + (P.river ? drift : 0), b.y, RP.RED.hex[3], 1, 1); f.px(b.x + (P.river ? drift : 0), b.y - 1, RP.RED.hex[2], 1, 1); } else f.px(b.x, b.y, RP.UI.hex[5]); } });
        if (P.lamps) P.lamps.forEach((l, i) => { if (hash(i, Math.floor(t / 750), 4) > 0.86) f.px(l.x, l.y, RP.AMBER.hex[5]); });

    }

    function drawPlaceMotion(f, t, Lp) {
        S.places.forEach(pl => {
            const s = Lp.spots[pl.id]; if (!s || pl.kind === 'giant') return;
            if (pl.hidden) { contactBlip(f, s.cx, s.cy, t); if (pl.beacon === 'warm') { f.px(s.cx + 3, s.cy + 2, RP.AMBER.hex[hash(Math.floor(t / TICK), 1, 9) > 0.15 ? 4 : 3]); } return; }
            if (S.reveal && S.reveal.id === pl.id) {                                                    // the contact grows into the world
                const k = clamp01((t - S.reveal.t0) / 900);
                if (k < 1) { for (let y = -s.r - 2; y <= s.r + 2; y++) for (let x = -s.r - 2; x <= s.r + 2; x++) { const d = Math.hypot(x, y) / (s.r + 2); if (d < 1 && d > k * 1.2 - 0.1 && threshold(s.cx + x, s.cy + y) > k) f.px(s.cx + x, s.cy + y, INK); } contactBlip(f, s.cx, s.cy, t, true); }
            }
            const live = !isBehind(pl) && !pl.visited;
            if (s.beacon && live) {
                const [bx, by] = s.beacon;
                if (pl.beacon === 'warm') { f.glow(bx, by, 3, RP.AMBER, 0.75 + 0.1 * Math.sin(t / 300)); f.px(bx, by, RP.AMBER.hex[4]); }
                else if (t % 1500 < 380) { f.glow(bx, by, 4, RP.RED, 0.9); f.px(bx, by, RP.RED.hex[4]); } else f.px(bx, by, RP.RED.hex[2]);

            if (pl.kind === 'station' && s.win && live) {
                if (!pl.dark) f.px(s.win[0], s.win[1], RP.AMBER.hex[4]);
                else if (t % 2200 < 220) { f.glow(s.win[0], s.win[1] - 3, 3, RP.RED, 0.8); f.px(s.win[0], s.win[1] - 3, RP.RED.hex[4]); }

    }

    function drawHover(f, t, Lp) {
        const h = S.hover; if (!h || S.course) return;
        if (h.kind === 'place') { const s = Lp.spots[h.id]; if (s && s.rims) s.rims.forEach(([x, y, r, lv]) => f.px(x, y, r.hex[Math.min(r.hex.length - 1, lv + 1)])); }
        if (h.kind === 'light' && !SECTORS[S.n].light.face) { const [lx, ly] = lightPos(); for (let d = 2; d < 9; d++) { const v = 0.85 - d * 0.08; f.tone(lx - d, ly, RP.SUN, v); f.tone(lx, ly - d, RP.SUN, v); f.tone(lx, ly + d, RP.SUN, v); } }
    }

    // ── the course: a warm dithered curve from our nose to the world; the ship flies the same curve ──

        });
    }

    function shipWarmth() { const g = { 1: 0.05, 2: 0.07, 3: 0.12, 4: 0.2, 5: 0.5, 6: 0.8 }; return g[S.n] || 0.1; }

        const cx = Math.round(cvX(S.ship.x)), cy = Math.round(cvY(S.ship.y)) + bob;

        sp.windows.forEach(([wx, wy], i) => {

    // ═══════════════════════════════════════════════════════════════════════════════════════════════════════════
    // 8. Orbit: the planet huge and cut by the frame, framed differently for each world; our ship small, holding station.

    // ═══════════════════════════════════════════════════════════════════════════════════════════════════════════

    // wreck can be dated.

        rhea: { cx: 462, cy: 418, r: 214, lz: -0.6, beacon: [-154, 0.92], ship: [196, 88, 54] },
        chronos: { cx: 330, cy: 540, r: 330, lz: -0.4, ship: [488, 74, 58] },
        zephyr: { cx: 54, cy: 250, r: 250, lz: -0.45, ship: [470, 112, 56] },
        kryos: { cx: 300, cy: 690, r: 500, lz: -0.55, ship: [470, 68, 58], clouds: [-80, 0.97] },
        kryos0: { cx: 470, cy: 452, r: 256, lz: -0.65, beacon: [-150, 0.93], ship: [306, 88, 56] },
        iapetus: { cx: 196, cy: 446, r: 236, lz: -0.7, beacon: [-126, 0.9], ship: [478, 96, 56] },
        chronos61: { cx: 318, cy: 512, r: 268, lz: -0.45, ship: [502, 70, 56] },
        titan92: { cx: 170, cy: 430, r: 246, lz: -0.55, beacon: [-128, 0.92], ship: [470, 116, 56] },
    };
    const ORBIT_DEFAULTS = [{ cx: 250, cy: 480, r: 286, lz: -0.45, ship: [480, 82, 56] }, { cx: 430, cy: 470, r: 270, lz: -0.45, ship: [190, 88, 56] }, { cx: 64, cy: 252, r: 246, lz: -0.45, ship: [470, 110, 56] }];
    const orbitLayout = pl => ORBIT_AT[pl.id] || ORBIT_DEFAULTS[(pl.id.length + (pl.r || 0)) % ORBIT_DEFAULTS.length];
    function orbitPainting(pl) {
        const key = `${S.n}:${pl.id}:${G.W}x${G.H}`;
        if (orbits.has(key)) return orbits.get(key);
        const sec = SECTORS[S.n], p = painter(G.W, G.H, true), seed = (pl.r || 20) * 13 + S.n * 7 + pl.id.length;
        const isLight = pl.kind === 'light', ol = isLight ? null : sec.orbitLight, lx = isLight ? cvX(440) : cvX(ol.x), ly = isLight ? cvY(170) : cvY(ol.y);
        spaceAndDust(p, seed, lx, ly, isLight ? 120 : ol.halo, sec.dust, sec.haze);
        const dateStars = DATE_STARS.map(([x, y]) => [cvX(x), cvY(y)]);
        const stars = scatterStars(p, seed + 1, Math.round(G.W * G.H / 170), (x, y) => Math.hypot(x - lx, y - ly) > (isLight ? 150 : ol.halo * 0.8 + ol.core + 6) && dateStars.every(([a, b]) => Math.hypot(x - a, y - b) > 6));
        dateStars.forEach(([x, y]) => { p.set(x, y, RP.STAR.rgb[4]); [[-1, 0], [1, 0], [0, -1], [0, 1]].forEach(([dx, dy]) => p.set(x + dx, y + dy, RP.STAR.rgb[3])); [[-2, 0], [2, 0], [0, -2], [0, 2]].forEach(([dx, dy]) => p.set(x + dx, y + dy, RP.STAR.rgb[1])); });
        if (!isLight) lightGlow(p, lx, ly, ol);
        const skyData = p.data.slice();                                                            // before the planet and our ship: what is sky
        const o = { stars: [], focal: null, anchors: {}, dateStars, kind: pl.kind };
        if (isLight) orbitTheLight(p, o, lx, ly);

            o.ship = { x: sx, y: sy, len, ht, windows: SHIP.windowsU.map(u => at(u, -0.05).map(Math.round)), belly: at(0.5, 0.5).map(Math.round), tail: at(1, 0).map(Math.round) };

        o.base = p.canvas();
        o.data = p.data;

    }
    function orbitPlanet(p, o, sec, pl, seed, lx, ly) {
        const lay = orbitLayout(pl), isGas = pl.type === 'gas' || pl.kind === 'giant', type = isGas ? 'gas' : pl.type;
        const cx = cvX(lay.cx), cy = cvY(lay.cy), r = lay.r, L = norm3(lx - cx, ly - cy, lay.lz * Math.hypot(lx - cx, ly - cy));   // lz below 0: lit from behind, most of it night

            atmo: { ramp: type === 'gas' || type === 'desert' ? RP.DUST : RP.ICE, w: 5 } });

        if (pl.orbiters) [[430, 92, 0.2], [128, 150, -0.6], [560, 200, 0.9]].forEach(([x, y, a], i) => drawHull(p, { x: cvX(x), y: cvY(y), len: 22, ht: 5, angle: a, light: 0.5, rust: true, seed: i + 30, ramp: RP.DESERT }));
        o.planet = { cx, cy, r };
    }
    function orbitStation(p, o, sec, pl, lx, ly) {
        const cx = cvX(250), cy = cvY(850), r = 630, L = lightVector(cvX(240), cvY(270), lx, ly, 340);
        sphere(p, { cx, cy, r, ramp: pl.dark ? RP.DARK : RP.STONE, L, surface: surfaceFor('rock', 21, L), rim: sec.rim > 0.4 ? 0.5 : 0.1, ambient: 0.01, gain: 0.75 });
        const win = drawStation(p, cvX(320), cvY(150), 2.8, 5);

        o.anchors.beacon = [win[0], win[1]];

    }
    function orbitTheLight(p, o, cx, cy) {

        o.face = face.face;

        o.ship = { x: sx, y: sy, len, ht: 19, windows: SHIP.windowsU.map(u => at(u, -0.05).map(Math.round)), belly: at(0.5, 0.5).map(Math.round), tail: at(1, 0).map(Math.round) };
        o.lightCore = [cx, cy, R];

    }

    function drawOrbit(c, t) {

        const fo = o.focal;
        if (S.actThread) drawThread(f, t, S.actThread, S.actHot === 'act:step');
        if (fo) {

    // ═══════════════════════════════════════════════════════════════════════════════════════════════════════════
    // 10. Words that belong to the world: places' notes, the names on arrival, the hint, dates written on the picture,

    const marks = $('marks');

    function word(key, el, opts) {
        unword(key);
        el.classList.add('w');

        const key = 'chip:' + (++clock.seq), t0 = clock.t;
        const at = from || (() => S.view === 'orbit' && S.orbitOf ? (orbitPainting(S.orbitOf).ship ? [orbitPainting(S.orbitOf).ship.x, orbitPainting(S.orbitOf).ship.y - 14] : [G.W / 2, G.H / 2]) : [cvX(S.ship.x), cvY(S.ship.y - SHIP.ht / 2 - 4)]);
        word(key, el, { at, side: 'above', gap: 2, rise: { t0 }, fade: { t0, inMs: 1, holdMs: 1499, outMs: 1, remove: true } });
    }
    function applyGain(g) {
        if (!g) return;
        Object.keys(g).forEach(k => { S.res[k] = Math.max(0, Math.min(k === 'energy' ? 100 : 999, S.res[k] + g[k])); });
        showLowSupply();
    }
    /** Where the ship is, for grouping the record by stop. */
    function currentStop() {
        if (S.orbitOf && (S.view === 'orbit' || S.at === S.orbitOf.id)) return S.orbitOf.kind === 'light' ? 'The light' : S.orbitOf.name;
        if (S.at) { const pl = placeById(S.at); if (pl) return pl.name; }
        return S.n === 1 ? 'Waking up' : 'Arrival';
    }
    /** The ship's record. opts: { who, story, routine, page, chips, stop } (a plain string is taken as who, as before). */
    function logRecord(text, opts) {
        const o = typeof opts === 'string' ? { who: opts } : (opts || {});
        const head = `Sector ${S.n} · ${SECTORS[S.n].title}`;
        let g = record.find(x => x.head === head); if (!g) { g = { head, items: [] }; record.push(g); }
        const item = { t: text, stop: o.stop || currentStop() };
        ['who', 'story', 'routine', 'page', 'chips'].forEach(k => { if (o[k]) item[k] = o[k]; });
        g.items.push(item);
    }
    const barked = new Set();
    /** A crew remark goes to the record once a run, never on screen. */
    function barkOnce(key) { if (!BARKS[key] || barked.has(key)) return; barked.add(key); logRecord(BARKS[key][1], { who: BARKS[key][0] }); }

    // ═══════════════════════════════════════════════════════════════════════════════════════════════════════════
    // 11. What happens: arriving in a sector, pointing, choosing, flying, orbit, the team, the film, dating, the jump.
    // ═══════════════════════════════════════════════════════════════════════════════════════════════════════════
    let scenesSeen = 0;
    function enterSector(n, opts = {}) {
        clock.timers = [];
        Reading.clear();
        unwordAll();
        shades.clear();
        showFilmCanvas(false);
        S = fresh(n);
        const sec = SECTORS[n];
        if (sec.record && !opts.keepRecord) { record.length = 0; sec.record.forEach(g => record.push({ head: g.head, items: g.items.slice() })); ['disc', 'plate'].forEach(id => { if (!pagesRead.includes(id)) pagesRead.push(id); }); }
        else if (sec.record) sec.record.filter(g => g.head.startsWith(`Sector ${n}`)).forEach(g => { if (!record.some(x => x.head === g.head)) record.push({ head: g.head, items: g.items.slice() }); });
        if (sec.wake && !record.some(g => g.head.startsWith(`Sector ${n} `))) sec.wake.forEach(w => logRecord(w.t, { who: w.who, stop: 'Waking up' }));
        sectorPainting(n);
        showDatedNotes();
        showLowSupply();
        if (opts.quiet) { ShipView.prepare(); return; }
        S.intro = { t0: clock.t };
        after(60, () => ShipView.prepare());                                                            // the cut-open ship is painted while the screen is still black
        S.ship.x = -50;
        after(1200, () => showTitle(sec.title));
        after(2800, () => { S.intro = null; });
        const lines = sec.arrive || [];
        const run = i => {                                                                              // one line at a time; a click on a world ends the run
            if (i >= lines.length) { arrivalHint(); return; }
            if (i === lines.length - 1) arrivalNames();
            const [who, line, from] = lines[i];
            Reading.say(who, line, { anchor: 'ship', from, scene: 'arrival:' + n }).then(ok => {
                if (ok) { run(i + 1); return; }
                if (!S.course && S.view === 'sector' && !S.flags.namesShown) arrivalNames();                // skipped: still show the names
                arrivalHint();
            });
        };
        after(lines.length ? 5300 : 4400, () => { if (lines.length) run(0); else { arrivalNames(); arrivalHint(); } });
    }
    function arrivalNames() {
        S.flags.namesShown = true;
        showNames(4000);
    }
    /** The one-time hint beside a world, only once the voices are done: never two hints on screen at once. */
    function arrivalHint() {
        const sec = SECTORS[S.n];
        if (!sec.hint || S.flags.hintGone || S.n !== 1 || S.view !== 'sector' || S.course) return;
        const pl = placeById(sec.hint.at);
        word('hint', h('p', 'hint', sec.hint.text), { at: () => { const s = placeSpot(pl); return [s.cx, s.cy + pl.r + 3]; }, side: 'below', gap: 2, view: 'sector', alignLeft: false, shade: true, shadeStrength: 0.5, hideOnHover: true, yields: true, fade: { t0: clock.t + 400, inMs: 600, holdMs: 1e9, outMs: 0 } });
    }
    function update(dt) {
        if (!S || dt <= 0) return;
        if (S.intro) { const k = easeOut(clamp01((clock.t - S.intro.t0 - 200) / 2600)); S.ship.x = lerp(-50, SHIP.restX, k); }
        const C = S.course;
        if (C && C.phase === 'fly') {
            C.s = Math.min(1, C.s + dt / C.dur * C.speed);
            const e = ease(C.s), [nx, ny] = bez(C.curve, e), [ddx, ddy] = bezD(C.curve, Math.max(0.001, e)), want = Math.max(-1.3, Math.min(1.3, Math.atan2(ddy, ddx)));
            const a = S.ship.angle + (want - S.ship.angle) * Math.min(1, dt / 220);                  // the hull turns smoothly, it does not snap
            S.ship.angle = a; S.ship.x = nx - Math.cos(a) * SHIP.len / 2; S.ship.y = ny - Math.sin(a) * SHIP.len / 2;
            const tail = [S.ship.x - Math.cos(a) * SHIP.len / 2, S.ship.y - Math.sin(a) * SHIP.len / 2];
            const last = S.wake[S.wake.length - 1];
            if (!last || Math.hypot(tail[0] - last[0], tail[1] - last[1]) >= 1) { S.wake.push([Math.round(tail[0]), Math.round(tail[1])]); if (S.wake.length > 26) S.wake.shift(); }
            if (C.s >= 1) arrive(C);
        } else if (S.wake.length && Math.floor(clock.t / 60) !== Math.floor((clock.t - dt) / 60)) S.wake.shift();
        const J = S.jump;
        if (J && J.phase === 'go') {
            const k = clamp01((clock.t - J.t0) / 1100), e = k * k * k, [lx, ly] = lightPos();
            S.ship.x = lerp(J.x0, lx - G.ox + 30, e); S.ship.y = lerp(J.y0, ly - G.oy, e); S.ship.angle = Math.atan2(ly - G.oy - J.y0, lx - G.ox - J.x0);
        }
    }

    // ── pointing ──
    function pick(cx, cy) {
        if (S.view !== 'sector' || S.jump) return null;
        const Lp = placesLayer();
        for (let i = S.places.length - 1; i >= 0; i--) {
            const pl = S.places[i]; if (pl.kind === 'giant') continue;
            const s = Lp.spots[pl.id]; if (s && Math.hypot(cx - s.cx, cy - s.cy) <= (s.r || 8) + 6) return { kind: 'place', id: pl.id };
        }
        const [lx, ly] = lightPos();
        if (SECTORS[S.n].light.face) { const f = faceGeo(); if (Math.hypot(cx - f.cx, cy - f.cy) < f.R + 8) return { kind: 'light' }; }
        else if (Math.hypot(cx - lx, (cy - ly) * 0.8) < 18 || (cx > G.W - 14 && Math.abs(cy - ly) < 26)) return { kind: 'light' };
        const sx = cvX(S.ship.x), sy = cvY(S.ship.y);
        if (Math.abs(cx - sx) < SHIP.len / 2 + 3 && Math.abs(cy - sy) < SHIP.ht / 2 + 4) return { kind: 'ship' };
        const gp = S.places.find(p => p.kind === 'giant');
        if (gp) { const g = giantGeo(); if (Math.hypot(cx - g.cx, cy - g.cy) < g.R) return { kind: 'place', id: gp.id }; }
        return null;
    }
    const sameTarget = (a, b) => (!a && !b) || (a && b && a.kind === b.kind && a.id === b.id);
    function setHover(target) {
        if (target && target.kind === 'place') { const pl = placeById(target.id); if (!answers(pl) && !pl.hidden) target = null; }
        if (target && target.kind === 'light' && S.course) target = null;
        if (sameTarget(S.hover, target)) return;
        const wasShip = S.hover && S.hover.kind === 'ship';
        S.hover = target ? Object.assign({ t0: clock.t }, target) : null;
        if (target && target.kind === 'ship') unword('low'); else if (wasShip) showLowSupply();
        if (S.hover && S.hover.kind === 'place') { const pl = placeById(S.hover.id); if (!pl.hidden && pl.id !== S.at && !S.course) S.hover.curve = courseTo(dockFor(pl)); }
        $('stage').classList.toggle('is-pointing', !!target);
        if (!S.course) showNote(S.hover);
    }

    // ── choosing ──
    function choosePlace(pl) {
        if (S.flags.hintGone === false) { S.flags.hintGone = true; unword('hint'); }
        if (pl.id === S.at) { enterOrbit(pl, true); return; }
        if (isBehind(pl) || pl.visited) { sayOnce('passed:' + pl.id, 'A.U.R.A.', 'We passed it, Commander. The ship only flies forward.'); return; }
        if (pl.hidden) { sayOnce('contact:' + pl.id, 'A.U.R.A.', 'I cannot get a fix on that contact, Commander. There is no course to it yet.'); return; }
        if (S.stops <= 0) return;                                                                     // the worlds ahead have sunk back: only the light answers
        if (!pl.free && pl.cost > S.res.energy) { sayOnce('energy:' + pl.id, 'Jaxon', "We don't have the energy to get there.", { from: 'from engineering' }); return; }
        const curve = courseTo(dockFor(pl));
        S.course = { id: pl.id, phase: 'lock', t0: clock.t, curve, s: 0, speed: 1, dur: 3200 + curve.dist * 4 };
        unwordAll('name:');
        showNote(null);
        if (pl.react) Reading.say(pl.react[0], pl.react[1], { anchor: 'ship' });
        S.course.timer = after(1200, () => launch(pl));
    }
    function launch(pl) {
        const C = S.course; if (!C || C.id !== pl.id) return;
        C.phase = 'fly';
        if (!pl.free) { S.res.energy -= pl.cost; chips([[`−${pl.cost} energy`, 'spend']]); }
        S.stops = Math.max(0, S.stops - 1);
        logRecord(pl.free ? `Flew to ${pl.name} on their last course.` : `Flew to ${pl.name}.`, { routine: true, stop: pl.name, chips: pl.free ? null : [[`−${pl.cost} energy`, 'spend']] });
        showLowSupply();
    }
    function cancelCourse() {
        const C = S.course; if (!C || C.phase !== 'lock') return false;
        cancelTimer(C.timer); S.course = null;
        Reading.say('A.U.R.A.', 'Holding course, Commander.', { anchor: 'ship' });
        showNote(S.hover);
        return true;
    }
    function hurry() { if (S.course && S.course.phase === 'fly') { S.course.speed = 3; return true; } return false; }
    function sayOnce(key, who, line, opts) { if (Reading.isShowing(line)) return; Reading.say(who, line, Object.assign({ anchor: 'ship' }, opts)); }

    function arrive(C) {
        const pl = placeById(C.id);
        S.course = null;
        S.at = pl.id;
        S.restAfter = C.curve.p2;
        S.orbitOf = pl;
        setHover(null);
        transition('sector', 'orbit', 1000, () => { S.wake = []; settleShipAt(pl); });
        after(400, () => enterOrbitWords(pl, false));
        if (pl.orbit && pl.orbit.arrive) logRecord(pl.orbit.arrive[1], { who: pl.orbit.arrive[0], routine: true });
        barkOnce('orbit');
    }
    function settleShipAt(pl) {
        const [nx, ny] = S.restAfter || dockFor(pl);
        S.ship.angle = 0; S.ship.x = Math.round(nx - SHIP.len / 2 - 9); S.ship.y = Math.round(ny + (pl.kind === 'giant' ? -12 : 7));
        S.version++;
    }
    function transition(from, to, dur, done) { S.trans = { from, to, t0: clock.t, dur }; after(dur, () => { S.trans = null; S.view = to; if (done) done(); }); }

    // ── orbit ──
    function enterOrbit(pl, isReturn) {
        S.orbitOf = pl;
        setHover(null);
        transition('sector', 'orbit', 1000);
        after(400, () => enterOrbitWords(pl, isReturn));
    }
    function orbitData(pl) { return pl.kind === 'light' ? SECTORS[6].lightOrbit : pl.orbit; }
    function enterOrbitWords(pl, isReturn) {
        unwordAll('name:'); unword('note'); unword('hint');
        const od = orbitData(pl), o = orbitPainting(pl);
        const head = h('div', 'place-head');
        head.append(h('p', 'name', pl.kind === 'light' ? 'The light' : pl.name), h('p', 'line', od.line));
        const headLeft = pl.kind === 'light' || !o.ship || o.ship.x - G.ox > SW / 2;                                           // the name goes in the top corner away from our ship
        head.classList.toggle('is-right', !headLeft);
        word('orbit-head', head, { at: () => headLeft ? [cvX(24), cvY(22)] : [cvX(SW - 24), cvY(22)], side: 'below', alignLeft: headLeft, alignRight: !headLeft, gap: 0, view: 'orbit', shade: true, fade: { t0: clock.t + 300, inMs: 800, holdMs: 4200, outMs: 1200 } });
        if (pl.datedNote) datedWord(o, pl.datedNote);
        if (!isReturn && od.arrive) after(1500, () => Reading.say(od.arrive[0], od.arrive[1], { anchor: 'orbit-ship' }));
        after(isReturn ? 300 : 1900, () => showActs(pl));
    }
    /** The date written beside a dated wreck's beacon, on whichever side of it is darkest. */
    function datedWord(o, text) { word('orbit-dated', h('p', 'dated', text), { at: () => o.anchors.beacon, sides: ['below', 'left', 'right', 'above'], gap: 7, view: 'orbit', shade: true }); }
    /** The sides to try for words about something on the ground: first the one facing away from the planet. */
    function sidesAway(n) {
        if (!n) return ['right', 'left', 'above', 'below'];
        const out = [];
        if (n[1] < -0.55) out.push('above');
        if (Math.abs(n[0]) > 0.4) out.push(n[0] < 0 ? 'left' : 'right');
        return out.concat(['above', n[0] < 0 ? 'left' : 'right', n[0] < 0 ? 'right' : 'left', 'below']).filter((s, i, a) => a.indexOf(s) === i);
    }
    function showActs(pl) {
        unwordAll('act:');
        const od = orbitData(pl), o = orbitPainting(pl), step = od.steps[pl.step];
        if (step) {
            const target = o.anchors[step.at] || o.anchors.beacon, isClouds = step.at === 'clouds';
            const sky = isClouds ? o.anchors.cloudsSky : o.anchors.sky, n = isClouds ? o.anchors.cloudsN : o.anchors.skyN;
            actWord('act:step', step.verb, step.sub, sky || target, step.at === 'light' ? ['left'] : sidesAway(n), () => doStep(pl, step), step.pulse, step.at === 'station' || step.at === 'light' ? null : target);
        }
        if (pl.kind !== 'light' || !step) actWord('act:leave', 'Leave orbit', null, o.anchors.ship, ['below', 'left', 'right'], leaveOrbit);
    }
    function actWord(key, verb, sub, anchor, sides, onClick, pulse, thread) {
        const b = h('button', 'act' + (pulse ? ' is-pulse' : ''));
        b.type = 'button';
        b.append(h('span', 'verb', verb)); if (sub) b.append(h('span', 'sub', sub));
        b.addEventListener('click', e => { e.stopPropagation(); if (Reading.isOpen() || S.trans) return; S.actHot = null; onClick(); });
        b.addEventListener('pointerenter', () => { S.actHot = key; b.classList.add('is-hot'); });
        b.addEventListener('pointerleave', () => { if (S.actHot === key) S.actHot = null; b.classList.remove('is-hot'); });
        word(key, b, { at: () => anchor, sides, gap: 6, view: 'orbit', shade: true, thread, yields: true });   // it waits while a voice line sits on it
    }
    function doStep(pl, step) {
        unwordAll('act:');
        const o = orbitPainting(pl);
        const note = () => { if (step.record) logRecord(step.record, { story: !!step.story, chips: step.gain && step.gain.energy ? [[`+${step.gain.energy} energy`, 'gain']] : null }); };
        const finish = () => { pl.step++; after(700, () => showActs(pl)); };
        if (step.does === 'team' || step.does === 'board') {
            const to = o.anchors[step.at] || o.anchors.beacon;
            logRecord(step.does === 'board' ? 'One of the crew went aboard on one tank of air.' : `The lander went down with ${step.crew || 'the team'}.`, { routine: true });
            if (step.does === 'team') barkOnce('lander');
            if (step.bark) barkOnce(step.bark);
            S.lander = { t0: clock.t, to, dur: 2000, up: false };
            const backUp = () => new Promise(done => { S.lander = { t0: clock.t, to, dur: 1300, up: true }; after(1400, () => { S.lander = null; done(); }); });
            const home = () => { if (!step.scene) note(); applyGain(step.gain); return afterTeam(step); };
            after(2300, () => {
                if (step.scene) { note(); playFilm(step.scene, () => backUp().then(home).then(finish)); return; }   // what they searched comes before what they chose there
                backUp().then(home).then(finish);
            });
            return;
        }
        if (step.does === 'fuel') { applyGain(step.gain); chips([[`+${step.gain.energy} energy`, 'gain']]); note(); Reading.say(step.then[0], step.then[1], { anchor: 'orbit-ship' }); finish(); return; }
        if (step.does === 'date') { startDating(pl, step, () => { note(); finish(); }); return; }
        if (step.does === 'end') { goIntoTheLight(); }
    }
    /** The team is back: what they say, then what they found (a page goes to the record, and can be read again there). */
    function afterTeam(step) {
        let chain = Promise.resolve();
        if (step.then && !step.page) { Reading.say(step.then[0], step.then[1], { anchor: 'orbit-beacon' }); return chain; }   // nothing to wait for
        if (step.then) chain = chain.then(() => Reading.say(step.then[0], step.then[1], { anchor: 'orbit-beacon' }));
        if (step.page) chain = chain.then(() => {
            logRecord(step.page.record, { story: true, page: step.page.id });
            if (!pagesRead.includes(step.page.id)) pagesRead.push(step.page.id);
            return Reading.showPage(step.page);
        });
        return chain;
    }

    function playFilm(scene, done) {
        transition('orbit', 'black', 600);
        after(600, () => {
            S.view = 'film'; S.film = { scene, t0: clock.t }; showFilmCanvas(true);
            const g = filmGeometry();
            Reading.playScene(scene, { top: { y: g.bandTop.y, h: g.bandTop.h }, bottom: { y: g.bandBottom.y, h: g.bandBottom.h }, first: scenesSeen < 2 }).then(i => {
                scenesSeen++;
                const choice = scene.choices && scene.choices[i];
                S.film = null; showFilmCanvas(false); S.view = 'black';
                transition('black', 'orbit', 800);
                after(800, () => { if (choice) { applyGain(choice.gain); chips(choice.chips); if (choice.record) logRecord(choice.record, { chips: choice.chips }); } done(); });
            });
        });
    }

    // Dating is the real disc game (src/systems/minigames/DiscDating.js), the one the game runs. "Not now" leaves the wreck undated.
    function startDating(pl, step, finish) {
        if (!window.MiniHost || !window.MiniHost.has('disc')) { console.warn('The disc game did not load.'); showActs(pl); return; }
        S.dating = true;                                                                                // the disc game has the keys and clicks while it is open
        window.MiniHost.play('disc', {
            wreck: { hull: 4, sector: 1 }, plotted: [], crew: null,
            reward: { name: 'Rhea-4 Minor', kind: 'beacon', line: { who: 'Mira', text: 'They saw a lamp on that moon and went to help. They never got there.' } },
            names: ['Kryos-68 Prime', 'Chronos-37 Proxima', 'Zephyr-97 X'],
        }).then(result => {
            S.dating = null;
            if (!result || !result.dated) { showActs(pl); return; }
            pl.datedNote = step.dated;
            if (step.reveal) S.pendingReveal = step.reveal;
            Reading.say(step.then[0], step.then[1], { anchor: 'orbit-ship' });
            datedWord(orbitPainting(pl), step.dated);
            finish();
        });
    }

    function leaveOrbit() {
        const pl = S.orbitOf, od = orbitData(pl), waiting = od && od.steps[pl.step];
        if (waiting && waiting.does === 'date') {                                                       // dating is only possible in this orbit: leaving gives it up
            pl.step++;
            logRecord(`Left ${pl.name} without dating the wreck.`);
            if (waiting.reveal) { S.pendingReveal = waiting.reveal; S.revealLate = true; }
        }
        unwordAll('act:'); unword('orbit-head'); unword('orbit-dated');
        Reading.clear();
        transition('orbit', 'sector', 1000, () => {
            showDatedNotes(); showLowSupply();
            if (S.pendingReveal) {
                const story = placeById(S.pendingReveal); S.pendingReveal = null;
                if (story && story.hidden) { story.hidden = false; S.version++; S.reveal = { id: story.id, t0: clock.t + 300 }; logRecord(`The faint contact is ${story.name}. One of our ships is there.`); after(1300, () => { S.reveal = null; setHover({ kind: 'place', id: story.id }); }); }
            }
            const late = S.revealLate; S.revealLate = false;
            after(500, () => Reading.say('A.U.R.A.', late ? 'I have a course to the faint contact now, Commander.' : stopsLine(), { anchor: 'ship' }).then(ok => { if (ok && late) Reading.say('A.U.R.A.', stopsLine(), { anchor: 'ship' }); }));
        });
        S.orbitOf = pl;
    }
    function stopsLine() {
        if (S.n === 6) return S.stops > 0 ? `We can make ${S.stops === 1 ? 'one more stop' : S.stops === 2 ? 'two more stops' : 'three more stops'} before the light, Commander.` : 'Only the light is left, Commander.';
        if (S.stops >= 2) return `We can make ${S.stops === 2 ? 'two' : 'three'} more stops before the jump, Commander.`;
        if (S.stops === 1) return 'We can make one more stop before the jump, Commander.';
        return 'No stops left, Commander. Only the jump is ahead.';
    }

    // ── the light: the jump (sectors 1-5) or the end of the heading (sector 6) ──
    function clickLight() {
        if (S.n === 6) {
            const fake = { id: 'light', kind: 'light', name: 'The light', step: S.lightStep || 0 };
            Reading.say('Aris', 'It looks warm. Nothing out here is warm.', { anchor: 'ship' });
            after(2200, () => { S.lightPlace = fake; enterOrbitLight(fake); });
            return;
        }
        if (S.res.energy < JUMP.energy) { sayOnce('jump-energy', 'Jaxon', "We don't have the energy to jump.", { from: 'from engineering' }); return; }
        if (S.stops > 0) {
            const line = S.stops === 1 ? 'We still have a stop left here, Commander. Jump anyway?' : `We still have ${S.stops === 2 ? 'two' : 'three'} stops left here, Commander. Jump anyway?`;
            Reading.ask('A.U.R.A.', line, [{ verb: 'Jump now', chips: [[`−${JUMP.energy} energy`, 'spend'], [`−${JUMP.rations} rations`, 'spend']] }, { verb: 'Not yet' }], { anchor: 'ship' }).then(i => { if (i === 0) doJump(); });
            return;
        }
        doJump();
    }
    function enterOrbitLight(pl) {
        S.orbitOf = pl; pl.orbit = SECTORS[6].lightOrbit;
        transition('sector', 'orbit', 1000);
        after(500, () => enterOrbitWords(pl, false));
    }
    function doJump() {
        Reading.clear(); showNote(null); setHover(null);
        S.res.energy -= JUMP.energy; S.res.rations = Math.max(0, S.res.rations - JUMP.rations);
        chips([[`−${JUMP.energy} energy`, 'spend'], [`−${JUMP.rations} rations`, 'spend']]);
        S.jump = { phase: 'go', t0: clock.t, x0: S.ship.x, y0: S.ship.y };
        S.view = 'jump';
        unwordAll('dated:'); unword('low');
        after(1100, () => { S.jump.phase = 'stretch'; S.jump.t1 = clock.t; });
        after(1100 + TICK * 6, () => { S.jump.phase = 'black'; });
        after(1100 + TICK * 6 + 40, () => sectorPainting(SECTORS[S.n].next || 5));                 // paint the next sector while the screen is black
        after(1100 + TICK * 6 + 600, () => enterSector(SECTORS[S.n].next || 5, { keepRecord: true }));
    }
    function goIntoTheLight() {
        Reading.clear(); unwordAll();
        S.ending = { t0: clock.t };
        transition('orbit', 'end', 1600);
        after(3200, () => word('end', h('p', 'hint', 'Mockup: the finale starts here. Esc to go back.'), { at: () => [G.W / 2, G.H * 0.8], side: 'center', view: 'end' }));
    }

    // ═══════════════════════════════════════════════════════════════════════════════════════════════════════════
    // 12. THE WORLD API, for the reading layer. The reading layer calls only these; the world calls only Reading.*.
    // ═══════════════════════════════════════════════════════════════════════════════════════════════════════════
    const World = {
        /** CSS pixels per art pixel (the art is drawn at a whole number of device pixels each). */
        get k() { return G.s; },
        now: () => clock.t,
        after, cancel: cancelTimer,
        /** The first place for words at a named anchor (see anchors). */
        anchor(name) { const list = World.anchors(name); return list && list.length ? list[0] : null; },
        /** Every place words may sit for a named anchor, best first, in screen pixels: [{ x, y, side, align? }]. The reading
            layer takes the darkest of them (World.luma), so a line never lands on a gas giant's rim or on a planet.
            'ship' (beside our ship), 'orbit-ship', 'orbit-beacon' (the sky just off the limb above the beacon), 'place:<id>',
            'light', 'center'. side: where the words go from the point; align 'center' centres them on it. */
        anchors(name) {
            if (!S) return null;
            const at = (cx, cy, side, align) => { const [x, y] = toScreen(cx, cy); return { x, y, side, align }; };
            if (name === 'ship' && S.view === 'ship') { const a = ShipView.anchor(); return a ? [at(a[0], a[1], 'below')] : null; }
            if (name === 'ship') {
                // the hull's box as it is turned in flight: the words hang under or over it, never on it
                const ca = Math.abs(Math.cos(S.ship.angle)), sa = Math.abs(Math.sin(S.ship.angle)), halfW = ca * SHIP.len / 2 + sa * SHIP.ht / 2, halfH = sa * SHIP.len / 2 + ca * SHIP.ht / 2;
                const tail = cvX(S.ship.x - halfW) - 8, top = cvY(S.ship.y - halfH) - 10, bottom = cvY(S.ship.y + halfH) + 10;
                const out = [at(tail, bottom, 'below'), at(tail, top, 'above')];
                if (S.ship.x > 300) out.push(at(tail, cvY(S.ship.y), 'left'));
                return out;
            }
            if (name === 'orbit-ship' || name === 'orbit-beacon') {
                if (!S.orbitOf) return [World.anchors('center')[0]];
                const o = orbitPainting(S.orbitOf);
                if (S.orbitOf.kind === 'light') return [at(cvX(28), cvY(282), 'below'), at(cvX(28), cvY(78), 'below')];   // the second clears the name in the corner
                const sh = o.ship, onRight = sh.x - G.ox > SW / 2, hl = sh.len / 2 + 8;
                const besideShip = [at(sh.x + (onRight ? -hl : hl), sh.y - 2, onRight ? 'left' : 'right'), at(sh.x - sh.len / 2, sh.y - sh.ht / 2 - 8, 'above'), at(sh.x - sh.len / 2, sh.y + sh.ht / 2 + 26, 'below')];
                if (name === 'orbit-ship') return besideShip;
                const [sx, sy] = o.anchors.sky || o.anchors.beacon;
                return sidesAway(o.anchors.skyN).map(side => at(sx + (side === 'left' ? -4 : side === 'right' ? 4 : 0), sy + (side === 'above' ? -4 : side === 'below' ? 4 : 0), side, side === 'above' || side === 'below' ? 'center' : null)).concat(besideShip);
            }
            if (name.startsWith('place:')) { const pl = placeById(name.slice(6)); if (!pl) return null; const s = placeSpot(pl); return [at(s.cx, s.cy, sideFor(pl))]; }
            if (name === 'light') { const [lx, ly] = lightPos(); return [at(lx, ly, 'left')]; }
            return [{ x: window.innerWidth / 2, y: window.innerHeight / 2, side: 'center' }];
        },
        /** Darken the picture under words with the dither grain. rect in screen pixels { x, y, w, h, strength? }, or null to remove. */
        shade(key, rect) { setShade('r:' + key, rect); },
        /** Dim the whole picture (0 none .. 1 black), in dither steps. Pages and the record use about 0.7. */
        dim(amount) { if (S) S.dim = clamp01(amount); },
        /** True for the first two scenes, while the "Click or Space" hint should show. */
        isEarly: () => scenesSeen < 2,
        state: () => ({ sector: S.n, title: SECTORS[S.n].title, view: S.view, res: Object.assign({}, S.res), stops: S.stops, record: record.map(g => ({ head: g.head, items: g.items.slice() })), pages: pagesRead.slice() }),
        /** Everything the ship-and-crew view needs: rooms from the nose, who is where, who is hurt, damage, pods, supplies. */
        shipState() {
            const sec = SECTORS[S.n], c = sec.crew;
            const where = { bridge: 'on the bridge', lab: 'in the lab', quarters: 'in the quarters', hold: 'in the hold', engineering: 'in engineering' };
            return {
                sector: S.n, rooms: ROOMS.slice(), damaged: Object.assign({}, c.damaged), hurt: Object.assign({}, c.hurt), pods: c.pods, res: Object.assign({}, S.res), stops: S.stops,
                foodForJumps: Math.floor(S.res.rations / JUMP.rations),
                crew: CREW.map(m => ({ id: m.id, name: m.name, room: c.at[m.id], hurt: !!c.hurt[m.id], label: `${m.name} · ${c.hurt[m.id] ? 'hurt' : (m.id === 'aris' && c.hurt.vance ? 'with Vance' : where[c.at[m.id]])}` })),
            };
        },
        pages: { plate: PAGE_PLATE, disc: PAGE_DISC },
        /** The picture recipe, for the ship view and the pictures of pages (same ramps, same dither, same hull). */
        art: { INK, TICK, RP, BAYER_RAW, threshold, level, hash, vnoise, fbm, seeded, clamp01, smooth, lerp, ramp, hexRgb, painter, framer, drawHull, hullEdges, pattern, dimWith, darken, glyphText: pixelText, glyphWidth: pixelTextWidth },
        geom: () => ({ k: G.k, s: G.s, dpr: G.dpr, W: G.W, H: G.H, ox: G.ox, oy: G.oy, left: G.left, top: G.top }),
        view: () => (S ? S.view : null),
        /** How busy the picture is under a screen rect, read from the cached paintings (no canvas read-back): the mean
            brightness plus a share of the pixels that are bright, so a thin gold rim under the words counts, not only a big glow. */
        luma(rect) {
            if (!S) return 0;
            const P = (S.view === 'sector' || S.view === 'jump') ? sectorPainting(S.n) : null, O = S.view === 'orbit' && S.orbitOf ? orbitPainting(S.orbitOf) : null;
            const data = P ? P.baseData : O ? O.data : null, over = P && placesCache ? placesCache.data : null;
            if (!data) return 0;
            const [x0, y0] = toCanvas(rect.x, rect.y), [x1, y1] = toCanvas(rect.x + rect.w, rect.y + rect.h);
            let sum = 0, bright = 0, onPlace = 0, n = 0;
            for (let y = Math.max(0, Math.floor(y0)); y < Math.min(G.H, Math.ceil(y1)); y += 2) for (let x = Math.max(0, Math.floor(x0)); x < Math.min(G.W, Math.ceil(x1)); x += 2) {
                const o = (y * G.W + x) * 4, isPlace = over && over[o + 3], src = isPlace ? over : data, l = (0.2126 * src[o] + 0.7152 * src[o + 1] + 0.0722 * src[o + 2]) / 255;
                sum += l; if (l > 0.16) bright++; if (isPlace) onPlace++; n++;
            }
            return n ? sum / n + 0.6 * bright / n + 0.8 * onPlace / n : 0;                           // words on a world hide it, however dim it is
        },
        /** Words that belong to the world, placed every frame from a canvas anchor (keys are kept apart from the world's own). */
        word: (key, el, opts) => word('x:' + key, el, opts),
        unwordAll: prefix => unwordAll('x:' + (prefix || '')),
        sectorBase: () => (S ? sectorPainting(S.n) : null),
        openShip, closeShip,
        openRecord: () => Reading.openRecord(),
    };
    window.World = World;

    // ═══════════════════════════════════════════════════════════════════════════════════════════════════════════
    // 12b. The ship and the crew: the hull cut open (game-screen/shipview.js), a view of its own with a dissolve both ways.
    // ═══════════════════════════════════════════════════════════════════════════════════════════════════════════
    const ShipView = window.GameShipView.create(World);
    VIEWS.ship = (c, t) => ShipView.draw(c, t);
    function openShip() {
        if (!S || S.view !== 'sector' || S.trans || S.jump || S.intro) return;
        setHover(null); showNote(null);
        ShipView.open(clock.t);
        transition('sector', 'ship', 600);
    }
    function closeShip() {
        if (!S || S.view !== 'ship' || S.trans) return;
        ShipView.close();
        stage.classList.remove('is-pointing');
        transition('ship', 'sector', 600, () => showLowSupply());
    }

    // ═══════════════════════════════════════════════════════════════════════════════════════════════════════════
    // 13. The reading layer (game-screen/reading.js): voices in the scene, scenes as film, found pages, the ship's record.
    //     The world calls only Reading.*; the reading layer calls only World.*.
    // ═══════════════════════════════════════════════════════════════════════════════════════════════════════════
    const Reading = window.GameReading.create(World);
    window.Reading = Reading;

    // ═══════════════════════════════════════════════════════════════════════════════════════════════════════════
    // 14. Input, the Esc menu, the mockup control, deep links, the loop.
    // ═══════════════════════════════════════════════════════════════════════════════════════════════════════════
    const stage = $('stage'), menu = $('menu');
    const menuOpen = () => !menu.hidden;
    function openMenu(on) { menu.hidden = !on; if (S) S.dim = on ? 0.65 : 0; if (on) menu.querySelector('button').focus({ preventScroll: true }); }
    stage.addEventListener('pointermove', e => {
        if (!S || menuOpen() || Reading.isOpen() || S.trans) return;
        const [cx, cy] = toCanvas(e.clientX, e.clientY);
        if (S.view === 'ship') { stage.classList.toggle('is-pointing', ShipView.hover(cx, cy)); return; }
        if (S.view !== 'sector') { if (S.hover) setHover(null); return; }
        setHover(pick(cx, cy));
    });
    stage.addEventListener('pointerleave', () => { if (S && S.view === 'sector') setHover(null); if (S && S.view === 'ship') ShipView.hover(-99, -99); });
    stage.addEventListener('click', e => {
        if (!S || S.dating || menuOpen()) return;
        if (Reading.isOpen()) { Reading.advance(); return; }
        if (S.trans) return;
        if (S.view === 'ship') {                                                                     // the ship cut open: the logbook, a person, or outside to close
            const [cx, cy] = toCanvas(e.clientX, e.clientY), where = ShipView.click(cx, cy);
            if (where === 'record') Reading.openRecord(); else if (where === 'outside') closeShip(); else Reading.advance();
            return;
        }
        if (S.view === 'orbit') { Reading.advance(); return; }
        if (S.view === 'end') return;
        if (S.view !== 'sector' || S.intro) return;
        if (S.course) { if (S.course.phase === 'lock') cancelCourse(); else hurry(); return; }
        const [cx, cy] = toCanvas(e.clientX, e.clientY), target = pick(cx, cy);
        if (!target) { Reading.advance(); return; }
        if (target.kind === 'place') choosePlace(placeById(target.id));
        else if (target.kind === 'light') clickLight();
        else if (target.kind === 'ship') Reading.openShip();
    });
    menu.addEventListener('click', e => {
        const b = e.target.closest('button'); if (!b) { openMenu(false); return; }
        const what = b.dataset.menu;
        if (what === 'resume') openMenu(false);
        if (what === 'record') { openMenu(false); Reading.openRecord(); }
        if (what === 'sound') b.textContent = 'Sound · off in the mockup';
        if (what === 'save') b.textContent = 'Saved';
        if (what === 'quit') b.textContent = 'Quit · not in the mockup';
    });
    document.addEventListener('keydown', e => {
        if (!S || S.dating) return;
        if (e.key === '`') { e.preventDefault(); toggleMoments(); return; }
        if (menuOpen()) { if (e.key === 'Escape') { e.preventDefault(); openMenu(false); } return; }
        if (Reading.onKey(e)) { e.preventDefault(); return; }
        if (e.key === 'Escape') {
            e.preventDefault();
            if (!$('moments').hidden) { toggleMoments(false); return; }
            if (S.view === 'end') { enterSector(6, { quiet: true, keepRecord: true }); return; }
            if (cancelCourse()) return;
            if (S.view === 'ship') { closeShip(); return; }
            openMenu(true); return;
        }
        if (e.key === ' ' || e.key === 'Enter') {
            e.preventDefault();
            if (hurry()) return;
            if (Reading.advance()) return;
            if (e.key === 'Enter' && S.hover && S.view === 'sector' && !S.course) { if (S.hover.kind === 'place') choosePlace(placeById(S.hover.id)); else if (S.hover.kind === 'light') clickLight(); }
            return;
        }
        if (e.key === 'Tab') {
            e.preventDefault();
            if (S.view !== 'sector' || S.course) return;
            const list = placesAhead().filter(p => !p.hidden && answers(p)).concat([{ id: '__light' }]);
            S.tab = (S.tab + (e.shiftKey ? list.length - 1 : 1)) % list.length;
            const it = list[S.tab]; setHover(it.id === '__light' ? { kind: 'light' } : { kind: 'place', id: it.id });
            return;
        }
        if (e.key === 'Alt') { e.preventDefault(); if (S.view === 'sector' && !S.flags.altNames) { S.flags.altNames = true; showNames(0); } return; }
        if (e.key === 'e' || e.key === 'E') { if (S.view === 'sector') Reading.openShip(); else if (S.view === 'ship') closeShip(); return; }
        if (e.key === 'l' || e.key === 'L') { Reading.openRecord(); return; }
        if (/^[1-6]$/.test(e.key)) { moment('s' + e.key); }
    });
    document.addEventListener('keyup', e => { if (e.key === 'Alt' && S && S.flags.altNames) { S.flags.altNames = false; unwordAll('name:'); } });
    window.addEventListener('blur', () => { if (S && S.flags.altNames) { S.flags.altNames = false; unwordAll('name:'); } });

    // ── the mockup's moments: deep links (#s1, #orbit, …) and the small list behind the MOCKUP corner ──
    const MOMENTS = [
        ['s1', 'Sector 1 arrives'], ['orbit', 'Orbit over Titan-61 IV'], ['scene', 'The team, as film'], ['date', 'Dating the wreck'], ['plate', 'A found page: the crew plate'],
        ['disc', 'A found page: the drawing'], ['ship', 'The ship and the crew · sector 5'], ['ship1', 'The ship and the crew · sector 1'], ['record', "The ship's record"], ['jump', 'The jump'], ['s5', 'Sector 5 · The Tally'], ['s6', 'Sector 6 · The Light'],
        ['s2', 'Sector 2 · painting only'], ['s3', 'Sector 3 · painting only'], ['s4', 'Sector 4 · painting only'],
    ];
    function moment(name) {
        openMenu(false); toggleMoments(false);
        const titan = () => placeById('titan');
        const toOrbit = (pl) => { S.at = pl.id; S.restAfter = dockFor(pl); settleShipAt(pl); S.orbitOf = pl; S.view = 'orbit'; S.intro = null; enterOrbitWords(pl, true); };
        if (/^s[1-6]$/.test(name)) { if (name === 's1') { record.length = 0; pagesRead.length = 0; barked.clear(); } enterSector(+name.slice(1), { keepRecord: name !== 's5' }); return; }
        if (name === 'orbit' || name === 'scene' || name === 'date' || name === 'plate' || name === 'jump' || name === 'disc') {
            record.length = 0; pagesRead.length = 0; barked.clear();
            enterSector(1, { quiet: true });
            S.flags.hintGone = true; S.stops = 2; S.res.energy = 95;
            if (name === 'orbit') { toOrbit(titan()); return; }
            if (name === 'scene') { toOrbit(titan()); after(400, () => doStep(titan(), titan().orbit.steps[0])); return; }
            if (name === 'disc') {                                                                        // straight to the page the team brings back
                const t = titan(); S.res.salvage = 80; logRecord('The team searched EXODUS-4. Nobody alive.'); toOrbit(t); unwordAll('act:');
                after(500, () => afterTeam({ page: PAGE_DISC }).then(() => { t.step = 1; after(700, () => showActs(t)); }));
                return;
            }
            if (name === 'date') { const t = titan(); t.step = 1; S.res.salvage = 80; logRecord('The team searched EXODUS-4. Nobody alive.'); toOrbit(t); return; }
            const t = titan(); t.step = 2; t.datedNote = 'Hull 4 · 21 years dead'; S.res.salvage = 80; logRecord('The team searched EXODUS-4. Nobody alive.'); logRecord('Dated hull 4: twenty-one years dead.');
            const rhea = placeById('rhea'); rhea.hidden = false;
            if (name === 'plate') { S.stops = 1; toOrbit(rhea); after(300, () => doStep(rhea, rhea.orbit.steps[0])); return; }
            S.stops = 1; S.at = 'titan'; S.restAfter = dockFor(t); settleShipAt(t); showDatedNotes();
            after(200, () => { setHover({ kind: 'light' }); after(900, clickLight); });
            return;
        }
        if (name === 'ship' || name === 'ship1') { if (name === 'ship1') { record.length = 0; pagesRead.length = 0; barked.clear(); } enterSector(name === 'ship' ? 5 : 1, { quiet: true }); after(100, () => Reading.openShip()); return; }
        if (name === 'record') { enterSector(5, { quiet: true }); after(100, () => Reading.openRecord()); return; }
        enterSector(1);
    }
    function toggleMoments(force) {
        const box = $('moments'), on = force == null ? box.hidden : force;
        box.hidden = !on; $('mockup-btn').setAttribute('aria-expanded', String(on));
    }
    MOMENTS.forEach(([key, label]) => { const b = h('button', null, `#${key}  ${label}`); b.type = 'button'; b.addEventListener('click', e => { e.stopPropagation(); history.replaceState(null, '', '#' + key); moment(key); }); $('moments').appendChild(b); });
    $('mockup-btn').addEventListener('click', e => { e.stopPropagation(); toggleMoments(); });
    window.addEventListener('hashchange', () => { moment(location.hash.slice(1) || 's1'); render(); });

    // ── sizing ──
    let resizeTimer = 0;
    window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { measure(); placesCache = null; if (S && S.view === 'ship') ShipView.relayout(); remeasureWords(); Reading.relayout(); if (S && S.film) showFilmCanvas(true); render(); }, 140); });
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { remeasureWords(); Reading.relayout(); });

    // ── the loop: our own clock, advanced by animation frames; window.step(ms) moves it by hand (for a hidden pane) ──
    let lastReal = null, lastRender = 0;
    function frame(now) {
        if (clock.frozen) return;
        if (lastReal != null) advance(Math.min(100, now - lastReal));
        lastReal = now; lastRender = now;
        render();
    }
    function loop(now) { frame(now); requestAnimationFrame(loop); }
    /** Moves our clock on by hand in 16 ms steps, letting promise callbacks run between steps as they would between frames. Resolves to the time. */
    window.step = async ms => { let left = Math.max(0, +ms || 0); while (left > 0) { const d = Math.min(16, left); advance(d); left -= d; await Promise.resolve(); await Promise.resolve(); } render(); return Math.round(clock.t); };
    window.moment = moment;
    // mockup debug only: retune a painting live (window.__dev.GIANT.open = 0.3; __dev.repaint()) and judge it at real size
    window.__dev = { GIANT, ORBIT_AT, get S() { return S; }, repaint() { paintings.clear(); orbits.clear(); placesCache = null; render(); return 'repainted'; }, lens(x, y, s) { const b = document.body; if (!s) { b.style.transform = ''; return 'off'; } b.style.transformOrigin = '0 0'; b.style.transform = `scale(${s}) translate(${-x}px, ${-y}px)`; return 'on'; } };
    window.freeze = on => { clock.frozen = on !== false; lastReal = null; return clock.frozen; };   // mockup debug: stop real time so step() alone drives it
    window.frameCost = n => { const out = []; for (let i = 0; i < (n || 60); i++) { const a = performance.now(); advance(16); render(); out.push(performance.now() - a); } out.sort((a, b) => a - b); return { median: +out[out.length >> 1].toFixed(2), p95: +out[Math.floor(out.length * 0.95)].toFixed(2), max: +out[out.length - 1].toFixed(2) }; };

    measure();
    const params = new URLSearchParams(location.search), stillAt = params.has('t') ? Math.max(0, +params.get('t') || 0) : null;
    moment(location.hash.slice(1) || 's1');
    if (stillAt != null) { clock.frozen = true; window.step(stillAt).then(() => { document.body.dataset.still = 'ready'; }); }
    else {
        render();
        requestAnimationFrame(loop);
        setInterval(() => { const now = performance.now(); if (!clock.frozen && now - lastRender > 400) { advance(Math.min(250, lastReal == null ? 125 : now - lastReal)); lastReal = now; lastRender = now; render(); } }, 250);
    }
})();
</script>
</body>
</html>
