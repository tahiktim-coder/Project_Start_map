<!doctype html>
<!--
  LAYOUT VARIANT D · "The bridge" · a study page; nothing in the game is changed.
  The screen is the bridge of the Lander, cut open like the living ship: the crew at their stations in front, and most of
  the back wall one big window through which the journey plays (game-screen-v3's travel view: worlds come out of the
  light, grow, slide past). Click a world to stop there; click a person for one line; the ladder leads down to the lab.
  Reuses, by loading them: crew-hires/engine.js and the five person files, ship-art.js and ship-rooms.js (the lab deck),
  game-screen-v3/paint.js and data.js. Its own files are in variant-d/.
  Stills: ?t=ms opens paused at that time; ?stop=ms clicks the world in reach at that time; ?say=id; ?deck=lab; ?hover=id.
  Console: window.bridge.pause() / play() / step(ms) / setTime(ms) / stop(ms) / say(id) / go('lab') / stats()
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Bridge</title>
<meta name="description" content="Silent Exodus layout study D: the bridge of the Lander, the crew at their stations, and the journey playing through one big window.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
    color-scheme: dark;
    --ink: #05070a; --text: #e4e4e0; --dim: #8b8d90; --faint: #5a6168; --ui: #c9d1d6;
    --f-ui: 'IBM Plex Sans Condensed', 'Arial Narrow', sans-serif;
    --f-text: 'IBM Plex Sans', system-ui, sans-serif;
    --fast: 180ms; --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
    --k: 3;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--ink); }
body { color: var(--text); font: 15px/1.45 var(--f-text); -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none; }
#view { position: fixed; display: block; image-rendering: pixelated; image-rendering: crisp-edges; cursor: default; touch-action: manipulation; }
#view.is-pointing { cursor: pointer; }

/* a line someone says, over their head (the living ship's speech, unchanged); A.U.R.A.'s hangs left of its grille */
.say { position: fixed; z-index: 2; width: max-content; max-width: 320px; padding: 7px 11px 8px; background: rgba(5, 7, 10, 0.82); border-left: 2px solid var(--who, #c9d1d6);
       pointer-events: none; opacity: 0; transform: translate(-50%, calc(-100% + 4px)); transition: opacity var(--fast) var(--ease), transform var(--fast) var(--ease); }
.say.on { opacity: 1; transform: translate(-50%, -100%); }
.say.is-aura { transform: translate(-100%, 4px); border-left: 0; border-right: 2px solid var(--who); text-align: right; max-width: 290px; }
.say.is-aura.on { transform: translate(-100%, 0); }
.say b { display: block; font: 600 11px/1.2 var(--f-ui); letter-spacing: 0.14em; text-transform: uppercase; color: var(--who, #c9d1d6); margin-bottom: 2px; }
.say span { font-size: 16px; line-height: 1.4; color: #eceae2; }
.say::after { content: ''; position: absolute; left: calc(50% - 5px); bottom: -6px; border: 5px solid transparent; border-bottom: 0; border-top-color: rgba(5, 7, 10, 0.82); }
.say.is-aura::after { display: none; }

/* a world's name, beside it in the glass (v3's tag words) */
.note { position: fixed; z-index: 1; display: grid; gap: 2px; pointer-events: none; white-space: nowrap; text-shadow: 0 1px 0 #05070a, 0 0 6px #05070a;
        opacity: 0; transition: opacity var(--fast) var(--ease); }
.note.on { opacity: 1; }
.note.is-left { transform: translateX(-100%); text-align: right; justify-items: end; }
.note .n { font: 600 15px/1.1 var(--f-ui); letter-spacing: 0.1em; text-transform: uppercase; color: #cfd2d0; }
.note .g { font: 400 15px/1.3 var(--f-text); color: var(--dim); }
.note .c { font: 500 13px/1.3 var(--f-ui); letter-spacing: 0.06em; color: #ffc27a; }
@media (prefers-reduced-motion: reduce) { .say, .note { transition: none; } }
</style>
</head>
<body>
<canvas id="view" aria-label="The bridge of the Lander: the crew at their stations, and a big window onto the light ahead"></canvas>
<div class="say" id="say" role="status" aria-live="polite"><b></b><span></span></div>
<div class="note" id="note" aria-hidden="true"><span class="n"></span><span class="g"></span><span class="c"></span></div>

<script src="../crew-hires/engine.js"></script>
<script src="../crew-hires/cora.js"></script>
<script src="../crew-hires/jaxon.js"></script>
<script src="../crew-hires/aris.js"></script>
<script src="../crew-hires/vance.js"></script>
<script src="../crew-hires/mira.js"></script>
<script src="../crew-hires/ship-art.js"></script>
<script src="../crew-hires/ship-rooms.js"></script>
<script src="../game-screen-v3/paint.js"></script>
<script src="../game-screen-v3/data.js"></script>
<script src="variant-d/bridge-art.js"></script>
<script src="variant-d/journey.js"></script>
<script src="variant-d/crew-sim.js"></script>
<script src="variant-d/main.js"></script>
</body>
</html>
