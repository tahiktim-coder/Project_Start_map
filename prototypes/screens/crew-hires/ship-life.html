<!doctype html>
<!--
  THE LIVING SHIP · a study page; nothing in the game is changed. Five people living in the Lander, cut open.
  Files: engine.js + the five person files (the crew), ship-art.js + ship-rooms.js (the ship), ship-sim.js (routines,
  story states, lines), this page (camera, moving layer, clicks).
  Scale: one art pixel is floor(device height / 432) device pixels, at least 2: the largest whole scale that still shows
  two decks (2 × 208 + 16 rows). A maximized 1080p browser (about 950 device rows) gets 2, a 1920 × 1080 window at 125 %
  (1350 device rows) gets 3; both show two decks. Below 432 art rows (a 1280 × 720 window) one deck is framed.
  ?px=N forces N device pixels per art pixel.
  DEBUG (a hidden browser pane can pause requestAnimationFrame):
    window.shipLife.pause() / play() / step(ms) / setTime(ms) / setState(id) / go(deck) / cam(y) / say(id) / stats()
    URL: ?t=ms opens paused at that time · ?state=normal|vance|hurt|death|sleepers · ?deck=n frames decks n and n+1
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Living Ship</title>
<meta name="description" content="Silent Exodus study: the Lander cut open as a tower of six decks, with the five crew living in it. Scroll or click a deck to move; click someone to hear them.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
    color-scheme: dark;
    --ink: #05070a; --void: #0a0a0b; --line: #2a2d33; --text: #e4e4e0; --dim: #8b8d90; --faint: #5a6168; --ui: #c9d1d6;
    --f-ui: 'IBM Plex Sans Condensed', 'Arial Narrow', sans-serif;
    --f-text: 'IBM Plex Sans', system-ui, sans-serif;
    --fast: 160ms; --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--ink); }
body { color: var(--text); font: 15px/1.45 var(--f-text); -webkit-font-smoothing: antialiased; }
#view { position: fixed; left: 0; top: 0; display: block; image-rendering: pixelated; image-rendering: crisp-edges; cursor: default; touch-action: none; }
#view.over-person { cursor: pointer; }

/* a line someone says, in the scene, over their head */
.say { position: fixed; z-index: 2; max-width: 300px; padding: 7px 11px 8px; background: rgba(5, 7, 10, 0.82); border-left: 2px solid var(--who, #c9d1d6);
       pointer-events: none; opacity: 0; transform: translate(-50%, calc(-100% + 4px)); transition: opacity var(--fast) var(--ease), transform var(--fast) var(--ease); }
.say.on { opacity: 1; transform: translate(-50%, -100%); }
.say b { display: block; font: 600 11px/1.2 var(--f-ui); letter-spacing: 0.14em; text-transform: uppercase; color: var(--who, #c9d1d6); margin-bottom: 2px; }
.say span { font-size: 15px; line-height: 1.4; color: #eceae2; }
.say::after { content: ''; position: absolute; left: calc(50% - 5px); bottom: -6px; border: 5px solid transparent; border-bottom: 0; border-top-color: rgba(5, 7, 10, 0.82); }

/* the study control: plainly marked, out of the way */
.study { position: fixed; left: 16px; bottom: 16px; z-index: 3; max-width: min(400px, calc(100vw - 32px)); padding: 9px 10px 10px; background: rgba(10, 10, 11, 0.86);
         border: 1px solid var(--line); opacity: 0.55; transition: opacity var(--fast) var(--ease); }
.study:hover, .study:focus-within { opacity: 1; }
.study .tag { margin: 0 0 8px; font: 600 10.5px/1 var(--f-ui); letter-spacing: 0.16em; text-transform: uppercase; color: var(--faint); }
.study .tag em { font-style: normal; color: #ffc27a; }
.study .seg { display: flex; flex-wrap: wrap; gap: 4px; }
.study button { padding: 5px 8px; border: 1px solid var(--line); background: none; cursor: pointer; font: 500 12px/1 var(--f-ui); letter-spacing: 0.03em; color: var(--dim);
                transition: color var(--fast) var(--ease), background var(--fast) var(--ease), border-color var(--fast) var(--ease); }
.study button:hover { color: var(--text); border-color: #44484f; }
.study button:active { background: #1a1c20; }
.study button[aria-pressed="true"] { color: var(--ink); background: var(--ui); border-color: var(--ui); }
.study button:focus-visible { outline: 1px solid #fff; outline-offset: 2px; }
.study .hint { margin: 7px 0 0; font-size: 11.5px; color: var(--faint); }
@media (prefers-reduced-motion: reduce) { .say, .study, .study button { transition: none; } }
</style>
</head>
<body>
<canvas id="view" aria-label="The ship cut open: six decks stacked like the floors of a tower, with the crew living in them"></canvas>
<div class="say" id="say" role="status" aria-live="polite"><b></b><span></span></div>
<aside class="study" aria-label="Study control">
    <p class="tag">Study control · <em>not part of the game</em></p>
    <div class="seg" id="states" role="group" aria-label="Story state"></div>
    <p class="hint">Scroll, or click a deck, to move. Click someone to hear them.</p>
</aside>

<script src="engine.js"></script>
<script src="cora.js"></script>
<script src="jaxon.js"></script>
<script src="aris.js"></script>
<script src="vance.js"></script>
<script src="mira.js"></script>
<script src="ship-art.js"></script>
<script src="ship-rooms.js"></script>
<script src="ship-sim.js"></script>
<script>
'use strict';
(() => {
    const CE = window.CrewEngine, A = window.ShipArt, SIM = window.ShipSim, L = A.L, R = A.R, lv = A.api.level;
    const ORDER = ['cora', 'jaxon', 'aris', 'vance', 'mira'], SEED = id => ORDER.indexOf(id) + 1;
    const COLOR = { cora: '#9fd8e6', jaxon: '#f0a860', aris: '#e58ac8', vance: '#d8dde0', mira: '#e2c46a' };
    const TICK = 125, PAIR_ROWS = 2 * L.PITCH + 16;                         // art rows two decks need, with a little margin

    // ── the screen: whole device pixels per art pixel ───────────────────────────────────────────────────────────
    const view = document.getElementById('view'), vctx = view.getContext('2d');
    const art = document.createElement('canvas'), ctx = art.getContext('2d');
    const q = new URLSearchParams(location.search);
    const S = { t: 0, playing: true, last: null, state: 'normal', camY: 0, camT: 0, k: 2, dpr: 1, W: 0, H: 0, offX: 0, speech: null, drawn: [], frames: [] };
    function resize() {
        S.dpr = window.devicePixelRatio || 1;
        const devW = Math.round(innerWidth * S.dpr), devH = Math.round(innerHeight * S.dpr);
        S.k = Number(q.get('px')) > 0 ? Math.round(Number(q.get('px'))) : Math.max(2, Math.floor(devH / PAIR_ROWS));   // the biggest k that still shows two decks
        S.W = Math.ceil(devW / S.k); S.H = Math.ceil(devH / S.k);
        art.width = S.W; art.height = S.H;
        view.width = S.W * S.k; view.height = S.H * S.k;
        view.style.width = (S.W * S.k / S.dpr) + 'px'; view.style.height = (S.H * S.k / S.dpr) + 'px';
        S.offX = Math.round(S.W / 2 - L.CX);
        S.camT = clampCam(S.camT); S.camY = S.camT;
        render();
    }
    const clampCam = y => (S.H >= L.H ? (L.H - S.H) / 2 : Math.max(0, Math.min(L.H - S.H, y)));

    // ── camera: two decks at a time when they fit, one centred when they do not ─────────────────────────────────
    const pairMode = () => S.H >= PAIR_ROWS;
    function frame(d) {
        d = Math.max(0, Math.min(L.N - 1, d));
        if (pairMode()) { d = Math.min(d, L.N - 2); S.camT = clampCam(A.deckTop(d) + L.PITCH - S.H / 2 + 6); }
        else S.camT = clampCam(A.deckTop(d) + L.PITCH / 2 - S.H / 2 + 8);
    }
    const deckAt = wy => Math.floor((wy - L.TOP0) / L.PITCH);
    function clickDeck(wy) {
        const d = deckAt(wy);
        if (d < 0) return frame(0);
        if (d >= L.N) return frame(L.N - 2);
        if (!pairMode()) return frame(d);
        const top = A.deckTop(d), seen = top >= S.camT - 2 && top + L.PITCH <= S.camT + S.H + 2;
        if (seen) return;
        frame(wy < S.camT + S.H / 2 ? d : d - 1);
    }
    function stepDeck(dir) {
        const c = S.camT + S.H / 2;
        if (pairMode()) frame(Math.round((c - L.TOP0) / L.PITCH) - 1 + dir);
        else frame(deckAt(c) + dir);
    }

    // ── light on people: warmth by distance to the nearest lit lamp on their deck; dim where the lamps are off ─────
    const looks = st => SIM.stateOf(st).looks;
    const deckOf = (i, st) => A.deck(i, looks(st)[i] || {});
    function lampLight(p) { return lightFor(p, S.state); }
    function lightFor(p, stateId) {
        const lamps = deckOf(p.deck, stateId).lamps;
        if (!lamps.length) return { warm: 0, rim: 0, dim: true };
        const near = lamps.reduce((a, b) => (Math.abs(b.x - p.x) < Math.abs(a.x - p.x) ? b : a)), d = near.x - p.x;
        return { warm: Math.round(3 * Math.exp(-Math.abs(d) / 55)), rim: Math.abs(d) > 6 && Math.abs(d) < 120 ? Math.sign(d) : 0, dim: false };
    }
    const dimmed = new WeakMap();
    function dimOf(cv) {
        if (dimmed.has(cv)) return dimmed.get(cv);
        const c = document.createElement('canvas'); c.width = cv.width; c.height = cv.height;
        const x = c.getContext('2d'); x.drawImage(cv, 0, 0);
        const im = x.getImageData(0, 0, c.width, c.height), d = im.data;
        for (let i = 0; i < d.length; i += 4) { d[i] = d[i] * 0.5 + 8; d[i + 1] *= 0.42; d[i + 2] *= 0.44; }
        x.putImageData(im, 0, 0); dimmed.set(cv, c); return c;
    }
    // the blanket over a sleeper follows the top of the body, so it rises when they breathe (crew.html's recipe)
    const blankets = new Map();
    function blanketOf(Sp, sheet) {
        const key = Sp.canvas, cache = blankets.get(key) || {};
        if (cache[sheet]) return cache[sheet];
        const d = Sp.canvas.getContext('2d').getImageData(0, 0, Sp.w, Sp.h).data, tops = new Int16Array(Sp.w).fill(-1);
        for (let x = 0; x < Sp.w; x++) for (let y = 0; y < Sp.h; y++) if (d[(y * Sp.w + x) * 4 + 3]) { tops[x] = y; break; }
        const c = document.createElement('canvas'); c.width = Sp.w; c.height = Sp.h;
        const x2 = c.getContext('2d'), Rm = sheet ? R.LINEN : R.WOOL, x0 = Sp.origin.x - 16;
        for (let col = x0; col < Sp.w; col++) {
            const top = tops[col], y0 = top < 0 ? Sp.origin.y - 3 : Math.max(0, top - 1);
            for (let y = y0; y < Sp.origin.y; y++) {
                const v = (y === y0 ? 0.72 : 0.42 - (y - y0) * 0.03) + (col === x0 ? -0.15 : 0) + ((col + y) % 5 === 0 ? -0.06 : 0) - (sheet ? 0.1 : 0);
                x2.fillStyle = Rm.hex[lv(Rm, v, col, y)]; x2.fillRect(col, y, 1, 1);
            }
        }
        cache[sheet] = c; blankets.set(key, cache); return c;
    }
    function blit(cv, Sp, x, y, facing) {
        const X = Math.round(x) + S.offX, Y = Math.round(y) - Math.round(S.camY) - Sp.origin.y;
        if (facing > 0) ctx.drawImage(cv, X - Sp.origin.x, Y);
        else { ctx.save(); ctx.translate(X + 1, 0); ctx.scale(-1, 1); ctx.drawImage(cv, -Sp.origin.x, Y); ctx.restore(); }
    }
    const blinking = (ms, seed) => ((ms + seed * 1700) % 4300) < 140;
    function spriteOf(p, ll) {
        const ms = p.act === 'idle' || p.act === 'sit' || p.act === 'console' || p.act === 'wall' || p.act === 'tend' || p.act === 'sleep' ? p.ms + SEED(p.id) * 977 : p.ms;
        return CE.sprite(p.id, p.act, CE.frameAt(p.act, ms), { blink: p.act !== 'sleep' && blinking(ms, SEED(p.id)), warm: ll.warm, rim: ll.rim * p.facing, screen: p.screen === undefined ? p.act === 'console' : p.screen });
    }
    function drawPerson(p) {
        const ll = lampLight(p), Sp = spriteOf(p, ll);
        blit(ll.dim ? dimOf(Sp.canvas) : Sp.canvas, Sp, p.x, p.y, p.facing);
        if (p.act === 'sleep') blit(blanketOf(Sp, !!p.awake), Sp, p.x, p.y, p.facing);
        S.drawn.push({ id: p.id, Sp, x: p.x, y: p.y, facing: p.facing, act: p.act, say: p.say });
    }

    // ── the moving layer: a few pixels a tick (eight a second), like the scene cards ──────────────────────────────
    let curFill = '';
    const px = (x, y, hex, w = 1, h = 1) => { if (hex !== curFill) { ctx.fillStyle = hex; curFill = hex; } ctx.fillRect(x, y, w, h); };
    const tone = (x, y, r, v) => { const k = lv(r, v, x, y); if (k > 0) px(x, y, r.hex[k]); };
    const h01 = (a, b, s = 0) => A.api.hash(a & 255, b & 255, s);
    function screenFx(f, X, Y, tick, t) {
        const w = f.w, h = f.h;
        if (f.tone === 'text' || f.tone === 'helm') {
            for (let r = 1; r < h; r += 2) { const n = Math.floor(h01(r, tick >> 2, 3) * (w - 1)); for (let c = 0; c < n; c++) if (h01(c, r + tick, 5) > 0.3) px(X + c, Y + r, R.SCR.hex[(c + r) % 4 ? 2 : 3]); }
            if ((tick >> 2) & 1) px(X + 1, Y + h - 2, R.SCR.hex[5]);
            if (f.tone === 'helm') { const m = Math.round((Math.sin(t / 1300) * 0.5 + 0.5) * (w - 2)); px(X + m, Y + 1, R.AMBER.hex[3], 2, 1); }
        } else if (f.tone === 'chart') {
            for (let i = 0; i < 18; i++) px(X + Math.floor(h01(i, 1, 9) * w), Y + Math.floor(h01(i, 2, 9) * h), R.SCR.hex[h01(i, 3, 9) > 0.7 ? 5 : 3]);
            const sx = tick % (w + 6); if (sx < w) for (let y = 0; y < h; y++) px(X + sx, Y + y, R.SCR.hex[2]);
            px(X + Math.round(w * 0.62), Y + Math.round(h * 0.4), R.AMBER.hex[(tick >> 1) & 1 ? 4 : 2]);
        } else if (f.tone === 'spectrum') {
            for (let c = 0; c < w; c++) { const peak = Math.exp(-((c - w * 0.65) ** 2) / 4), v = 0.15 + 0.25 * h01(c, tick >> 1, 4) + peak * 0.7; const bh = Math.round(v * (h - 2)); for (let y = 0; y < bh; y++) px(X + c, Y + h - 1 - y, R.SCR.hex[y > bh - 2 ? 5 : 3]); }
        } else if (f.tone === 'ecg' || f.tone === 'vitals') {
            const sweep = (tick * 2) % w, mid = Math.round(h * 0.55);
            for (let c = 0; c < w; c++) {
                const ph = ((c - sweep + w * 4) % 22), spike = f.tone === 'ecg' ? (ph === 3 ? -6 : ph === 4 ? 4 : ph === 2 ? -2 : 0) : Math.round(Math.sin((c + tick) / 3) * 2);
                const age = (sweep - c + w) % w, colr = age < 2 ? R.SCR.hex[5] : age < 10 ? R.SCR.hex[4] : R.SCR.hex[2];
                px(X + c, Y + Math.max(0, Math.min(h - 1, mid + spike)), colr);
            }
            if (f.tone === 'ecg') px(X + w - 3, Y + 1, R.TEAL.hex[(tick % 8) < 2 ? 5 : 3], 2, 2);
        } else if (f.tone === 'graph') {
            let y0 = h / 2; for (let c = 0; c < w; c++) { const y = Math.round(h / 2 + (A.api.vnoise((c + tick) / 4, 0, 13) - 0.5) * (h - 2)); px(X + c, Y + Math.max(0, Math.min(h - 1, y)), R.SCR.hex[c === w - 1 ? 5 : 3]); y0 = y; }
        }
    }
    function fx(f, t, tick, ctxS) {
        const X = f.x + S.offX, Y = f.y - Math.round(S.camY);
        switch (f.kind) {
            case 'screen': screenFx(f, X, Y, tick, t); break;
            case 'led': if (((t + f.x * 37) % f.period) < f.period * 0.55) px(X, Y, f.color); break;
            case 'aura': { const v = 0.55 + 0.4 * Math.sin(t / 1700); px(X, Y, R.SCR.hex[v > 0.75 ? 5 : v > 0.45 ? 4 : 3], 2, 1); break; }
            case 'glint': px(X + Math.round(f.r * 0.4), Y - Math.round(f.r * 0.55), '#9ec4c8'); px(X + Math.round(f.r * 0.55), Y - Math.round(f.r * 0.35), '#4f6e74'); break;
            case 'steam':
                if (f.when === 'meal' && !ctxS.meal) break;
                for (let i = 0; i < 5; i++) { const rise = (tick + i * 5) % 16, x = X + Math.round(Math.sin((tick + i * 7) / 3) * 1.5) + (i % 2), y = Y - rise; if (h01(i, tick, 7) > rise / 18) tone(x, y, R.LINEN, 0.45 - rise * 0.02); }
                break;
            case 'core': {
                const pulse = 0.5 + 0.5 * Math.sin(t / 620), band = (tick * 3) % (f.h + 20);
                for (let y = 0; y < f.h; y++) {
                    const inBand = Math.abs((f.h - y) - band) < 3;
                    for (let x = 0; x < f.w; x++) { const c = 1 - Math.abs(x - f.w / 2) / (f.w / 2); const v = inBand ? 0.7 + 0.3 * c : 0.42 + 0.38 * c * pulse; if (inBand || h01(x + y * 3, tick, 2) < 0.18) tone(X + x, Y + y, R.ICE, v); }
                }
                break;
            }
            case 'hob': if (ctxS.meal) for (let x = 1; x < f.w - 1; x++) tone(X + x, Y, R.RED, 0.38 + 0.25 * Math.sin(t / 300 + x) * (h01(x, tick, 4) > 0.5 ? 1 : 0.4)); break;
            case 'nav': if (((t + f.phase) % 2600) < 180) { px(X - 1, Y, f.color, 3, 1); px(X, Y - 1, f.color, 1, 3); px(X, Y, '#f6f1e4'); } else px(X, Y, f.dim); break;
            case 'needle': { const a = -2.2 + f.k * 0.5 + Math.sin(t / 900 + f.k * 2) * 0.12; for (let r = 1; r <= 3; r++) px(X + Math.round(Math.cos(a) * r), Y + Math.round(Math.sin(a) * r), '#a8604a'); break; }
            case 'pod': for (let i = 0; i < 4; i++) { const yy = Y + 20 - ((tick + i * 9 + f.k * 5) % 34), xx = X - 6 + Math.floor(h01(i, f.k, 3) * 12); tone(xx, yy, R.ICE, 0.86); } break;
            case 'emergency': {
                const on = (t % 1800) < 900;
                if (on) { for (let y = -26; y <= 26; y++) for (let x = -34; x <= 34; x++) { const d = Math.hypot(x / 1.3, y) / 26; if (d < 1 && A.api.bay(X + x, Y + y) < (1 - d) * 0.22) px(X + x, Y + y, R.RED.hex[d < 0.4 ? 2 : 1]); } px(X - 2, Y - 1, '#ffd2c8', 5, 2); }
                break;
            }
            case 'beacon': if ((t % 2200) < 260) { px(X - 1, Y, '#e2574c', 3, 1); px(X, Y - 1, '#e2574c', 1, 3); px(X, Y, '#ffd2c8'); for (let y = -5; y <= 5; y++) for (let x = -5; x <= 5; x++) { const d = Math.hypot(x, y) / 5; if (d < 1 && d > 0.3 && A.api.bay(X + x, Y + y) < (1 - d) * 0.35) px(X + x, Y + y, R.RED.hex[1]); } } break;
            case 'plume': {
                const len = 46 + Math.round(h01(tick, 1, 3) * 10);
                for (let y = 0; y < len; y++) { const hw = (f.w / 2) * (1 - (y / len) * 0.55); for (let x = -Math.ceil(hw); x <= Math.ceil(hw); x++) { const u = Math.abs(x) / hw, v = (1 - y / len) * (1 - u * u) * 0.95; if (v > 0.06) tone(X + x, Y + y, R.PLUME, v); } }
                break;
            }
            default: break;
        }
    }

    // ── one frame ───────────────────────────────────────────────────────────────────────────────────────────────
    function drawSpace(t) {
        const cam = Math.round(S.camY);
        [[0, 0.12, 0.004, 0], [1, 0.3, 0.012, 137]].forEach(([layer, par, drift, ox]) => {
            const T = A.stars(layer), n = T.size, oy = ((Math.round(-cam * par + t * drift) % n) + n) % n;
            for (let y = oy - n; y < S.H; y += n) for (let x = -(ox % n); x < S.W; x += n) ctx.drawImage(T.canvas, x, y);
        });
    }
    function render() {
        if (!S.W) return;
        const t0 = performance.now(), t = S.t, tick = Math.floor(t / TICK), cam = Math.round(S.camY);
        curFill = '';
        ctx.imageSmoothingEnabled = false;
        ctx.fillStyle = A.INK; ctx.fillRect(0, 0, S.W, S.H);
        drawSpace(t);
        const people = SIM.at(S.state, t), gone = SIM.stateOf(S.state).gone || [];
        const ctxS = { meal: people.some(p => p.act === 'sit' && p.deck === 2) };
        const visible = (y0, h) => y0 + h > cam && y0 < cam + S.H;
        const N = A.nose(), T = A.tail();
        if (visible(0, L.TOP0)) { ctx.drawImage(N.canvas, S.offX, -cam); N.fx.forEach(f => fx(f, t, tick, ctxS)); }
        for (let i = 0; i < L.N; i++) {
            const top = A.deckTop(i); if (!visible(top, L.PITCH)) continue;
            const D = deckOf(i, S.state);
            ctx.drawImage(D.canvas, S.offX, top - cam);
            D.fx.forEach(f => fx(f, t, tick, ctxS));
        }
        if (visible(L.TAIL0, L.H - L.TAIL0)) { ctx.drawImage(T.canvas, S.offX, L.TAIL0 - cam); T.fx.forEach(f => fx(f, t, tick, ctxS)); }
        S.drawn = [];
        people.filter(p => !gone.includes(p.id)).sort((a, b) => a.z - b.z || a.x - b.x).forEach(p => { if (visible(p.y - 110, 120)) drawPerson(p); });
        vctx.imageSmoothingEnabled = false;
        vctx.drawImage(art, 0, 0, S.W, S.H, 0, 0, S.W * S.k, S.H * S.k);
        placeSpeech();
        const ms = performance.now() - t0;
        S.frames.push(ms); if (S.frames.length > 240) S.frames.shift();
    }

    // ── speech: one line at a time, over the speaker's head, following them ───────────────────────────────────────
    const sayEl = document.getElementById('say');
    function speak(id) {
        const d = S.drawn.find(p => p.id === id);
        if (!d) return false;
        const l = SIM.line(S.state, id, d.say);
        if (!l.text) return false;
        sayEl.querySelector('b').textContent = l.who; sayEl.querySelector('span').textContent = l.text;
        sayEl.style.setProperty('--who', id === 'cora' ? '#9fd8e6' : COLOR[id]);
        const ms = 3200 + l.text.length * 45;
        S.speech = { id, until: performance.now() + ms };
        sayEl.classList.remove('on'); placeSpeech(); void sayEl.offsetWidth; sayEl.classList.add('on');
        clearTimeout(speak.timer); speak.timer = setTimeout(placeSpeech, ms + 30);       // hides it even if frames are paused
        return true;
    }
    function placeSpeech() {
        const sp = S.speech;
        if (!sp) return;
        const d = S.drawn.find(p => p.id === sp.id);
        if (!d || performance.now() > sp.until) { sayEl.classList.remove('on'); S.speech = null; return; }
        const top = d.act === 'sleep' ? d.y - 26 : d.act === 'sit' ? d.y - 84 : d.act === 'tend' ? d.y - 70 : d.y - 104;
        const k = S.k / S.dpr, bx = (d.x + S.offX) * k, by = (top - Math.round(S.camY)) * k - 8;
        const half = Math.min(150, sayEl.offsetWidth / 2 || 150);
        sayEl.style.left = Math.max(half + 8, Math.min(innerWidth - half - 8, bx)) + 'px';
        sayEl.style.top = Math.max(sayEl.offsetHeight + 8, by) + 'px';
    }

    // ── input ───────────────────────────────────────────────────────────────────────────────────────────────────
    const alphas = new WeakMap();
    function hitPerson(ax, ay) {
        const wy = ay + Math.round(S.camY), wx = ax - S.offX;
        for (let i = S.drawn.length - 1; i >= 0; i--) {
            const d = S.drawn[i], Sp = d.Sp, top = Math.round(d.y) - Sp.origin.y;
            let cx = d.facing > 0 ? wx - (Math.round(d.x) - Sp.origin.x) : (Math.round(d.x) + Sp.origin.x) - wx, cy = wy - top;
            if (cx < -3 || cy < -3 || cx >= Sp.w + 3 || cy >= Sp.h + 3) continue;
            let al = alphas.get(Sp.canvas);
            if (!al) { al = Sp.canvas.getContext('2d').getImageData(0, 0, Sp.w, Sp.h).data; alphas.set(Sp.canvas, al); }
            for (let dy = -3; dy <= 3; dy++) for (let dx = -3; dx <= 3; dx++) { const x = cx + dx, y = cy + dy; if (x >= 0 && y >= 0 && x < Sp.w && y < Sp.h && al[(y * Sp.w + x) * 4 + 3]) return d.id; }
        }
        return null;
    }
    const toArt = e => [Math.floor(e.clientX * S.dpr / S.k), Math.floor(e.clientY * S.dpr / S.k)];
    view.addEventListener('click', e => {
        const [ax, ay] = toArt(e), who = hitPerson(ax, ay);
        if (who) { speak(who); return; }
        clickDeck(ay + Math.round(S.camY));
    });
    view.addEventListener('mousemove', e => { const [ax, ay] = toArt(e); view.classList.toggle('over-person', !!hitPerson(ax, ay)); });
    view.addEventListener('wheel', e => { e.preventDefault(); const dy = e.deltaMode === 1 ? e.deltaY * 16 : e.deltaY; S.camT = clampCam(S.camT + dy * 0.6); }, { passive: false });
    addEventListener('keydown', e => {
        if (e.key === 'ArrowDown' || e.key === 'PageDown') { stepDeck(1); e.preventDefault(); }
        else if (e.key === 'ArrowUp' || e.key === 'PageUp') { stepDeck(-1); e.preventDefault(); }
    });
    let touchY = null;
    view.addEventListener('touchstart', e => { touchY = e.touches[0].clientY; }, { passive: true });
    view.addEventListener('touchmove', e => { if (touchY == null) return; const y = e.touches[0].clientY; S.camT = clampCam(S.camT + (touchY - y) * S.dpr / S.k); touchY = y; }, { passive: true });

    // ── the study control ───────────────────────────────────────────────────────────────────────────────────────
    const STARTS = { normal: 96000, vance: 0, hurt: 60000, death: 80000, sleepers: 0 };
    const FOCUS = { normal: [1, 2], vance: [3, 4], hurt: [2, 3], death: [1, 2], sleepers: [4, 4] };
    const stateBtns = document.getElementById('states');
    function setState(id, keepTime) {
        S.state = SIM.stateOf(id).id;
        if (!keepTime) S.t = STARTS[S.state] || 0;
        const f = FOCUS[S.state]; frame(pairMode() ? f[0] : f[1]);
        stateBtns.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.id === S.state)));
        S.speech = null; sayEl.classList.remove('on');
        render();
    }
    SIM.STATES.forEach(st => {
        const b = document.createElement('button'); b.type = 'button'; b.dataset.id = st.id; b.textContent = st.name;
        b.addEventListener('click', () => setState(st.id)); stateBtns.appendChild(b);
    });

    // ── the clock ───────────────────────────────────────────────────────────────────────────────────────────────
    function tick(now) {
        const dt = S.last == null ? 16 : Math.min(100, now - S.last); S.last = now;
        if (S.playing) S.t += dt;
        const k = 1 - Math.exp(-dt / 170);
        S.camY += (S.camT - S.camY) * k; if (Math.abs(S.camT - S.camY) < 0.3) S.camY = S.camT;
        render();
        requestAnimationFrame(tick);
    }
    window.shipLife = {
        pause() { S.playing = false; render(); }, play() { S.playing = true; },
        step(ms = 125) { S.playing = false; S.t += ms; S.camY = S.camT; render(); },
        setTime(ms) { S.t = Math.max(0, ms); S.camY = S.camT; render(); },
        setState(id) { setState(id); S.camY = S.camT; render(); },
        go(d) { frame(d); S.camY = S.camT; render(); },
        cam(y) { S.camT = clampCam(y); S.camY = S.camT; render(); },
        say: id => speak(id),
        stats() { const f = S.frames.slice(-120), avg = f.reduce((a, b) => a + b, 0) / (f.length || 1); return { avgMs: +avg.toFixed(2), maxMs: +Math.max(0, ...f).toFixed(2), frames: f.length, k: S.k, art: [S.W, S.H], camY: Math.round(S.camY), camT: Math.round(S.camT), state: S.state, t: Math.round(S.t) }; },
        people: () => SIM.at(S.state, S.t).map(p => ({ id: p.id, deck: p.deck, x: p.x, act: p.act })),
        snapshot: () => art.toDataURL('image/png'),
    };
    addEventListener('resize', resize);
    resize();
    setState(q.get('state') || 'normal');
    if (q.has('deck')) frame(Number(q.get('deck')) || 0);
    if (q.has('t')) { S.t = Math.max(0, Number(q.get('t')) || 0); S.playing = false; }
    S.camY = S.camT;
    render();
    requestAnimationFrame(tick);
    // paint every deck for every state ahead of time, one a tick, so scrolling and switching never stall a frame
    const bake = [() => A.nose(), () => A.tail()];
    [S.state].concat(SIM.STATES.map(st => st.id)).forEach(id => { for (let i = 0; i < L.N; i++) bake.push(() => deckOf(i, id)); });
    // then every sprite frame each state will draw, 2.5 s of its loop a tick (a few ms of work), so no frame stalls the
    // first time it shows
    const WARM = 2500;
    [S.state].concat(SIM.STATES.map(st => st.id).filter(id => id !== S.state)).forEach(id => {
        const cyc = SIM.stateOf(id).cycle;
        for (let t0 = 0; t0 < cyc; t0 += WARM) bake.push(() => {
            for (let t = t0; t < t0 + WARM; t += 115) SIM.at(id, t).forEach(p => { const ll = lightFor(p, id), Sp = spriteOf(p, ll); if (ll.dim) dimOf(Sp.canvas); });
        });
    });
    (function next() { const job = bake.shift(); if (!job) return; job(); setTimeout(next, 20); })();
})();
</script>
