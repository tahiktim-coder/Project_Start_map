<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Silent Exodus Flight</title>
<meta name="description" content="Silent Exodus game screen v3 mockup: always flying toward the light. Worlds come up ahead and slide past; click one to pull in and stop.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=IBM+Plex+Sans+Condensed:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* Words are "Graphite" (bone, grey, steel; sodium only for people and the false sun; one red, for harm). The picture is
   "Deep field" (game-screen-v3/paint.js). Text sizes follow the CSS viewport: --t runs 0 at 1280 wide to 1 at 1920. */
:root {
    color-scheme: dark;
    --t: 1;
    --ink: #05070a;
    --text: #e4e4e0;
    --dim: #8b8d90;
    --faint: #5a6168;
    --ui: #c9d1d6;
    --warm: #f08c2e;
    --warm-br: #ffc27a;
    --danger: #e0453a;
    --f-ui: 'IBM Plex Sans Condensed', 'Arial Narrow', sans-serif;
    --f-text: 'IBM Plex Sans', system-ui, sans-serif;
    --f-num: 'IBM Plex Mono', ui-monospace, Consolas, monospace;
    --fs-voice: calc(19px + 5px * var(--t)); --fs-who: calc(14px + 1px * var(--t)); --measure: calc(470px + 150px * var(--t));
    --fs-note-name: calc(17px + 3px * var(--t)); --fs-note-line: calc(15px + 2px * var(--t)); --fs-note-cost: calc(14px + 1px * var(--t));
    --fs-chip: calc(14px + 2px * var(--t)); --fs-title: calc(34px + 12px * var(--t)); --fs-act: calc(17px + 3px * var(--t)); --fs-act-sub: calc(14px + 1px * var(--t));
    --fs-tag: calc(14px + 1px * var(--t)); --fs-hint: calc(14px + 1px * var(--t));
    --shadow: 0 1px 0 #05070a;
    --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--ink); overflow: hidden; }
body { color: var(--text); font: 400 15px/1.4 var(--f-text); -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none; }
p { margin: 0; }
button { font: inherit; color: inherit; }
#stage { position: fixed; inset: 0; overflow: hidden; outline: none; }
#stage.is-pointing { cursor: pointer; }
canvas { position: absolute; left: 0; top: 0; display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
#film, #inside { display: none; }
.layer { position: absolute; inset: 0; pointer-events: none; }

/* ── words that belong to the world ── */
.w { position: absolute; left: 0; top: 0; white-space: nowrap; text-shadow: var(--shadow); pointer-events: none; will-change: transform, opacity; }
.note { display: grid; gap: 3px; }
.note .name { font: 500 var(--fs-note-name)/1.15 var(--f-ui); letter-spacing: 0.02em; color: var(--text); }
.note .line { font: 400 var(--fs-note-line)/1.35 var(--f-text); color: var(--dim); }
.note .cost { font: 400 var(--fs-note-cost)/1.4 var(--f-num); color: var(--ui); }
.note .cost .gain { color: var(--text); }
.note.is-left { text-align: right; justify-items: end; }
.tagname { display: grid; gap: 2px; }
.tagname .n { font: 500 var(--fs-tag)/1.1 var(--f-ui); letter-spacing: 0.1em; text-transform: uppercase; color: #cfd2d0; }
.tagname .g { font: 400 var(--fs-tag)/1.2 var(--f-text); color: var(--dim); }
.tagname.is-left { text-align: right; justify-items: end; }
.tagname.is-contact .n { color: var(--dim); letter-spacing: 0.18em; }
.tagname.is-gone .n, .tagname.is-gone .g { color: var(--faint); }
.dated { font: 400 var(--fs-tag)/1.3 var(--f-num); color: var(--ui); }
.hint { font: 400 var(--fs-hint)/1.3 var(--f-num); color: var(--dim); }
.chips { display: flex; gap: 14px; }
.chip { font: 400 var(--fs-chip)/1 var(--f-num); color: var(--ui); }
.chip.is-gain { color: var(--text); }
.chip.is-loss { color: var(--danger); }
.title { font: 300 var(--fs-title)/1 var(--f-text); letter-spacing: 0.2em; color: var(--text); }
.supplies { display: grid; gap: 3px; }
.supplies .nums { font: 400 var(--fs-note-cost)/1.3 var(--f-num); color: var(--ui); }
.supplies .sub { font: 400 var(--fs-note-line)/1.3 var(--f-text); color: var(--dim); }
.place-head { display: grid; gap: 4px; }
.place-head .name { font: 500 calc(var(--fs-note-name) * 1.3)/1.1 var(--f-ui); letter-spacing: 0.03em; color: var(--text); }
.place-head .line { font: 400 var(--fs-note-line)/1.35 var(--f-text); color: var(--dim); }
.place-head.is-right { text-align: right; justify-items: end; }
.act {
    position: absolute; left: 0; top: 0; pointer-events: auto; cursor: pointer; display: grid; gap: 3px;
    padding: 6px 8px; margin: 0; background: none; border: 0; text-align: left; white-space: nowrap;
    text-shadow: var(--shadow); will-change: transform, opacity;
}
.act .verb { font: 400 var(--fs-act)/1.2 var(--f-text); color: var(--text); transition: color 140ms var(--ease); }
.act .sub { font: 400 var(--fs-act-sub)/1.3 var(--f-num); color: var(--dim); }
.act:hover .verb, .act:focus-visible .verb, .act.is-hot .verb { color: var(--warm); }
.act:focus-visible { outline: none; }
.act.is-pulse .verb { animation: act-pulse 900ms var(--ease) 3; }
@keyframes act-pulse { 50% { color: var(--warm-br); } }
#inside-words .room-words { justify-items: start; text-align: left; transition: opacity 200ms var(--ease); }

/* ── the Esc menu ── */
.menu { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; }
.menu[hidden] { display: none; }
.menu ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; text-align: center; }
.menu button { background: none; border: 0; cursor: pointer; font: 300 calc(var(--fs-voice) * 1.05)/1.2 var(--f-text); letter-spacing: 0.06em; color: var(--dim); text-shadow: var(--shadow); transition: color 140ms var(--ease); }
.menu button:hover, .menu button:focus-visible { color: var(--text); outline: none; }

/* ── mockup controls: NOT part of the game. Nothing shows until the backtick key opens the list. ── */
.moments { position: fixed; left: 8px; bottom: 8px; z-index: 40; padding: 8px 10px 10px; background: rgba(10, 12, 15, 0.94); border: 1px dashed #2c3036; display: grid; gap: 2px; min-width: 260px; }
.moments[hidden] { display: none; }
.moments b { font: 500 10px/1.6 var(--f-ui); letter-spacing: 0.2em; color: #6d747a; text-transform: uppercase; }
.moments button { text-align: left; background: none; border: 0; padding: 4px 4px; cursor: pointer; font: 400 12px/1.2 var(--f-num); color: #9aa0a6; }
.moments button:hover, .moments button:focus-visible { color: #fff; background: #1a1d21; outline: none; }
.moments small { font: 400 11px/1.4 var(--f-text); color: #6d747a; }
@media (prefers-reduced-motion: reduce) { .act.is-pulse .verb { animation: none; } }
</style>

<body>
<div id="stage" tabindex="-1" aria-label="Flying toward the light">
    <canvas id="world" aria-hidden="true"></canvas>
    <canvas id="film" width="288" height="144" aria-hidden="true"></canvas>

        <li><button type="button" data-menu="resume">Resume</button></li>

<script>
(function () {
    'use strict';
    const P = window.V3Paint, DATA = window.V3Data;
    const { INK, TICK, RP, threshold, clamp01, smooth, lerp, hash, level } = P;

    // ═══════════════════════════════════════════════════════════════════════════════════════════════════════════
    // 1. Screen, clock and the fixed places of the travelling view (docs/GAME_SCREEN_V3.md, "Positions and timings").
    //    The canvas is 640 x 360 art pixels at a whole number of device pixels each (v2's measure). Extra width or height
    //    is more sky, never stretch. Everything below is in stage pixels (640 x 360); cvX/cvY turn them into canvas pixels.
    // ═══════════════════════════════════════════════════════════════════════════════════════════════════════════
    const SW = 640, SH = 360;
    const LIGHT = [604, 158];                                    // the light: where everything comes out of; it never moves
    const SHIP = { x: 224, y: 196, len: 48, ht: 15 };            // the Lander at rest, nose on the light; width a third of its length
    const CRUISE = 52, SLOW = 26, CREEP = 5;                     // px a second on the stop layer. On the lane we never go below SLOW; CREEP is only for the ship view
    const REACH_LEAD = 96;                                       // a world is in reach from about 2 s (at cruise) before its closest point until it passes our tail
    const LINGER = 900;                                          // px of flight a passed world stays in sight behind us (about 17 s at cruise), grey and shrinking
    const ORBIT_R = Math.round(SH * 0.43);                       // in orbit a world's diameter is about 86% of the screen height (v1's orbit framing)
    const ORBIT_SHIP = 2;                                        // our ship in orbit is twice its lane size
    const FLOW_LN = Math.log(900 / 22);                          // the stream of specks: distance from the vanishing point runs 22 → 900 px
    const BASE_ANGLE = Math.atan2(LIGHT[1] - SHIP.y, LIGHT[0] - SHIP.x);
    const GIANT_R = 190, GIANT_TILT = 0.75, GIANT_OPEN = 0.3;
    const $ = id => document.getElementById(id);
    const G = { k: 3, s: 3, dpr: 1, W: SW, H: SH, ox: 0, oy: 0, left: 0, top: 0 };
    const cv = $('world'), ctx = cv.getContext('2d');
    const filmCv = $('film'), filmCtx = filmCv.getContext('2d');
    function measure() {
        const dpr = window.devicePixelRatio || 1, iw = window.innerWidth, ih = window.innerHeight, dw = Math.round(iw * dpr), dh = Math.round(ih * dpr);
        const k = Math.max(2, Math.floor(Math.min(dw / SW, dh / SH) + 1e-6));
        G.k = k; G.dpr = dpr; G.s = k / dpr;
        G.W = Math.ceil(dw / k); G.H = Math.ceil(dh / k); G.ox = Math.round((G.W - SW) / 2); G.oy = Math.round((G.H - SH) / 2);
        G.left = Math.floor((dw - G.W * k) / 2) / dpr; G.top = Math.floor((dh - G.H * k) / 2) / dpr;
        cv.width = G.W; cv.height = G.H; cv.style.width = G.W * G.s + 'px'; cv.style.height = G.H * G.s + 'px'; cv.style.left = G.left + 'px'; cv.style.top = G.top + 'px';
        document.documentElement.style.setProperty('--t', Math.max(0, Math.min(1.5, (iw - 1280) / 640)).toFixed(3));
        document.documentElement.style.setProperty('--px', G.s + 'px');
    }
    const toScreen = (cx, cy) => [G.left + cx * G.s, G.top + cy * G.s];
    const toCanvas = (px, py) => [(px - G.left) / G.s, (py - G.top) / G.s];
    const cvX = x => G.ox + x, cvY = y => G.oy + y;

    const clock = { t: 0, timers: [], seq: 0, frozen: false };
    function after(ms, fn) { const id = ++clock.seq; clock.timers.push({ id, at: clock.t + ms, fn }); return id; }
    function cancelTimer(id) { const i = clock.timers.findIndex(x => x.id === id); if (i >= 0) clock.timers.splice(i, 1); }
    function advance(dt) {
        const end = clock.t + dt;
        for (;;) {
            let next = null;
            for (const x of clock.timers) if (x.at <= end && (!next || x.at < next.at)) next = x;
            if (!next) break;
            clock.timers.splice(clock.timers.indexOf(next), 1);
            const before = clock.t; clock.t = Math.max(clock.t, next.at); update(clock.t - before);
            try { next.fn(); } catch (err) { console.error(err); }
        }
        const rest = end - clock.t; clock.t = end; update(rest);
    }
    const ease = s => (s < 0.5 ? 2 * s * s : 1 - 2 * (1 - s) * (1 - s));
    const easeOut = s => 1 - (1 - s) ** 3;

    const patterns = [];
    function pattern(levelN) {
        const Lv = Math.max(0, Math.min(64, Math.round(levelN)));
        if (!patterns[Lv]) { const c = document.createElement('canvas'); c.width = 8; c.height = 8; const g = c.getContext('2d'); g.fillStyle = INK; for (let i = 0; i < 64; i++) if (P.BAYER_RAW[i] < Lv) g.fillRect(i & 7, i >> 3, 1, 1); patterns[Lv] = ctx.createPattern(c, 'repeat'); }
        return patterns[Lv];
    }
    function dimWith(c, amount) { if (amount <= 0) return; c.fillStyle = pattern(amount * 64); c.fillRect(0, 0, G.W, G.H); }
    function darken(c, amount) {
        if (amount <= 0) return;
        const v = Math.round(255 * (1 - clamp01(amount)));
        c.save(); c.globalCompositeOperation = 'multiply'; c.fillStyle = `rgb(${v},${v},${v})`; c.fillRect(0, 0, G.W, G.H); c.restore();
    }
    const offscreens = {};
    function offscreen(name) { let o = offscreens[name]; if (!o || o.c.width !== G.W || o.c.height !== G.H) { const c = document.createElement('canvas'); c.width = G.W; c.height = G.H; o = offscreens[name] = { c, g: c.getContext('2d') }; } return o; }

    // ═══════════════════════════════════════════════════════════════════════════════════════════════════════════
    // 2. State. One heading: sectors in order, supplies and the record carried across every jump.
    // ═══════════════════════════════════════════════════════════════════════════════════════════════════════════
    let S = null;
    const record = [];
    const pagesRead = [];
    function prepPlace(pl, sec) {
        if (pl.kind === 'giant') return pl;
        const [px, py] = pl.pass;
        pl.k = (LIGHT[0] - px) / CRUISE;                                                         // the approach keeps one speed through its closest point
        pl.full = pl.kind === 'station' ? 24 * pl.s : pl.r;                                       // how big it is at its closest (a station's half width)
        // once past, it glides back along our wake and rests near the left edge, grey and shrinking, then slips away
        const restR = pl.full * 0.45, slope = (py - LIGHT[1]) / (LIGHT[0] - px), rx = 30 + restR;
        pl.rest = [rx, Math.max(restR + 10, Math.min(SH - restR * 0.6 - 8, py + slope * (px - rx) * 0.35))];
        const d = Math.hypot(LIGHT[0] - px, LIGHT[1] - py);
        pl.L = P.lightVector(px, py, LIGHT[0], LIGHT[1], 0.5 * d);                                // one light per world, in front of the picture (lz about +0.45: most of its lit face shows), lane and orbit alike
        pl.rim = sec.rim;
        return pl;
    }
    function fresh(n, carry) {
        const sec = DATA.SECTORS[n];
        return {
            n, view: 'travel', D: 0, speed: CRUISE, res: Object.assign({}, carry || sec.res), stops: sec.stops,
            places: sec.places.map(p => prepPlace(Object.assign({ step: 0, passed: false, visited: false, reachMs: 0 }, p), sec)),
            ship: { angle: BASE_ANGLE }, hover: null, course: null, push: null, orbit: null, jump: null, shipView: null, film: null,
            intro: null, mid: { x: 0, y: 0 }, roll: 0, wake: [], passedCount: 0, lastPassD: 0, flow: 0, rejoinT: null, jumpReady: false, sectorT0: clock.t, fadeIn: null,
            flags: { said: {}, hint: false, hintGone: false, passSaid: false, firstReach: null }, dim: 0, reveal: null, shuttle: null, reachT0: {},
        };
    }
    const placeById = id => S && S.places.find(p => p.id === id);

    // ═══════════════════════════════════════════════════════════════════════════════════════════════════════════
    // 3. The stream of worlds. A world d seconds ahead (at cruise) sits on a curve out of the light: f = k / (k + d),
    //    position = light + (closest point - light) * f, radius = full * f^1.4. k is chosen per world so it moves one pixel
    //    for each pixel we fly as it passes its closest point; after that it carries straight on, past our tail.
    //    A glint while the radius is under 1.5, a flat disc under 8, the full v1 sphere after.
    // ═══════════════════════════════════════════════════════════════════════════════════════════════════════════
    function geom(pl, D) {
        if (pl.kind === 'giant') return giantGeom(D);
        const d = (pl.at - D) / CRUISE;
        let x, y, r, f;
        if (d >= 0) {
            // size follows f; place follows sqrt(k/2 / (k/2 + d)), which meets f with the same speed at the closest point but keeps
            // far worlds spread out from the light as separate glints you can count, instead of lost in its glow
            f = pl.k / (pl.k + d); const fp = Math.sqrt(pl.k / 2 / (pl.k / 2 + d));
            x = LIGHT[0] + (pl.pass[0] - LIGHT[0]) * fp; y = LIGHT[1] + (pl.pass[1] - LIGHT[1]) * fp; r = pl.full * Math.pow(f, 1.4);
        } else {                                                                                   // passed: it glides back along the wake, greys and shrinks, waits, then slips away
            const s = D - pl.at, tau = pl.pass[0] - pl.rest[0], e = 1 - Math.exp(-s / tau), out = Math.max(0, s - LINGER);
            f = 1; x = pl.pass[0] - tau * e - out * 1.4; y = pl.pass[1] + (pl.rest[1] - pl.pass[1]) * e; r = pl.full * (1 - 0.55 * e);
        }
        return { x, y, r, f, d };
    }
    /** The sector's enormous thing, on a slow layer: it drifts across the frame once a sector. */
    const GIANT_PATH = { p0: [830, 560], mid: [300, 406] };
    function giantGeom(D) {
        const pl = S.places.find(p => p.kind === 'giant'), at = pl ? pl.at : 3400, k = D / at;
        const e = k <= 1 ? Math.pow(Math.max(0, k), 2.2) : 1 + 2.2 * (k - 1);                   // far off it barely moves; it comes on faster as we close, and goes behind
        return { x: lerp(GIANT_PATH.p0[0], GIANT_PATH.mid[0], e), y: lerp(GIANT_PATH.p0[1], GIANT_PATH.mid[1], e), r: GIANT_R, f: 1, d: (at - D) / CRUISE };
    }
    /** The point of the giant's limb nearest our ship: where its clouds pass under our lane. */
    function giantLimb(g) { const dx = SHIP.x - g.x, dy = SHIP.y - g.y, d = Math.hypot(dx, dy) || 1; return [g.x + dx / d * g.r, g.y + dy / d * g.r]; }
    function inReach(pl, g) {
        if (!S || pl.visited || pl.passed || pl.hidden || S.stops <= 0) return false;
        if (pl.kind === 'giant') return S.D > pl.at - 320 && S.D < pl.at + 140;
        g = g || geom(pl, S.D);
        return S.D >= pl.at - REACH_LEAD && g.x > TAIL_X;
    }
    const TAIL_X = SHIP.x - SHIP.len / 2;                                                           // a world is behind us once it slides past our tail
    const isPassed = (pl, g) => (pl.kind === 'giant' ? S.D >= pl.at + 140 : (g || geom(pl, S.D)).x < TAIL_X);
    const reachPlaces = () => (S ? S.places.filter(pl => inReach(pl)) : []);

    // ── sprites, painted once per size (whole-pixel radii) ──
    const spriteCache = new Map();
    function worldSprite(pl, rInt, grey) {
        const key = `${S.n}:${pl.id}:${rInt}:${grey ? 1 : 0}`;
        if (spriteCache.has(key)) return spriteCache.get(key);
        let out;
        if (pl.kind === 'station') {
            const s = pl.s * rInt / pl.full, half = Math.ceil(27 * s + 3), p = P.painter(half * 2, half * 2, false);
            const win = P.drawStation(p, half, half, s, pl.seed, grey ? 0.85 : 0.75 + 0.25 * clamp01(rInt / pl.full), grey ? { hull: RP.PASSED, panel: RP.PASSED } : null);
            out = { canvas: p.canvas(), half, win: [win[0] - half, win[1] - half], rims: [] };
        } else {
            const r = rInt, w = Math.max(2, Math.round(r / 22)), half = r + w + 3, p = P.painter(half * 2, half * 2, false), rims = [];
            const frac = r / pl.full, dim = grey ? 0.85 : 0.62 + 0.38 * smooth(0.12, 0.85, frac);              // far worlds sit back in the haze
            const type = pl.type, ramp0 = grey ? RP.PASSED : (P.PLANET_RAMP[type] || RP.STONE);
            P.sphere(p, { cx: half, cy: half, r, ramp: ramp0, L: pl.L, dim, surface: P.surfaceFor(type, pl.seed, pl.L), rim: grey ? 0 : pl.rim, ambient: 0.012, gain: 0.84, rims,
                atmo: grey ? null : { ramp: type === 'gas' || type === 'desert' ? RP.DUST : RP.ICE, w } });
            if (pl.beacon && !grey && r >= 60) {                                                   // v1's orbitPlanet: the furrow the wreck cut coming down, beside its beacon
                const [bx, by] = beaconOffset(pl, r), k = r / 118, X = half + bx, Y = half + by;
                p.line(X + 3 * k, Y + k, X + 16 * k, Y - 2 * k, (x, y) => p.solid(x, y, RP.STONE, 0.02));

    /** Where a world's beacon sits, from its centre, on the night side (v1's spot). */
    const beaconOffset = (pl, r) => [Math.round(-0.6 * r), Math.round((pl.type === 'ice' ? -0.45 : 0.1) * r)];

    // ── the Lander: one drawing, cached every 2 degrees and per length ──
    const landerCache = new Map();
    const SUN_ANGLE = Math.atan2(LIGHT[1] - SHIP.y, LIGHT[0] - SHIP.x);
    /** THE drawing of our ship: one recipe for the lane, orbit and the turn into the ship view. roll: how far the camera has
        rolled (the light turns with it, so the hull stays lit from the same side). Returns where its ports, bridge, nose, bell,
        skirt and shuttle clamp are, relative to (x, y). */
    function paintLander(p, x, y, len, a, roll = 0) {

        const o = { x, y, len, ht, angle: a, flip: true, seed: 9, anchor: 0.5, sun: len < 80 ? 0.24 : 0.32, sunDir: [Math.cos(sa), Math.sin(sa)], fade: 0.22, mirror: false, flat: len < 130 };
        const at = P.hull(p, o, P.shapeL);

            ht, ports: [0, 1, 2, 3, 4, 5].map(i => rel(at(P.DECK_U(i) + 0.054, -0.32))),                    // a porthole per deck, on the side we see
            bridge: rel(at(P.LANDER.NOSE - 0.02, -0.12)), nose: rel(at(0, 0)), bell: rel(at(1.0, 0)),
            windows: [-0.3, -0.05, 0.2].map(v => rel(at(P.LANDER.NOSE - 0.014, v))), winSize: Math.max(1.3, ht * 0.04),   // the bridge's ring of windows (shapeL)
            skirt: [0.87, 0.89, 0.91, 0.93].map(u => rel(at(u, 0.6))), clamp: rel(at(P.DECK_U(4) + 0.05, 0.56 + 1.2 / ht)),

    }
    /** The shuttle: a small copy of our hull, clamped beside the hold. */

    // ═══════════════════════════════════════════════════════════════════════════════════════════════════════════
    // 4. The sector's still parts: space (v1's haze, dust and stars, on a strip that slides at 0.02 of our speed), the
    //    light's breathing frames, the enormous thing, the far scenery.
    // ═══════════════════════════════════════════════════════════════════════════════════════════════════════════
    const arts = new Map();
    const STRIP_EXTRA = 200;
    function sectorArt(n) {
        const key = `${n}:${G.W}x${G.H}`;
        if (arts.has(key)) return arts.get(key);
        const sec = DATA.SECTORS[n], lx = cvX(LIGHT[0]), ly = cvY(LIGHT[1]), halo = Math.max(sec.light.halo, 18);
        const sky = window.V3Sky ? window.V3Sky.build(G.W, G.H, G.ox, G.oy, n, LIGHT) : null;          // the far sky (?sky=a|b|c|d|e|f|none), behind the haze
        const strip = P.spaceStrip(G.W + STRIP_EXTRA, G.H, sec.seed, sec.dust, sec.haze * (sky ? sky.haze : 1), sec.stars);
        const lit = new Float32Array(G.W * G.H);
        for (let y = 0; y < G.H; y++) for (let x = 0; x < G.W; x++) lit[y * G.W + x] = Math.exp(-Math.hypot(x - lx, (y - ly) * 1.15) / (halo * 0.85 + 6));
        const bp = P.painter(G.W, G.H, true), canvas = document.createElement('canvas'); canvas.width = G.W; canvas.height = G.H;
        const A = { n, strip, sky, lit, bp, canvas, g: canvas.getContext('2d'), off: null, bright: [], glows: new Map(), thing: null, scenery: [] };
        if (sec.thing === 'giant') A.thing = paintGiantCanvas();
        if (sec.thing === 'rogue') A.thing = paintRogueCanvas();
        (sec.scenery || []).forEach(sc => {
            const half = sc.r + 2, p = P.painter(half * 2, half * 2, false), L = P.lightVector(sc.x, sc.y, LIGHT[0], LIGHT[1], 60);
            const haze = P.ramp(INK, RP.HAZE.hex[2], RP.HAZE.hex[4], RP.STONE.hex[2], RP.STONE.hex[3]);   // far: flat dither, fewer colours, toward the haze
            P.sphere(p, { cx: half, cy: half, r: sc.r, ramp: haze, L, dim: 0.85, surface: P.surfaceFor(sc.type, sc.seed, L) });

    function ensureBackdrop(A, off) {

        const offD = A.sky ? Math.round(S.D * window.V3Sky.DEEP) : 0, key = off + ':' + offD;   // the far sky slides at a quarter of the haze's rate
        if (A.off === key) return;
        const sec = DATA.SECTORS[A.n], lx = cvX(LIGHT[0]), ly = cvY(LIGHT[1]), away = sec.light.halo * 0.9 + sec.light.core + 8, keep = (x, y) => Math.hypot(x - lx, y - ly) < away;
        A.bright = A.sky ? window.V3Sky.paintSpace(A.bp, A.strip, off, A.lit, keep, A.sky, offD) : P.paintSpace(A.bp, A.strip, off, A.lit, keep);
        A.g.putImageData(new ImageData(A.bp.data, G.W, G.H), 0, 0);

    }
    /** The light grows a little after each world we pass, and much more sector by sector. */
    const LIGHT_STEP = 1.13;                                                                        // six places a sector: the light has doubled by the jump
    function lightNow() { const L = DATA.SECTORS[S.n].light, k = Math.pow(LIGHT_STEP, S.passedCount); return { core: L.core * k, halo: L.halo * k, strength: L.strength, spikes: L.spikes * Math.sqrt(k) }; }
    function glowFrames(A) {
        const L = lightNow(), key = L.core.toFixed(2);
        if (A.glows.has(key)) return A.glows.get(key);
        const lx = cvX(LIGHT[0]), ly = cvY(LIGHT[1]), reach = Math.ceil(L.halo * 3.2 + L.core + 10), size = reach * 2;
        const frames = Array.from({ length: 8 }, (_, k) => { const p = P.painter(size, size, false); P.lightGlow(p, reach + (lx - Math.round(lx)), reach + (ly - Math.round(ly)), L, 0.9 + 0.1 * Math.sin(k / 8 * Math.PI * 2)); return { canvas: p.canvas(), x: Math.round(lx) - reach, y: Math.round(ly) - reach }; });
        A.glows.set(key, frames);

    }
    function giantLight() { const [mx, my] = GIANT_PATH.mid, d = Math.hypot(LIGHT[0] - mx, LIGHT[1] - my); return P.norm3(LIGHT[0] - mx, LIGHT[1] - my, 0.258 * d); }
    function paintGiantCanvas() {
        const hx = Math.ceil(GIANT_R * 1.74 * Math.sqrt(Math.cos(GIANT_TILT) ** 2 + (GIANT_OPEN * Math.sin(GIANT_TILT)) ** 2)) + 10;
        const hy = Math.ceil(GIANT_R * 1.74 * Math.sqrt(Math.sin(GIANT_TILT) ** 2 + (GIANT_OPEN * Math.cos(GIANT_TILT)) ** 2)) + 10;
        const W = Math.max(hx, GIANT_R + 10) * 2, H = Math.max(hy, GIANT_R + 10) * 2, p = P.painter(W, H, false);
        const out = P.paintGiant(p, { cx: W / 2, cy: H / 2, R: GIANT_R, L: giantLight(), tilt: GIANT_TILT, open: GIANT_OPEN });
        return { kind: 'giant', canvas: p.canvas(), cx: W / 2, cy: H / 2, rims: out.rims.map(([x, y, r, lv]) => [x - W / 2, y - H / 2, r, lv]) };
    }
    const ROGUE = { R: 150, p0: [470, 420], v: [-0.06, -0.03] };
    function paintRogueCanvas() {
        const R = ROGUE.R, half = R + 4, p = P.painter(half * 2, half * 2, false), d = Math.hypot(LIGHT[0] - ROGUE.p0[0], LIGHT[1] - ROGUE.p0[1]);
        P.paintRogue(p, { cx: half, cy: half, R, L: P.norm3(LIGHT[0] - ROGUE.p0[0], LIGHT[1] - ROGUE.p0[1], 0.3 * d) });

    }
    function thingPos(A) {
        if (!A.thing) return null;
        if (A.thing.kind === 'giant') { const g = giantGeom(S.D); return [g.x, g.y]; }
        return [ROGUE.p0[0] + ROGUE.v[0] * S.D, ROGUE.p0[1] + ROGUE.v[1] * S.D];
    }

    // ── a bake queue: big paintings done one a frame in real time, so a push-in never stalls (a still frame bakes on the spot) ──
    const bakeQueue = [];
    function bakeLater(fn) { bakeQueue.push(fn); }
    function bakeOne() { const job = bakeQueue.shift(); if (job) { try { job(); } catch (err) { console.warn('Bake skipped:', err.message); } } }

    // ═══════════════════════════════════════════════════════════════════════════════════════════════════════════
    // 5. Drawing the flight, frame by frame. Layers far to near: space (0.02), mid stars (0.1, the living ship's own star
    //    tile), the enormous thing, the light, dust motes (0.6), the worlds (1.0), the searchlight, our ship with its wake,
    //    plume and lit portholes, and near dust streaks (2.0) passing in front of everything.
    // ═══════════════════════════════════════════════════════════════════════════════════════════════════════════
    let front = null, back = null, near = null;
    function layers() { if (!front || front.W !== G.W || front.H !== G.H) { front = P.pixelLayer(G.W, G.H); back = P.pixelLayer(G.W, G.H); near = P.pixelLayer(G.W, G.H); } return { front, back, near }; }
    let occCache = { t: -1, on: [true, true, true, true, true, true] };
    function occupied(t) { if (Math.abs(t - occCache.t) > 250 && Inside) occCache = { t, on: Inside.occupied(t) }; return occCache.on; }

    // ── one camera. Looking ahead from behind our ship: everything streams out of the light. A pull-in scales every layer about
    //    the world we pull in to, each at its own depth. The ship view rolls the whole world with the hull as it turns nose up. ──
    /** During a pull-in: maps a lane point at depth q (1 = the world we pull in to, 0 = as far off as the light) to the screen. */
    function camAt(q) {
        const o = S.orbit; if (!o) return null;
        const k = pushK(); if (k.e <= 0) return null;
        const Z = Math.pow(o.Z, k.e), Zq = 1 + (Z - 1) * q, ax = lerp(o.P0[0], o.P1[0], k.e), ay = lerp(o.P0[1], o.P1[1], k.e);

    }
    /** The ship view's roll, from the frame the hull is on: the world turns about our ship by the same angle as the hull. */
    function viewRoll() {
        const sv = S.shipView; if (!sv) return null;
        const F = shipViewFrames().frames[Math.round(sv.k * 7)];
        return { a: F.roll, cx: F.x, cy: F.y, k: sv.k };
    }
    function rolled(c, roll, fn) {
        if (!roll) { fn(); return; }
        c.save(); c.translate(Math.round(roll.cx), Math.round(roll.cy)); c.rotate(roll.a); c.translate(-cvX(SHIP.x), -cvY(SHIP.y));
        fn();
        c.restore();
    }

    function drawFlight(c, t) {
        const A = sectorArt(S.n), f = P.framer(c, G.W, G.H), { front: FL, back: BL, near: NL } = layers(), roll = viewRoll();
        ensureBackdrop(A, Math.round(S.D * 0.02));
        c.imageSmoothingEnabled = false;
        if (roll) { c.fillStyle = INK; c.fillRect(0, 0, G.W, G.H); }
        rolled(c, roll, () => {
            if (roll) {                                                                            // turning nose up: the sky dissolves to the living ship's own star tiles
                drawTiles(c, 0, 0, 0, true);
                const o = offscreen('roll'); o.g.clearRect(0, 0, G.W, G.H); o.g.drawImage(A.canvas, 0, 0);
                o.g.globalCompositeOperation = 'destination-out'; o.g.fillStyle = pattern(Math.floor(roll.k * 8) / 8 * 64); o.g.fillRect(0, 0, G.W, G.H); o.g.globalCompositeOperation = 'source-over';
                c.drawImage(o.c, 0, 0);
            } else c.drawImage(A.canvas, 0, 0);
            drawTiles(c, 1, S.mid.x, S.mid.y, !!roll);
            drawFarThing(c, A, roll);
            if (A.sky && A.sky.live && !roll) A.sky.live(c, t, S.D);                                  // round two's far motion: a pulsar's beam, comets, glints, far flashes

            drawScenery(c, A);
            const gl = glowFrames(A), g = gl[Math.floor(t / 500) % gl.length]; c.drawImage(g.canvas, g.x, g.y);

            P.twinkle(f, A.bright.filter(st => !discs.some(([x, y, r]) => Math.hypot(st.x - x, st.y - y) < r + 2) && !(A.sky && A.sky.thing && A.sky.thing.covers(st.x, st.y, S.D))), t);   // nor behind the far planet
            BL.clear(); FL.clear(); NL.clear();

            BL.draw(c);
            drawWorlds(c, f, t);
            drawSearchlight(FL, f, t);
            drawWake(FL, t);
            flowField(FL, FLOW.streaks);
            FL.draw(c);
        });
        drawShip(c, f, t);
        rolled(c, roll, () => { flowField(NL, FLOW.near); NL.draw(c); });                          // the nearest dust passes in front of our ship

        drawThread(f, t);
        if (S.jump) drawJump(c, f, t);
    }
    /** The deep sky's enormous far thing (sector 1: a vast planet's night side). It hides the stars behind it, so it is drawn
        over the mid stars; it slides at 0.012 of our speed and dissolves with the sky when we turn into the ship view. */
    function drawFarThing(c, A, roll) {
        const th = A.sky && A.sky.thing; if (!th) return;
        const x = -Math.min(th.canvas.width - G.W, Math.round(S.D * th.speed));
        if (!roll) { c.drawImage(th.canvas, x, 0); return; }
        const o = offscreen('farThing'); o.g.clearRect(0, 0, G.W, G.H); o.g.drawImage(th.canvas, x, 0);
        o.g.globalCompositeOperation = 'destination-out'; o.g.fillStyle = pattern(Math.floor(roll.k * 8) / 8 * 64); o.g.fillRect(0, 0, G.W, G.H); o.g.globalCompositeOperation = 'source-over';
        c.drawImage(o.c, 0, 0);
    }
    /** The living ship's star tiles (ShipArt.stars): layer 1 is our mid stars. Rolled, they cover past the screen's corners. */
    function drawTiles(c, layer, mx, my, wide) {
        const T = window.ShipArt.stars(layer), n = T.size, ox = ((Math.round(mx) % n) + n) % n, oy = ((Math.round(my) % n) + n) % n, pad = wide ? Math.max(G.W, G.H) : 0;
        for (let y = oy - n - pad; y < G.H + pad; y += n) for (let x = ox - n - pad; x < G.W + pad; x += n) c.drawImage(T.canvas, x, y);

    /** The sector's enormous thing. Pulled in on a world, it grows at half the rate, is carried out of frame and fades through the dither. */
    function drawThing(c, A, tp) {
        const th = A.thing;
        if (th.kind === 'giant' && S.orbit && S.orbit.focal) { const fr = giantPushFrame(pushK().step); if (fr) { c.drawImage(fr, 0, 0); return; } }
        const cam = S.orbit && camAt(0.5);
        if (!cam) { c.drawImage(th.canvas, Math.round(cvX(tp[0]) - th.cx), Math.round(cvY(tp[1]) - th.cy)); return; }
        const fade = Math.floor(smooth(0.1, 0.8, cam.e) * 8) / 8;

    }
    function drawScenery(c, A) {
        const cam = S.orbit && camAt(0.3);
        A.scenery.forEach(sc => {
            let x = sc.x - sc.speed * S.D, y = sc.y, z = 1;
            if (cam) { [x, y] = cam.map(x, y); z = cam.Zq; }

            c.drawImage(sc.canvas, Math.round(cvX(x) - s / 2), Math.round(cvY(y) - s / 2), s, s);

    }

    // ── space streaming past ──
    /** Specks on rays out of the vanishing point (the light). A speck's distance grows exponentially with its phase, as in a
        forward view: far ones crawl near the light, near ones rush past the frame edge. Its tail is where it was a moment ago,
        so tails stretch with speed and shrink to dots when we stop. During a pull-in the rays come out of the world we pull
        in to and the specks spread apart, as a zoom spreads them. rate: phase per px of flight (2x our speed at the ship, for
        streaks). */
    const FLOW = {
        motes: { n: 110, seed: 41, rate: 0.0005, tail: 0.1, q: 0.15, ramp: 'DUST', v: 0.85, lit: true },
        streaks: { n: 260, seed: 43, rate: 0.0015, tail: 0.17, q: 0.35, ramp: 'STAR', v: 0.9 },
        near: { n: 34, seed: 47, rate: 0.0027, tail: 0.13, q: 0.6, ramp: 'STAR', v: 1.05, wide: 0.5 },
    };
    function flowPoint() {
        const lx = cvX(LIGHT[0]), ly = cvY(LIGHT[1]), o = S.orbit, k = o ? pushK().e : 0;
        if (!o || k <= 0) return [lx, ly];
        return [lerp(lx, cvX(o.P1[0]), k), lerp(ly, cvY(o.P1[1]), k)];
    }
    function flowField(L, o) {

        const ramp0 = RP[o.ramp], tailPh = Math.min(0.12, S.speed * o.rate * o.tail), lx = cvX(LIGHT[0]), ly = cvY(LIGHT[1]);

            }

    }

    // ── the worlds ──
    function drawWorlds(c, f, t) {
        const list = S.places.filter(pl => pl.kind !== 'giant').map(pl => ({ pl, g: placeGeom(pl) })).sort((a, b) => (a.pl === focusPlace() ? 1 : 0) - (b.pl === focusPlace() ? 1 : 0) || a.g.r - b.g.r);
        list.forEach(({ pl, g }) => {
            const x = Math.round(cvX(g.x)), y = Math.round(cvY(g.y));
            if (x < -g.r - 40 || x > G.W + g.r + 40 || y < -g.r - 40 || y > G.H + g.r + 40) return;

            if (g.r < 8 && pl.kind !== 'station') { flatDisc(f, pl, x, y, g.r); return; }
            if (pl.kind === 'station' && g.r < 7) { f.tone(x, y, RP.HULL, 0.45); f.tone(x - 1, y, RP.UI, 0.3); f.tone(x + 1, y, RP.UI, 0.3); return; }
            const sp = worldSprite(pl, Math.round(g.r), grey);
            if (S.reveal && S.reveal.id === pl.id) { revealWorld(c, f, sp, x, y, t); return; }
            if (pl.greyAt && !isFocus(pl) && t - pl.greyAt < 900) {                                   // turning grey: a dither crossfade in steps

    function frame(now) {
        if (clock.frozen) return;
        if (lastReal != null) advance(Math.min(100, now - lastReal) * SPEED * (fastHeld ? 6 : 1));
        lastReal = now; lastRender = now;
        render();
    }
    function loop(now) { frame(now); requestAnimationFrame(loop); }
    window.step = async ms => { let left = Math.max(0, +ms || 0); while (left > 0) { const d = Math.min(16, left); advance(d); left -= d; await Promise.resolve(); await Promise.resolve(); } render(); return Math.round(clock.t); };
    window.setTime = async ms => { const was = clock.frozen; clock.frozen = true; moment(currentMoment); const out = await window.step(ms); clock.frozen = was; lastReal = null; return out; };
    window.moment = name => { moment(name); render(); return name; };
    window.freeze = on => { clock.frozen = on !== false; lastReal = null; return clock.frozen; };
    window.v3 = {
        get S() { return S; }, get inside() { return Inside; }, shades: () => [...shades.entries()].map(([k, r]) => k + ":" + [r.x, r.y, r.w, r.h].map(Math.round).join(",")), record, point: pointAt, click: (kind, id) => pointAt({ kind, id }, true),
        act: name => { const b = words.get('act:' + name); if (b) b.el.click(); return !!b; },
        advance: () => Reading.advance(), key: k => document.dispatchEvent(new KeyboardEvent('keydown', { key: k, bubbles: true })),
        words: () => [...words.entries()].filter(([, r]) => r.el.style.opacity !== '0').map(([k, r]) => k + ': ' + r.el.textContent),
        frameCost: n => { const out = []; for (let i = 0; i < (n || 60); i++) { const a = performance.now(); advance(16); render(); out.push(performance.now() - a); } out.sort((a, b) => a - b); return { median: +out[out.length >> 1].toFixed(2), p95: +out[Math.floor(out.length * 0.95)].toFixed(2), max: +out[out.length - 1].toFixed(2) }; },
    };

    measure();
    const stillAt = params.has('t') ? Math.max(0, +params.get('t') || 0) : null;
    if (Inside) Inside.prepare();
    moment(location.hash.slice(1) || 's1');
    if (stillAt != null) { clock.frozen = true; window.step(stillAt).then(() => { document.body.dataset.still = 'ready'; }); }
    else {
        render();
        requestAnimationFrame(loop);
        setInterval(() => { const now = performance.now(); if (!clock.frozen && now - lastRender > 400) { advance(Math.min(250, lastReal == null ? 125 : now - lastReal) * SPEED); lastReal = now; lastRender = now; render(); } }, 250);
    }
})();
</script>
