<!doctype html>
<!--
  SILENT EXODUS · PLAY IDEAS · CLOUD SCOOP: refuelling at a gas giant, as a moment you fly. A standalone mock of one minigame
  idea; nothing in the game is changed. The play is in cloud-scoop.js. NO SOUND: no AudioSystem is loaded, so nothing here
  can make any. The art is the game's own, loaded by relative path so it works on GitHub Pages too.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cloud Scoop</title>
<meta name="description" content="Silent Exodus play idea: dip into a gas giant's clouds for energy. Deeper fills faster, but overheating loses some.">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=IBM+Plex+Sans+Condensed:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* The slice's tokens (prototypes/slice/index.html), so the reused reading layer (reading.css) looks as it does there.
   --t runs 0 at 1280 wide to 1 at 1920 (set by cloud-scoop.js). */
:root {
    color-scheme: dark;
    --t: 1; --px: 3px;
    --ink: #05070a; --text: #e4e4e0; --dim: #8b8d90; --faint: #5a6168; --ui: #c9d1d6; --warm: #f08c2e; --warm-br: #ffc27a; --danger: #e0453a;
    --f-ui: 'IBM Plex Sans Condensed', 'Arial Narrow', sans-serif;
    --f-text: 'IBM Plex Sans', system-ui, sans-serif;
    --f-num: 'IBM Plex Mono', ui-monospace, Consolas, monospace;
    --fs-voice: calc(19px + 5px * var(--t)); --fs-who: calc(14px + 1px * var(--t)); --measure: calc(470px + 150px * var(--t));
    --fs-note-cost: calc(14px + 1px * var(--t)); --fs-title: calc(34px + 12px * var(--t)); --fs-hint: calc(14px + 1px * var(--t));
    --shadow: 0 1px 0 #05070a;
    --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--ink); overflow: hidden; }
body { color: var(--text); font: 400 15px/1.4 var(--f-text); -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none; }
p, h1, ol { margin: 0; }
button { font: inherit; color: inherit; }
#stage { position: fixed; inset: 0; overflow: hidden; outline: none; touch-action: none; cursor: default; }
#stage canvas { position: absolute; left: 0; top: 0; display: block; image-rendering: pixelated; image-rendering: crisp-edges; }

/* the words sit in the dark sky, top left; no boxes */
#spot { position: absolute; left: max(16px, 6vw); top: 8vh; width: var(--measure); max-width: calc(100vw - 32px); }
#spot .voice { position: relative; }
.block { display: grid; gap: 10px; text-shadow: var(--shadow); }
.block[hidden], .choices[hidden] { display: none; }
.title { font: 600 var(--fs-title)/1 var(--f-ui); letter-spacing: 0.02em; color: var(--text); }
.kicker { font: 500 var(--fs-who)/1 var(--f-ui); letter-spacing: 0.18em; text-transform: uppercase; color: var(--dim); }
.block .say { max-width: 30em; }
.choices a.choice { color: inherit; text-decoration: none; }
#after { margin-top: 14px; }
/* the energy gained this pass: small quiet type that rides beside the ship (cloud-scoop.js places it); a loss shows red */
#fuel { position: absolute; left: 0; top: 0; display: flex; gap: 0.7em; align-items: baseline; pointer-events: none; white-space: nowrap;
    font: 400 calc(16px + 3px * var(--t))/1 var(--f-num); color: var(--ui); text-shadow: 0 1px 0 #05070a, 0 0 6px rgba(5, 7, 10, 0.9); }
#fuel[hidden] { display: none; }
#fuel .unit { font-size: 0.78em; color: var(--dim); }
#fuel.is-drinking #fuel-gain { color: var(--text); }
#fuel-loss { color: var(--danger); }
</style>
<link rel="stylesheet" href="../screens/game-screen/reading.css?v=20261008i">
</head>
<body>
<div id="stage" tabindex="-1" aria-label="Our Lander skimming the clouds of a gas giant">
    <canvas id="view" aria-hidden="true"></canvas>
    <p id="fuel" hidden aria-live="off"><span id="fuel-gain"></span><span class="unit">energy</span><span id="fuel-loss"></span></p>
    <div id="spot">
        <section class="block" id="intro">
            <p class="kicker">Play idea</p>
            <h1 class="title">Cloud Scoop</h1>
            <p class="say">Dip into the giant's clouds for energy. Deeper fills faster, but overheating loses some.</p>
            <p class="read-hint">Hold the mouse or Space to dip. Let go to climb.</p>
            <ol class="choices" id="intro-choices">
                <li><button type="button" class="choice" data-act="start"><span class="n">1</span><span class="verb">Start</span><span class="chips"></span></button></li>
                <li><a class="choice" href="index.html"><span class="n">2</span><span class="verb">All ideas</span><span class="chips"></span></a></li>
            </ol>
        </section>
        <div class="voice" id="voice" aria-live="polite">
            <p class="who" id="who"><span class="ring"></span><span id="who-name"></span></p>
            <p class="say" id="line"></p>
        </div>
        <ol class="choices" id="after" hidden>
            <li><button type="button" class="choice" data-act="start"><span class="n">1</span><span class="verb">Play again</span><span class="chips"></span></button></li>
            <li><a class="choice" href="index.html"><span class="n">2</span><span class="verb">All ideas</span><span class="chips"></span></a></li>
        </ol>
    </div>
</div>

<!-- the travel view's picture recipes, skies and worlds (src/newscreen/art), loaded as they are -->
<script src="../../src/newscreen/art/Paint.js"></script>
<script src="../../src/newscreen/art/Sky.js"></script>
<script src="../../src/newscreen/art/Sky2.js"></script>
<script src="../../src/newscreen/art/Worlds.js"></script>
<!-- the minigames' kit (it writes in art/MiniPaint, MiniPeople, MiniCrew) and our Lander; silent: no AudioSystem here -->
<script src="../../src/systems/minigames/MiniLab.js?v=2"></script>
<script src="../../src/systems/minigames/MiniShip.js?v=1"></script>
<script src="play-shade.js"></script>
<script src="cloud-scoop.js"></script>
</body>
</html>
